window.copyInviteLink = function() {
    const link = window.location.origin + window.location.pathname.replace('game.html', 'index.html') + '?code=' + STATE.roomConfig.code;
    try { navigator.clipboard.writeText(link); addToast('Link copiado!', '📋');
    } catch(e) {
        const dummy = document.createElement('input'); document.body.appendChild(dummy);
        dummy.value = link; dummy.select(); document.execCommand('copy'); document.body.removeChild(dummy);
        addToast('Link copiado!', '📋');
    }
};

window.handleImageUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas'); const MAX_SIZE = 150;
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/webp', 0.8);
            STATE.launchData.image = dataUrl;
            const urlInput = document.getElementById('l-image'); if(urlInput) urlInput.value = '';
            const preview = document.getElementById('img-preview');
            if(preview) { preview.src = dataUrl; preview.classList.remove('hidden'); }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};

function saveGame() {
    if(!STATE.roomConfig.isHost) return addToast("Solo el Host puede guardar", "❌");
    const saveData = { players: STATE.players, tokens: STATE.tokens, roomConfig: STATE.roomConfig, chat: STATE.chat, posts: STATE.posts, gameState: STATE.gameState, races: STATE.races };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
    const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `DegenTerminal_Save_${STATE.roomConfig.code}.json`);
    dlAnchorElem.click(); addToast("Partida guardada exitosamente", "💾");
}

function loadGameFromStorage() {
    try {
        const loaded = JSON.parse(sessionStorage.getItem('degen_savegame') || localStorage.getItem('degen_autosave'));
        if(loaded && loaded.players && loaded.roomConfig) {
            STATE.players = loaded.players; STATE.tokens = loaded.tokens || {};
            STATE.roomConfig = loaded.roomConfig; STATE.chat = loaded.chat || []; STATE.posts = loaded.posts || []; STATE.gameState = loaded.gameState || 'waiting';
            STATE.races = loaded.races || {};
            STATE.totalPlayerCount = Object.keys(STATE.players).length;
            
            const hostProfile = Object.values(STATE.players).find(p => !p.isBot) || STATE.players[Object.keys(STATE.players)[0]];
            STATE.myProfile = { ...hostProfile };
            
            const mode = STATE.roomConfig.isOffline ? 'offline' : (STATE.roomConfig.isHost ? 'host' : 'client');
            initNetwork(STATE.roomConfig.code, mode, STATE.roomConfig.botCount);
            
            STATE.route = STATE.gameState === 'playing' ? 'game' : 'lobby';
            addToast("Partida restaurada", "✅"); requestUIRender(true);
        } else { addToast("No se encontraron datos.", "❌"); setTimeout(()=>window.location.href='index.html', 2000); }

function playAudioStream(stream, peerId) {
    let audio = document.getElementById('audio-' + peerId);
    if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'audio-' + peerId;
        audio.autoplay = true;
        document.body.appendChild(audio);
    }
    audio.srcObject = stream;
}

async function toggleVoice() {
    if (STATE.voiceActive) {
        if(voiceInterval) clearInterval(voiceInterval);
        if(audioContext) audioContext.close();
        if(window.localAudioStream) {
            window.localAudioStream.getTracks().forEach(t => t.stop());
            window.localAudioStream = null;
        }
        STATE.voiceActive = false;
        STATE.localSpeaking = false;
        dispatchAction('ACTION_VOICE', { isSpeaking: false });
        tLog("Chat de Voz Desactivado", "text-yellow-400");
        updateUI();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.localAudioStream = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        STATE.voiceActive = true;
        tLog("Chat de Voz Activado", "text-emerald-400");
        updateUI();

        if (peer && !STATE.roomConfig.isOffline) {
            Object.values(STATE.players).forEach(p => {
                if (!p.isBot && p.peerId && p.id !== STATE.myProfile.id) {
                    const call = peer.call(p.peerId, stream);
                    if(call) { call.on('stream', remoteStream => { playAudioStream(remoteStream, p.id); }); }
                }
            });
        }

        voiceInterval = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<bufferLength; i++) sum += dataArray[i];
            let avg = sum / bufferLength;
            
            let isSpeaking = avg > 15; 
            if(isSpeaking !== STATE.localSpeaking) {
                STATE.localSpeaking = isSpeaking;
                dispatchAction('ACTION_VOICE', { isSpeaking: isSpeaking });
                if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = isSpeaking;
                updateUI();
            }
        }, 150); 
    } catch(e) { 
        console.error(e); 
        tLog("Error WebRTC Audio: Permiso Denegado", "text-red-400");
        alert("Permiso de micrófono denegado o no disponible."); 
    }
}

window.adjustBots = function(targetCount) {
    if (!STATE.roomConfig.isHost) return;
    if (!STATE.roomConfig.botsEnabled) targetCount = 0;
    
    STATE.roomConfig.botCount = targetCount; 
    
    const currentBots = Object.values(STATE.players).filter(p => p.isBot && !p.id.startsWith('SYSTEM_'));
    let currentMillionaires = currentBots.filter(p => p.solBalance >= 1000000).length;
    let currentRichBots = currentBots.filter(p => p.solBalance >= 10000 && p.solBalance < 1000000).length;
    
    if (currentBots.length < targetCount) {
        const toAdd = targetCount - currentBots.length;
        const startIndex = currentBots.length;

        for (let i = 0; i < toAdd; i++) {
            let strategy = BOT_STRATEGIES[Math.floor(Math.random() * BOT_STRATEGIES.length)];
            let startBal = 10;
            let botFollowers = 0;
            
            // Forzar 10 millonarios y 100 ballenas de 10k
            if (currentMillionaires < 10) {
                startBal = 1000000 + Math.random() * 2000000; 
                botFollowers = 50000 + Math.floor(Math.random() * 50000);
                strategy = 'Whale'; 
                currentMillionaires++;
            } else if (currentRichBots < 100) {
                startBal = 10000 + Math.random() * 5000; 
                botFollowers = 5000 + Math.floor(Math.random() * 10000);
                strategy = 'Whale'; 
                currentRichBots++;
            } else if (strategy === 'Degen' || strategy === 'Sniper' || strategy === 'RugPuller' || strategy === 'VolumeSniper') { startBal = 40 + Math.random() * 60; botFollowers = 100 + Math.floor(Math.random() * 1000); }
            else if (strategy === 'CopyTrader') { startBal = 80 + Math.random() * 120; botFollowers = 50; }
            else if (strategy === 'PaperHands') { startBal = 15 + Math.random() * 20; botFollowers = Math.floor(Math.random() * 50); }
            else { startBal = 20 + Math.random() * 30; } 
            
            const id = `bot_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
            STATE.players[id] = { 
                id: id, name: `${strategy}_Bot${startIndex + i}`, avatar: '🤖', 
                solBalance: startBal, portfolio: {}, isBot: true, strategy: strategy,
                reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: botFollowers,
                carTuning: { speedLevel: 1, accelLevel: 1 }
            };
        }
    } else if (currentBots.length > targetCount) {
        const toRemove = currentBots.length - targetCount;
        for (let i = 0; i < toRemove; i++) delete STATE.players[currentBots[i].id];
    }
    STATE.totalPlayerCount = Object.keys(STATE.players).length;
    broadcastState();
};

const BROKER_URLS = [
    'wss://broker.emqx.io:8084/mqtt',      
    'wss://broker.hivemq.com:8884/mqtt'  
];
let currentBrokerIndex = 0;

function setupSystemBots() {
    if(!STATE.players['SYSTEM_MM']) STATE.players['SYSTEM_MM'] = { id: 'SYSTEM_MM', name: 'Exchange_MM', avatar: '🏦', isBot: true, isVerified: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, followers: 999999 };
    if(!STATE.players['SYSTEM_CMC']) STATE.players['SYSTEM_CMC'] = { id: 'SYSTEM_CMC', name: 'CoinMarketCap', avatar: '📈', isBot: true, isVerified: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, followers: 500000 };

function initNetwork(rawRoomId, mode, customBotCount = 50) {
    const roomId = String(rawRoomId).trim().toUpperCase(); // Forzar mayúsculas para evitar desconexiones
    
    if (peer && peer.destroy) { peer.destroy(); peer = null; }
    if(mqttClient && mode === 'offline') { mqttClient.end(); mqttClient = null; }
    STATE.netLogs = []; 

    if (mode === 'offline') {
        tLog("Iniciando Entorno de Simulación Local.", "text-purple-400");
        if (!STATE.players[STATE.myProfile.id]) {
            STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
        }
        setupSystemBots();
        window.adjustBots(customBotCount);
        addToast("Modo Offline Activado", "🔌");
        requestUIRender(true);
        startSystemEvents(); 
        startHostAutoSave();
        return;
    }

    const url = BROKER_URLS[currentBrokerIndex];
    tLog(`[PROXY] Conectando servicio de señalización...`, "text-blue-400");
    const clientId = 'degen_' + Math.random().toString(16).substr(2, 8);
    
    if(!mqttClient || !mqttClient.connected) {
        mqttClient = mqtt.connect(url, { clientId, connectTimeout: 5000, reconnectPeriod: 0 });

        mqttClient.on('connect', () => {
            tLog("✓ [VPN-SIM] Señalización lista.", "text-emerald-400");
            mqttClient.options.reconnectPeriod = 1000;
            
            if (mode === 'host') {
                mqttClient.subscribe(`dgn/${roomId}/in`);
                addToast(`Sala Segura Creada/Reconectada: ${roomId}`, '🌐');
                
                if (!STATE.players[STATE.myProfile.id]) {
                    STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
                }
                setupSystemBots();
                window.adjustBots(customBotCount);
                requestUIRender(true);
                startSystemEvents();
                startHostAutoSave();

                if(window.discoveryInterval) clearInterval(window.discoveryInterval);
                window.discoveryInterval = setInterval(() => {
                    if (STATE.roomConfig.isHost && !STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
                        const discoveryPayload = JSON.stringify({
                            code: STATE.roomConfig.code,
                            roomName: STATE.roomConfig.name,
                            hasMap: false,
                            host: STATE.myProfile.name,
                            players: Object.keys(STATE.players).length,
                            max: STATE.roomConfig.maxPlayers,
                            gameState: STATE.gameState
                        });
                        mqttClient.publish('dgn_global_discovery', discoveryPayload);
                        mqttClient.publish('dgn_global_discovery_v2', discoveryPayload);
                    }
                }, 3000);

            } else {
                mqttClient.subscribe(`dgn/${roomId}/out`);
                const joinPacket = { type: 'JOIN_REQ', payload: { ...STATE.myProfile }, senderId: STATE.myProfile.id };
                mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
                addToast("Buscando al Host...", '⏳');
                
                if(window.handshakeInterval) clearInterval(window.handshakeInterval);
                window.handshakeInterval = setInterval(() => {
                    tLog(`[!] Reintentando conexión P2P (Host ocupado)...`, "text-orange-400");
                    mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
                }, 2000);
            }
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (mode === 'host' && topic.endsWith('/in')) processMessageAsHost(data);
                else if (mode === 'client' && topic.endsWith('/out')) processMessageAsClient(data);
            } catch(e) {}
        });

        mqttClient.on('close', () => {
            if (!mqttClient.connected) {
                tLog(`[!] Señalización interrumpida. Recuperando...`, "text-yellow-400");
                currentBrokerIndex = (currentBrokerIndex + 1) % BROKER_URLS.length;
                setTimeout(() => { if(STATE.route === 'lobby' || STATE.route === 'game') initNetwork(roomId, mode, customBotCount); }, 1500);
            }
        });
    }

    // WEBRTC P2P DATA (LA RUTA ULTRA RÁPIDA 0MS)
    if(!peer) {
        try {
            if (mode === 'host') {
                peer = new Peer(`dgn-voice-${roomId}`, WEBRTC_CONFIG);
                window.clientConns = {}; 
                peer.on('open', (id) => { 
                    STATE.myProfile.peerId = id; 
                    STATE.roomConfig.hostPeerId = id; 
                });
                peer.on('connection', (conn) => {
                    conn.on('data', (data) => {
                        if (data.senderId) {
                            window.clientConns[data.senderId] = conn;
                            if (data.type === 'P2P_HELLO') {
                                conn.send({ type: 'STATE_SYNC', payload: getCompressedState() });
                                return;
                            }
                        }
                        if (data.type === 'PING') { conn.send({ type: 'PONG', target: data.senderId, time: data.time }); return; }
                        processMessageAsHost(data);
                    });
                    conn.on('error', (err) => tLog("Error P2P cliente: " + err, "text-yellow-400"));
                });
                peer.on('call', call => {
                    if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                    call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
                });
                peer.on('error', (err) => {
                    tLog("Error WebRTC Servidor: " + err.type, "text-red-400");
                    if (err.type === 'unavailable-id') {
                        // Si el host recarga, el ID antiguo sigue trabado. Generamos uno aleatorio de respaldo.
                        peer.destroy();
                        peer = new Peer(WEBRTC_CONFIG);
                        peer.on('open', (id) => { STATE.myProfile.peerId = id; STATE.roomConfig.hostPeerId = id; broadcastState(); tLog("✓ Servidor P2P de respaldo activado", "text-emerald-400"); });
                    }
                });
            } else {
                peer = new Peer(WEBRTC_CONFIG);
                peer.on('open', (id) => { STATE.myProfile.peerId = id; });
                peer.on('call', call => {
                    if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                    call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
                });
                peer.on('error', (err) => tLog("Error WebRTC Cliente: " + err.type, "text-red-400"));
            }
        } catch(e) { tLog("Servicio WebRTC no disponible.", "text-slate-500"); }
    }

    if (pingerInterval) clearInterval(pingerInterval);
    pingerInterval = setInterval(() => {
        if (STATE.gameState === 'playing' && !STATE.roomConfig.isHost) {
            const pPacket = { type: 'PING', senderId: STATE.myProfile.id, time: Date.now() };
            if (window.dataConn && window.dataConn.open) {
                window.dataConn.send(pPacket);
            } else if (mqttClient && mqttClient.connected) {
                mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(pPacket));
            }
        }
    }, 2000);
}

function processMessageAsHost(data) {
    const { type, payload, senderId, time } = data;
    
    if (type === 'PING') { 
        if (window.clientConns && window.clientConns[senderId] && window.clientConns[senderId].open) {
            window.clientConns[senderId].send({ type: 'PONG', target: senderId, time });
        } else if (mqttClient) {
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'PONG', target: senderId, time })); 
        }
        return; 
    }
    
    if (type === 'JOIN_REQ') {
        if (STATE.players[payload.id]) {
            STATE.players[payload.id].name = payload.name;
            STATE.players[payload.id].avatar = payload.avatar;
        } else {
            if (Object.keys(STATE.players).length >= STATE.roomConfig.maxPlayers) {
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'JOIN_REJECT', target: payload.id, reason: 'Sala llena' }));
                return;
            }
            STATE.players[payload.id] = { ...payload, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
            STATE.totalPlayerCount = Object.keys(STATE.players).length;
        }
        mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'ROOM_CONFIG', payload: STATE.roomConfig, target: payload.id }));
        broadcastState();
    }
    
    if (type === 'ACTION_TRADE') { handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, senderId); broadcastState(); }
    if (type === 'ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, senderId, payload.coFounders);
    if (type === 'ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, senderId);
    if (type === 'ACTION_CHAT') handleChatHost(payload.msg, senderId, false);
    if (type === 'ACTION_POST') handlePostHost(payload.text, senderId);
    if (type === 'ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, senderId);
    if (type === 'ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, senderId);
    if (type === 'ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot && !k.startsWith('SYSTEM_')).length + (payload.amount || 1)); }
    if (type === 'ACTION_CLAIM_FEES') handleClaimFeesHost(payload.tokenId, senderId);
    if (type === 'ACTION_CLAIM_ALL_FEES') handleClaimAllFeesHost(senderId);
    if (type === 'ACTION_UPGRADE_EXCHANGE') handleUpgradeExchangeHost(payload.tokenId, payload.exchange, senderId);
    
    // Racing Actions
    if (type === 'ACTION_TUNE_CAR') handleTuneCarHost(payload.type, senderId);
    if (type === 'ACTION_CREATE_RACE') handleCreateRaceHost(payload.bet, senderId);
    if (type === 'ACTION_JOIN_RACE') handleJoinRaceHost(payload.raceId, senderId);
    if (type === 'ACTION_START_RACE') handleStartRaceHost(payload.raceId, senderId);

    if (type === 'ACTION_CHARITY') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 5); 
            p.followers += Math.floor(payload.amount * 10); 
            handleChatHost(`💖 ${p.name} quemó ${formatUSD(payload.amount)} por beneficencia!`, senderId, true);
            broadcastState();
        }
    }
    if (type === 'ACTION_AIRDROP') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 8); 
            p.followers += Math.floor(payload.amount * 20); 
            const humans = Object.values(STATE.players).filter(pl => !pl.isBot && pl.id !== senderId);
            if (humans.length > 0) {
                const split = payload.amount / humans.length;
                humans.forEach(h => { h.solBalance += split; });
                handleChatHost(`🚁 AIRDROP: ${p.name} repartió ${formatUSD(payload.amount)} a ${humans.length} degens!`, senderId, true);
            } else { handleChatHost(`🚁 ${p.name} intentó un Airdrop, pero no hay humanos. Se quemaron.`, senderId, true); }
            broadcastState();
        }
    }
    if (type === 'ACTION_CASINO') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount;
            if(Math.random() > 0.5) {
                p.solBalance += (payload.amount * 2);
                handleChatHost(`🎰 ¡${p.name} ganó ${formatUSD(payload.amount)} en el Casino! x2`, senderId, true);
            } else { handleChatHost(`🎰 ${p.name} fue liquidado y perdió ${formatUSD(payload.amount)} en el Casino. F`, senderId, true); }
            broadcastState();
        }
    }
    if (type === 'ACTION_STAKE') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.solStaked = (p.solStaked || 0) + payload.amount;
            broadcastState();
        }
    }
    if (type === 'ACTION_UNSTAKE') {
        const p = STATE.players[senderId];
        if(p && p.solStaked >= payload.amount && payload.amount > 0) {
            p.solStaked -= payload.amount; p.solBalance += payload.amount;
            broadcastState();
        }
    }
}

function processMessageAsClient(data) {
    const { type, payload, senderId, time, target } = data;
    
    if (type === 'ROOM_CONFIG' && target === STATE.myProfile.id) {
        if (window.handshakeInterval) clearInterval(window.handshakeInterval); // Romper bucle de espera inmediatamente
        STATE.roomConfig.name = payload.name;
        STATE.roomConfig.hostPeerId = payload.hostPeerId; 
        STATE.roomConfig.botPostsEnabled = payload.botPostsEnabled;
        requestUIRender(true);

        if (payload.hostPeerId && (!window.dataConn || !window.dataConn.open)) {
            try {
                window.dataConn = peer.connect(payload.hostPeerId, { reliable: true, serialization: 'json' });
                window.dataConn.on('open', () => { 
                    tLog("⚡ Conexión P2P Directa Establecida (Latencia 0ms)", "text-cyan-400"); 
                    window.dataConn.send({ type: 'P2P_HELLO', senderId: STATE.myProfile.id });
                });
                window.dataConn.on('data', (data) => processMessageAsClient(data));
                window.dataConn.on('error', (err) => tLog("Error flujo P2P: " + err, "text-red-400"));
            } catch(e) { tLog("Fallo de instanciación P2P: " + e.message, "text-red-400"); }
        }
    }
    
    if (type === 'STATE_SYNC') {
        if (window.handshakeInterval) clearInterval(window.handshakeInterval);
        if (STATE.lastSyncTime && time && time < STATE.lastSyncTime) return; 
        if (time) STATE.lastSyncTime = time;

        STATE.players = payload.players; 
        STATE.tokens = payload.tokens; 
        STATE.gameState = payload.gameState; 
        STATE.chat = payload.chat;
        STATE.races = payload.races || {};
        if(payload.posts) STATE.posts = payload.posts;
        if(payload.totalPlayerCount) STATE.totalPlayerCount = payload.totalPlayerCount;
        
        let force = false;
        if(STATE.route === 'lobby' && STATE.gameState === 'playing') { STATE.route = 'game'; force = true; }
        requestUIRender(force);
    }
    
    if (type === 'PONG' && target === STATE.myProfile.id) { STATE.ping = Date.now() - time; const pingEl = document.getElementById('ping-display'); if(pingEl) pingEl.innerText = STATE.ping + 'ms'; }
    if (type === 'JOIN_REJECT' && target === STATE.myProfile.id) {
        addToast("Error: " + payload.reason, "❌"); if(mqttClient) { mqttClient.end(); mqttClient = null; }
        setTimeout(() => window.location.href = 'index.html', 2000);
    }
    if (type === 'EVENT_ALERT') { if (STATE.trackedIds.has(senderId)) addToast(payload.msg, payload.icon); }
}

// ---------------- ALGORITMO COMPRESIÓN (PING 0MS REAL) ----------------
function getCompressedState() {
    const humans = {};
    const bots = [];
    
    Object.values(STATE.players).forEach(p => {
        if (!p.isBot || p.id.startsWith('SYSTEM_')) humans[p.id] = p;
        else bots.push(p);
    });

    bots.sort((a,b) => (b.solBalance + (b.solStaked||0)) - (a.solBalance + (a.solStaked||0)));
    const topBots = bots.slice(0, 50); // Reducido a 50 para evitar límite de payload de MQTT
    
    const compressedPlayers = { ...humans };
    topBots.forEach(b => compressedPlayers[b.id] = b);

    const compressedTokens = {};
    Object.values(STATE.tokens).forEach(t => {
        compressedTokens[t.id] = {
            ...t,
            history: t.history ? t.history.slice(-15) : [] // Límite de velas estricto
        };
    });

    return { 
        players: compressedPlayers, 
        tokens: compressedTokens, 
        chat: STATE.chat.slice(0, 20), 
        posts: STATE.posts.slice(0, 20), 
        races: STATE.races,
        gameState: STATE.gameState,
        totalPlayerCount: Object.keys(STATE.players).length
    };
}

let lastMqttBroadcast = 0;

function broadcastState() {
    if (STATE.roomConfig.isHost) {
        requestUIRender(); 
        const syncTime = Date.now();
        const syncPayload = getCompressedState(); 

        // P2P ULTRA RÁPIDO (0ms Latencia - Sin Throttling)
        if (window.clientConns) {
            const msgObjFull = { type: 'STATE_SYNC', time: syncTime, payload: syncPayload };
            Object.values(window.clientConns).forEach(c => {
                if(c.open) c.send(msgObjFull);
            });
        }

        // MQTT Fallback (Ligero) - Limitado a 1 vez por segundo
        if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
            if (syncTime - lastMqttBroadcast > 1000) {
                lastMqttBroadcast = syncTime;
                const msg = { type: 'STATE_SYNC', time: syncTime, payload: syncPayload };
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(msg));
            }
        }
    }
}

function hostEmitAlert(senderId, msg, icon) {
    if(STATE.roomConfig.isHost) {
        if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
            const packet = { type: 'EVENT_ALERT', senderId, payload: { msg, icon } };
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(packet));
        }
        if (STATE.trackedIds.has(senderId)) addToast(msg, icon);
    }
}

function calculateHypeMultiplier(tokenTicker) {
    let hype = 1.0;
    STATE.posts.slice(0, 30).forEach(p => {
        if(p.text.includes(`$${tokenTicker}`)) {
            const author = STATE.players[p.authorId];
            if(author && author.followers > 0) {
                hype += (author.followers / 20000); 
            }
        }
    });
    return Math.min(hype, 5.0); 
}

function handleTradeHost(tokenId, isBuy, amount, playerId, silent = false) {
    const player = STATE.players[playerId];
    const token = STATE.tokens[tokenId];
    if (!player || !token || amount <= 0) return;

    if (!player.tradesInfo) player.tradesInfo = {};
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    
    let currentCandle = token.currentCandle;
    if (!currentCandle || Date.now() - currentCandle.time > 5000) { 
        if (currentCandle) {
            token.history.push(currentCandle);
            if (token.history.length > 100) token.history.shift();
        }
        currentCandle = { time: Date.now(), open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, vol: 0 };
    }

    // Fee system (2%)
    let netAmount = amount;
    if(!player.isBot || player.id.startsWith('SYSTEM_')) {
        const fee = amount * 0.02;
        netAmount = amount - fee;
        token.accumulatedFees = (token.accumulatedFees || 0) + (isBuy ? fee : 0); // Fees solo se guardan en USD para reclamar
    }

    if (isBuy) {
        if (player.solBalance < amount) return;
        const tokensOut = calcTokensOut(netAmount, token.solPool, token.tokenPool);
        token.solPool += netAmount; token.tokenPool -= tokensOut;
        player.solBalance -= amount; player.portfolio[tokenId] = (player.portfolio[tokenId] || 0) + tokensOut;
        player.tradesInfo[tokenId] = { entryPrice: getPrice(token.solPool, token.tokenPool) };
        
        // CopyTrading Hook
        if(!silent && player.followers > 50 && (player.reputation > 50 || !player.isBot)) {
            const numCopiers = Math.min(Math.floor(player.followers / 100), 10);
            const copyBots = Object.values(STATE.players).filter(p => p.isBot && p.strategy === 'CopyTrader' && p.solBalance > 5);
            for(let i=0; i<numCopiers && i<copyBots.length; i++) {
                setTimeout(() => {
                    handleTradeHost(tokenId, true, copyBots[i].solBalance * 0.2, copyBots[i].id, true);
                    broadcastState();
                }, 1000 + Math.random()*3000);
            }
        }

    } else {
        const currentBal = player.portfolio[tokenId] || 0;
        let sellAmount = amount;
        if (amount >= currentBal * 0.999) sellAmount = currentBal;
        if (currentBal < sellAmount) return;

        if (sellAmount > (token.tokenPool * 0.5) && !player.isBot) player.reputation = Math.max(1, (player.reputation || 1) - 30);

        const solOut = calcSolOut(sellAmount, token.solPool, token.tokenPool);
        const fee = solOut * 0.02;
        const netSolOut = player.isBot && !player.id.startsWith('SYSTEM_') ? solOut : (solOut - fee);
        token.accumulatedFees = (token.accumulatedFees || 0) + (player.isBot && !player.id.startsWith('SYSTEM_') ? 0 : fee);

        token.solPool -= solOut; token.tokenPool += sellAmount;
        player.solBalance += netSolOut; player.portfolio[tokenId] -= sellAmount;
        if(player.portfolio[tokenId] <= 0) delete player.tradesInfo[tokenId];
    }

    const newPrice = getPrice(token.solPool, token.tokenPool);
    currentCandle.close = newPrice; currentCandle.high = Math.max(currentCandle.high, newPrice);
    currentCandle.low = Math.min(currentCandle.low, newPrice); currentCandle.vol += amount;
    token.currentCandle = currentCandle;

    let milestoneMsg = null;
    let postMsg = null;
    let posterSys = 'SYSTEM_MM';
    const mcapUsd = newPrice * token.initialSupply; 
    const vRes = token.virtualSol || VIRTUAL_USD_RESERVE;
    const cLim = token.curveLimit || BONDING_CURVE_LIMIT;
    const realLiq = token.solPool - vRes;

    if (!token.milestones) token.milestones = {};
    const creator = STATE.players[token.creatorId];

    if (realLiq >= cLim && !token.milestones.mRaydium) {
        token.milestones.mRaydium = true; 
        milestoneMsg = `👑 $${token.ticker} COMPLETÓ LA CURVA Y SE FUE A RAYDIUM!`;
        postMsg = `Acabo de ver a $${token.ticker} tocar Raydium. El dev es un chad. Enhorabuena. 🔥`;
        if(creator) { 
            creator.reputation = Math.min(100, (creator.reputation || 1) + 20); 
            creator.followers += 500 + Math.floor(Math.random() * 500); 
        }
    } else if (mcapUsd >= 1000000 && !token.milestones.m1m) { 
        token.milestones.m1m = true; 
        milestoneMsg = `🚀 $${token.ticker} ALCANZÓ $1M MCap!`; 
        postMsg = `$${token.ticker} superó el Millón de Market Cap. ¿Quién más está holdeando? 💎`;
        if(creator) { creator.followers += 100 + Math.floor(Math.random() * 100); }
    }

    if (!silent && milestoneMsg) {
        STATE.chat.unshift({ id: Date.now() + Math.random(), sender: 'System', text: milestoneMsg, sys: true });
        STATE.chat = STATE.chat.slice(0, 80);
        if(postMsg) handlePostHost(postMsg, posterSys);
    }
}

function handleLaunchHost(name, ticker, image, devBuy, playerId, coFounders = []) {
    const creators = [playerId, ...(coFounders || [])].filter(id => STATE.players[id]); // Valid players only
    const numCreators = creators.length;
    const feePerPerson = 1 / numCreators;
    const actualDevBuy = Math.max(0, devBuy);
    const devBuyPerPerson = actualDevBuy / numCreators;
    const totalCostPerPerson = feePerPerson + devBuyPerPerson;

    // Check if all creators have enough balance
    for (let id of creators) {
        if (STATE.players[id].solBalance < totalCostPerPerson) {
            if (id === playerId) hostEmitAlert(playerId, "No tienes suficiente saldo para el lanzamiento.", "❌");
            else hostEmitAlert(playerId, `El co-fundador ${STATE.players[id].name} no tiene saldo suficiente.`, "❌");
            return;
        }
    }

    // Deduct balances
    creators.forEach(id => {
        STATE.players[id].solBalance -= totalCostPerPerson;
        STATE.players[id].reputation = Math.min(100, (STATE.players[id].reputation || 1) + 0.5);
        STATE.players[id].followers += 10;
    });
    
    // Logica AMM Realista: La inversión del dev añade a la liquidez virtual base (x3)
    const vSol = VIRTUAL_USD_RESERVE + (actualDevBuy * 3);
    const cLim = BONDING_CURVE_LIMIT + (actualDevBuy * 3);
    const initialPrice = vSol / 1000000000; 
    
    const tokenId = ticker.toUpperCase() + '_' + Date.now();
    
    const creatorNames = creators.map(id => STATE.players[id].name).join(', ');

    STATE.tokens[tokenId] = {
        id: tokenId, name, ticker: ticker.toUpperCase(), image: image, 
        creatorId: playerId, creatorIds: creators, creatorName: creatorNames,
        solPool: vSol, tokenPool: 1000000000, initialSupply: 1000000000, createdAt: Date.now(),
        virtualSol: vSol, curveLimit: cLim,
        milestones: {}, history: [], exchange: 'Pump.fun', accumulatedFees: 0, totalFeesEarned: 0,
        currentCandle: { time: Date.now(), open: initialPrice, high: initialPrice, low: initialPrice, close: initialPrice, vol: 0 }
    };
    
    const logMsg = `🚀 ${creatorNames} lanzaron $${STATE.tokens[tokenId].ticker}`;
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: logMsg, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    
    creators.forEach(id => hostEmitAlert(id, logMsg, '🚀'));
    
    if (actualDevBuy > 0) {
        creators.forEach(id => {
            handleTradeHost(tokenId, true, devBuyPerPerson, id, false);
        });
    }
    
    broadcastState();
}

function handleBurnHost(tokenId, amount, playerId) {
    const player = STATE.players[playerId]; const token = STATE.tokens[tokenId];
    if (!player || !token || !player.portfolio[tokenId] || player.portfolio[tokenId] < amount) return;
    player.portfolio[tokenId] -= amount; token.initialSupply -= amount;

function handleGiftHost(targetId, asset, amount, senderId) {
    const sender = STATE.players[senderId]; const target = STATE.players[targetId];
    if (!sender || !target || amount <= 0) return;
    if (asset === 'USD') {
        if (sender.solBalance < amount) return;

    }

}

function handleClaimFeesHost(tokenId, playerId) {

    const creators = token.creatorIds || [token.creatorId];

    if(!token || !player || !creators.includes(playerId) || token.accumulatedFees <= 0) return;

    creators.forEach(id => {
        if (STATE.players[id]) {

    broadcastState();

function handleClaimAllFeesHost(playerId) {
    const player = STATE.players[playerId];
    if(!player) return;
    let totalClaimedForMe = 0;
    
    Object.values(STATE.tokens).forEach(t => {
        const creators = t.creatorIds || [t.creatorId];
        if(creators.includes(playerId) && t.accumulatedFees > 0) {
            const claimAmtTotal = t.accumulatedFees;
            const claimAmtPerPerson = claimAmtTotal / creators.length;

            creators.forEach(id => {

            t.totalFeesEarned = (t.totalFeesEarned || 0) + claimAmtTotal;
            t.accumulatedFees = 0;
        }

function handleUpgradeExchangeHost(tokenId, exchangeName, playerId) {

// ---- RACING LOGIC ----
function handleCreateRaceHost(bet, playerId) {
    const player = STATE.players[playerId];
    if(!player || player.solBalance < bet || bet < 1) return;
    
    player.solBalance -= bet;
    const raceId = 'race_' + Date.now();
    STATE.races[raceId] = {
        id: raceId, hostId: playerId, hostName: player.name, bet: bet, state: 'waiting',
        participants: [{ id: playerId, name: player.name, avatar: player.avatar, tuning: player.carTuning }]
    };
    broadcastState();
}

function handleJoinRaceHost(raceId, playerId) {
    const race = STATE.races[raceId];
    const player = STATE.players[playerId];
    if(!race || !player || race.state !== 'waiting' || player.solBalance < race.bet) return;
    
    if(race.participants.find(p => p.id === playerId)) return;
    
    player.solBalance -= race.bet;
    race.participants.push({ id: playerId, name: player.name, avatar: player.avatar, tuning: player.carTuning });
    broadcastState();
}

function handleStartRaceHost(raceId, playerId) {
    const race = STATE.races[raceId];
    if(!race || race.state !== 'waiting' || race.hostId !== playerId || race.participants.length < 2) return;
    
    race.state = 'racing';
    race.startTime = Date.now();
    race.duration = 6000; // 6 segundos de carrera visual
    
    // Pre-calcular ganador
    let maxScore = -1;
    let winner = null;
    race.participants.forEach(p => {
        const speed = p.tuning?.speedLevel || 1;
        const accel = p.tuning?.accelLevel || 1;
        const score = (speed * 0.6) + (accel * 0.4) + (Math.random() * 5); // Tuning + RNG Suerte
        p.score = score;
        if(score > maxScore) { maxScore = score; winner = p; }
    });
    race.maxScore = maxScore;
    race.winner = winner.id;
    
    broadcastState();

    setTimeout(() => {
        race.state = 'finished';
        const pot = race.bet * race.participants.length;
        const winnerPlayer = STATE.players[winner.id];
        if(winnerPlayer) winnerPlayer.solBalance += pot;
        
        handleChatHost(`🏁 ${winner.name} ganó la carrera y se llevó ${formatUSD(pot)}!`, 'System', true);
        broadcastState();
        
        setTimeout(() => {
            delete STATE.races[raceId];
            broadcastState();
        }, 10000);

    }, 6000);
}

function handleTuneCarHost(type, playerId) {
    const player = STATE.players[playerId];
    if(!player || !player.carTuning) return;
    const cost = 20;
    if(player.solBalance < cost) return;
    
    player.solBalance -= cost;
    if(type === 'speed') player.carTuning.speedLevel += 1;
    if(type === 'accel') player.carTuning.accelLevel += 1;
    
    hostEmitAlert(playerId, "Tuning mejorado con éxito!", "🛠️");
    broadcastState();
}

// BOT BRAIN OPTIMIZADO
function startBotBrain() {
    if(botInterval) clearInterval(botInterval);
    botInterval = setInterval(() => {
        if (!STATE.roomConfig.isHost || !STATE.roomConfig.botsEnabled || STATE.gameState !== 'playing') return;
        
        const botList = Object.values(STATE.players).filter(p => p.isBot && !p.id.startsWith('SYSTEM_'));
        if (botList.length === 0) return;

        const tokenKeys = Object.keys(STATE.tokens);
        // Para no destruir el rendimiento con 10,000 bots, limitamos las acciones por tick a máx 100 bots.
        const activeCount = Math.min(100, Math.max(5, Math.floor(botList.length * 0.02)));
        const activeBots = botList.sort(() => 0.5 - Math.random()).slice(0, activeCount);
        let didTrade = false;

        activeBots.forEach(bot => {
            Object.keys(bot.portfolio).forEach(tokenId => {
                const amount = bot.portfolio[tokenId]; if (amount <= 0) return;
                const token = STATE.tokens[tokenId]; if (!token) return;

                const currentPrice = getPrice(token.solPool, token.tokenPool);
                const entryPrice = bot.tradesInfo?.[tokenId]?.entryPrice || currentPrice;
                const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
                let sellRatio = 0;
                
                if (bot.strategy === 'RugPuller') { if (pnlPercent > 100) sellRatio = 1.0; }
                else if (pnlPercent <= -20 && bot.strategy !== 'Hodler') sellRatio = 1.0;
                else if (pnlPercent >= 50) sellRatio = bot.strategy === 'Scalper' ? 1.0 : 0.5;
                else {
                    if (bot.strategy === 'Scalper' && Math.random() < 0.1) sellRatio = 0.5;
                    if (bot.strategy === 'Degen' && Math.random() < 0.15) sellRatio = 1.0;
                    if (bot.strategy === 'Whale' && Math.random() < 0.05) sellRatio = 0.8;
                    if (bot.strategy === 'VolumeSniper' && pnlPercent > 20) sellRatio = 1.0;
                    if (bot.strategy === 'PaperHands' && pnlPercent <= -5) sellRatio = 1.0; 
                }

                if (sellRatio > 0) {
                    // Prevent giant dumps that crash the exchange completely instantly
                    let dumpAmount = amount * sellRatio;
                    // Calculate how much USD this dump is worth roughly
                    const estUsdValue = (dumpAmount / token.tokenPool) * token.solPool;
                    const maxSafeDumpUsd = token.solPool * 0.4; // Max dump 40% of pool at once
                    
                    if (estUsdValue > maxSafeDumpUsd) {
                        // Scale down the dump amount to not drain more than 40% of liquidity
                        dumpAmount = dumpAmount * (maxSafeDumpUsd / estUsdValue);
                    }
                    
                    if(dumpAmount > 0) {
                        handleTradeHost(tokenId, false, dumpAmount, bot.id, true); 
                        didTrade = true;
                    }
                }
            });

            if (bot.solBalance > 0.5 && tokenKeys.length > 0 && Math.random() < 0.3) {
                const attractiveTokens = tokenKeys.map(tid => STATE.tokens[tid]).filter(t => {
                    const ageMs = Date.now() - t.createdAt; const creatorRep = STATE.players[t.creatorId]?.reputation || 1;
                    const vRes = t.virtualSol || VIRTUAL_USD_RESERVE;
                    
                    // Exchange factor
                    let exchMultiplier = 1.0;
                    if(t.exchange === 'Binance') exchMultiplier = 5.0;
                    if(t.exchange === 'KuCoin') exchMultiplier = 3.0;
                    if(t.exchange === 'CoinMarketCap') exchMultiplier = 2.0;

                    // Millionaire logic: Strict risk control
                    if (bot.solBalance >= 1000000) {
                        // Only buy established coins with good liquidity or exchanges
                        if (t.exchange === 'Pump.fun' && (t.solPool - vRes) < 50) return false;
                        if (creatorRep < 50 && t.exchange === 'Pump.fun') return false;
                    }

                    if (bot.strategy === 'Sniper') return ageMs < 120000;
                    if (bot.strategy === 'VolumeSniper') return ageMs > 300000 && t.currentCandle.vol > 10;
                    if (creatorRep < 10 && bot.strategy !== 'RugPuller' && bot.strategy !== 'Degen') return false; 
                    
                    let hypeMulti = calculateHypeMultiplier(t.ticker) * exchMultiplier;
                    const baseProb = 0.4;
                    if (Math.random() > (baseProb * hypeMulti)) return false; 

                    if (bot.strategy === 'Scalper') return (t.solPool - vRes) > 2; 
                    if (bot.strategy === 'Hodler') return ageMs > 60000 && (t.solPool - vRes) > 5;
                    return true;
                });

                if (attractiveTokens.length > 0) {
                    const targetToken = attractiveTokens[Math.floor(Math.random() * attractiveTokens.length)];
                    const vRes = targetToken.virtualSol || VIRTUAL_USD_RESERVE;
                    const cLim = targetToken.curveLimit || BONDING_CURVE_LIMIT;
                    
                    let investRatio = 0.1;
                    if (bot.strategy === 'Degen' || bot.strategy === 'Sniper' || bot.strategy === 'RugPuller' || bot.strategy === 'VolumeSniper') investRatio = 0.5; 
                    if (bot.strategy === 'Whale') investRatio = 0.2; 
                    if (bot.strategy === 'CopyTrader') investRatio = 0.3;

                    // Smart Risk Control (Cap investments based on dynamic market depth)
                    let maxSafeInvest = 5; // Default safe for pump.fun early curve
                    if (targetToken.exchange === 'Binance') maxSafeInvest = 10000;
                    else if (targetToken.exchange === 'KuCoin') maxSafeInvest = 5000;
                    else if (targetToken.exchange === 'CoinMarketCap') maxSafeInvest = 2500;
                    else if ((targetToken.solPool - vRes) > cLim) maxSafeInvest = 1000; // Raydium
                    else maxSafeInvest = Math.max(5, (cLim - (targetToken.solPool - vRes)) * 0.5); // Up to 50% of remaining curve
                    
                    // Millionaires have strict max allocations to avoid breaking the AMM
                    if (bot.solBalance >= 1000000) {
                        investRatio = 0.05; // 5% max of their portfolio per trade
                        maxSafeInvest = Math.max(maxSafeInvest, 50000); // Massive buying power
                    } else if (bot.solBalance >= 10000) {
                        investRatio = 0.10; // 10% max of their portfolio per trade
                        maxSafeInvest = Math.max(maxSafeInvest, 15000); // 15k max buy
                    }

                    const rawInvestAmount = bot.solBalance * investRatio * (0.8 + Math.random() * 0.4); 
                    const investAmount = Math.min(rawInvestAmount, maxSafeInvest);

                    if (investAmount > 0.1) { handleTradeHost(targetToken.id, true, investAmount, bot.id, true); didTrade = true; }
                }
            }

            const canLaunch = bot.solBalance > 5 && tokenKeys.length < 50;
            const wantsToLaunch = (bot.strategy === 'Degen' && Math.random() < 0.02) || (bot.strategy === 'RugPuller' && Math.random() < 0.05) || Math.random() < 0.005;
            if (canLaunch && wantsToLaunch && bot.solBalance < 1000000) { // Millionaires don't launch shitcoins
                const names = ["PepeBot", "Inu AI", "Safe", "Moon", "Cat", "Doge", "Gold", "Sigma", "Turbo"];
                const tName = names[Math.floor(Math.random()*names.length)] + " " + Math.floor(Math.random()*99);
                handleLaunchHost(tName, tName.substring(0,4).toUpperCase().replace(/\s/g, ''), '', bot.solBalance * 0.1, bot.id);
                didTrade = true;
            }
        });
        
        if(didTrade) broadcastState();
    }, 1500); 
}

// CLIENT ACTIONS DISPATCHER
function dispatchAction(type, payload) {
    if (STATE.roomConfig.isHost) {
        if(type==='ACTION_TRADE') { handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, STATE.myProfile.id); broadcastState(); }
        if(type==='ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, STATE.myProfile.id, payload.coFounders);
        if(type==='ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_CHAT') handleChatHost(payload.msg, STATE.myProfile.id, false);
        if(type==='ACTION_POST') handlePostHost(payload.text, STATE.myProfile.id);
        if(type==='ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, STATE.myProfile.id);
        if(type==='ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot && !k.startsWith('SYSTEM_')).length + (payload.amount || 1)); }
        if(type==='ACTION_CLAIM_FEES') handleClaimFeesHost(payload.tokenId, STATE.myProfile.id);
        if(type==='ACTION_CLAIM_ALL_FEES') handleClaimAllFeesHost(STATE.myProfile.id);
        if(type==='ACTION_UPGRADE_EXCHANGE') handleUpgradeExchangeHost(payload.tokenId, payload.exchange, STATE.myProfile.id);
        
        if(type==='ACTION_CREATE_RACE') handleCreateRaceHost(payload.bet, STATE.myProfile.id);
        if(type==='ACTION_JOIN_RACE') handleJoinRaceHost(payload.raceId, STATE.myProfile.id);
        if(type==='ACTION_START_RACE') handleStartRaceHost(payload.raceId, STATE.myProfile.id);
        if(type==='ACTION_TUNE_CAR') { handleTuneCarHost(payload.type, STATE.myProfile.id); }

        if(type==='ACTION_CHARITY') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 5);
                p.followers += Math.floor(payload.amount * 10);
                handleChatHost(`💖 ${p.name} quemó ${formatUSD(payload.amount)} por beneficencia!`, STATE.myProfile.id, true); broadcastState();
            }
        }
        if(type==='ACTION_AIRDROP') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 8);
                p.followers += Math.floor(payload.amount * 20);
                const humans = Object.values(STATE.players).filter(pl => !pl.isBot && pl.id !== STATE.myProfile.id);
                if (humans.length > 0) {
                    const split = payload.amount / humans.length; humans.forEach(h => { h.solBalance += split; });
                    handleChatHost(`🚁 AIRDROP MASIVO: ${p.name} repartió ${formatUSD(payload.amount)} a ${humans.length} degens!`, STATE.myProfile.id, true);
                } else { handleChatHost(`🚁 ${p.name} intentó un Airdrop, pero no hay humanos. Se quemaron.`, STATE.myProfile.id, true); }
                broadcastState();
            }
        }
        if(type==='ACTION_CASINO') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount;
                if(Math.random() > 0.5) { p.solBalance += (payload.amount * 2); handleChatHost(`🎰 ¡${p.name} ganó ${formatUSD(payload.amount)} en el Casino! x2`, STATE.myProfile.id, true); } 
                else { handleChatHost(`🎰 ${p.name} fue liquidado y perdió ${formatUSD(payload.amount)} en el Casino. F`, STATE.myProfile.id, true); }
                broadcastState();
            }
        }
        if(type==='ACTION_STAKE') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) { p.solBalance -= payload.amount; p.solStaked = (p.solStaked || 0) + payload.amount; broadcastState(); }
        }
        if(type==='ACTION_UNSTAKE') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solStaked >= payload.amount && payload.amount > 0) { p.solStaked -= payload.amount; p.solBalance += payload.amount; broadcastState(); }
        }
        if(type==='ACTION_VOICE') {
            if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = payload.isSpeaking;
            broadcastState();
        }
    } else {
        const packet = { type, payload, senderId: STATE.myProfile.id };
        if (window.dataConn && window.dataConn.open) {
            window.dataConn.send(packet); 
        } else if(mqttClient && mqttClient.connected) {
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/in`, JSON.stringify(packet)); 
        }
    }
}

// RENDERING UI ENGINE
function switchTab(tabId) { STATE.activeTab = tabId; STATE.selectedTokenId = null; STATE._renderedTabId = null; updateUI(); }
function selectToken(id) { STATE.selectedTokenId = id; STATE.tradeAmount = ''; STATE._renderedTabId = null; updateUI(); }
function setTradeType(type) { STATE.tradeType = type; STATE.tradeAmount = ''; STATE._renderedTabId = null; updateUI(); }

function addToast(msg, icon) {
    const id = Date.now() + Math.random(); STATE.toasts.push({ id, msg, icon }); updateToasts();
    setTimeout(() => { STATE.toasts = STATE.toasts.filter(t => t.id !== id); updateToasts(); }, 4000);
}

function updateToasts() {
    const c = document.getElementById('toasts-container');
    if (c) c.innerHTML = STATE.toasts.map(t => `<div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto"><span>${t.icon}</span> ${t.msg}</div>`).join('');
}

function requestUIRender(forceFull = false) {
    if (forceFull || STATE.route !== 'game') {
        const app = document.getElementById('app');
        if (STATE.route === 'lobby') app.innerHTML = ViewLobby();
        else if (STATE.route === 'game') { app.innerHTML = ViewGame(); STATE._renderedTabId = null; updateDynamicDOM(); }
        return;
    }
    if(uiRenderScheduled) return; uiRenderScheduled = true;
    requestAnimationFrame(() => { updateDynamicDOM(); uiRenderScheduled = false; });
}

function updateUI() { requestUIRender(true); }

function updateDynamicDOM() {
    const me = STATE.players[STATE.myProfile.id] || { solBalance: 0 };
    const balEl = document.getElementById('my-balance'); if(balEl) balEl.innerText = formatUSD(me.solBalance);
    
    const tickerEl = document.getElementById('trending-marquee');
    if (tickerEl) {
        const trends = Object.values(STATE.tokens).sort((a,b) => b.solPool - a.solPool).slice(0, 8);
        if(trends.length > 0) tickerEl.innerHTML = trends.map(t => `<span class="mx-4">🔥 <span class="font-black text-white">$${t.ticker}</span> (${formatUSD(t.solPool - (t.virtualSol || VIRTUAL_USD_RESERVE))})</span>`).join(' • ');
        else tickerEl.innerHTML = "EL MERCADO ESTÁ VACÍO. SÉ EL PRIMERO EN CREAR UN TOKEN.";
    }
    
    const renderChatMessages = (containerId, limit, hideSys) => {
        const cEl = document.getElementById(containerId);
        if (cEl) {
            let messages = STATE.chat;
            if(hideSys) messages = messages.filter(m => !m.sys);
            else messages = messages.filter(m => STATE.chatTab === 'global' ? !m.sys : m.sys);
            
            cEl.innerHTML = messages.slice(0, limit).map(msg => {
                const isImg = msg.text.match(/^https?:\/\/.*\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i) || msg.text.startsWith('data:image');
                let senderTag = msg.sender;
                if(!msg.sys && msg.sender !== 'System') {
                    const sp = Object.values(STATE.players).find(p => p.name === msg.sender);
                    if(sp) { const rank = getRank(sp.solBalance + (sp.solStaked||0)); senderTag = `<span class="opacity-70">${rank.emoji}</span> ${msg.sender} ${sp.isVerified?'<span class="text-blue-400">✅</span>':''}`; }
                }
                
                return `
                <div class="p-3 rounded-xl ${msg.sys ? 'text-slate-400 font-mono text-[10px] md:text-xs border border-slate-800/50 bg-slate-950/80 shadow-inner' : 'bg-slate-800/80 text-slate-200 border border-slate-700/50'}">
                    ${!msg.sys ? `<div class="font-bold text-emerald-400 text-xs mb-1 flex items-center gap-1">${senderTag}</div>` : ''}
                    ${isImg ? `<img src="${msg.text}" class="max-w-full rounded-lg mt-2 cursor-pointer border border-slate-700 hover:border-emerald-500 transition-colors" onclick="window.open('${msg.text}', '_blank')"/>` : `<div class="leading-relaxed break-words">${msg.text}</div>`}
                </div>`;
            }).join('') || `<div class="text-center text-slate-500 py-10 italic">Aún no hay mensajes.</div>`;
        }
    };

    renderChatMessages('chat-list', 80, false);

    const el = document.getElementById('tab-content'); if (!el) return;
    let currentTabId = STATE.selectedTokenId ? 'detail-' + STATE.selectedTokenId + '-' + STATE.tradeType : STATE.activeTab;
    
    if (STATE._renderedTabId !== currentTabId) {
        if (STATE.selectedTokenId) el.innerHTML = RenderTokenDetailSkeleton();
        else if (STATE.activeTab === 'market') el.innerHTML = RenderMarketSkeleton();
        else if (STATE.activeTab === 'exchanges') el.innerHTML = RenderExchangesSkeleton();
        else if (STATE.activeTab === 'devpanel') el.innerHTML = RenderDevPanelSkeleton();
        else if (STATE.activeTab === 'social') el.innerHTML = RenderSocialSkeleton();
        else if (STATE.activeTab === 'portfolio') el.innerHTML = RenderLeaderboardSkeleton();
        else if (STATE.activeTab === 'shop') el.innerHTML = RenderShop();
        else if (STATE.activeTab === 'launch') el.innerHTML = RenderLaunch();
        else if (STATE.activeTab === 'casino') el.innerHTML = RenderCasino();
        else if (STATE.activeTab === 'racing') el.innerHTML = RenderRacing();
        else if (STATE.activeTab === 'bank') el.innerHTML = RenderBank();
        else if (STATE.activeTab === 'charity') el.innerHTML = RenderCharity();
        STATE._renderedTabId = currentTabId;
    }

    if (STATE.selectedTokenId) UpdateTokenDetailDynamic();
    else if (STATE.activeTab === 'market') UpdateMarketDynamic();
    else if (STATE.activeTab === 'exchanges') UpdateExchangesDynamic();
    else if (STATE.activeTab === 'devpanel') UpdateDevPanelDynamic();
    else if (STATE.activeTab === 'social') UpdateSocialDynamic();
    else if (STATE.activeTab === 'portfolio') UpdateLeaderboardDynamic();
    else if (STATE.activeTab === 'racing') UpdateRacingDynamic();
}

function UpdateDevPanelDynamic() {
    const grid = document.getElementById('dev-tokens-grid');
    if(!grid) return;

    const myTokens = Object.values(STATE.tokens).filter(t => (t.creatorIds || [t.creatorId]).includes(STATE.myProfile.id));
    const totalTokens = myTokens.length;
    let totalFees = 0;
    let successfulTokens = 0;

    myTokens.forEach(t => {
        const vRes = t.virtualSol || VIRTUAL_USD_RESERVE;
        const cLim = t.curveLimit || BONDING_CURVE_LIMIT;
        const creatorsCount = t.creatorIds ? t.creatorIds.length : 1;
        totalFees += ((t.totalFeesEarned || 0) + (t.accumulatedFees || 0)) / creatorsCount;
        
        const progress = Math.min(100, ((t.solPool - vRes) / cLim) * 100);
        if(progress >= 100) successfulTokens++;
    });

    const winRate = totalTokens > 0 ? ((successfulTokens / totalTokens) * 100).toFixed(1) : 0;

    const elTotalTokens = document.getElementById('dev-total-tokens'); if(elTotalTokens) elTotalTokens.innerText = totalTokens;
    const elWinRate = document.getElementById('dev-win-rate'); if(elWinRate) elWinRate.innerText = winRate + '%';
    const elTotalFees = document.getElementById('dev-total-fees'); if(elTotalFees) elTotalFees.innerText = formatUSD(totalFees);

    if(myTokens.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-10 flex flex-col items-center text-slate-500 border border-slate-800 rounded-2xl border-dashed bg-slate-900/30">No has creado ningún token aún.</div>`;
        return;
    }

    grid.innerHTML = myTokens.map(token => {
        const mcap = getPrice(token.solPool, token.tokenPool) * token.initialSupply;
        const creatorsCount = token.creatorIds ? token.creatorIds.length : 1;
        const feesToClaim = (token.accumulatedFees || 0) / creatorsCount;
        const totalEarned = (token.totalFeesEarned || 0) / creatorsCount;

        return `
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row justify-between gap-4 shadow-inner">
            <div class="flex items-center gap-3">
                <div class="text-3xl bg-slate-900 w-12 h-12 rounded-xl flex items-center justify-center border border-slate-700">${token.image?.startsWith('http') || token.image?.startsWith('data:') ? `<img src="${token.image}" class="w-full h-full object-cover rounded-xl"/>` : '🪙'}</div>
                <div>
                    <div class="font-black text-white text-base">${token.name} <span class="text-[10px] text-slate-500 font-mono bg-slate-900 px-1 rounded ml-1">$${token.ticker}</span></div>
                    <div class="text-[10px] text-slate-400 mt-1 uppercase tracking-wider font-bold">MCap: ${formatUSD(mcap)} • Exch: <span class="text-yellow-400">${token.exchange||'Pump'}</span></div>
                </div>
            </div>
            <div class="flex flex-col justify-center items-end bg-slate-900 p-2 px-3 rounded-xl border border-slate-800">
                <div class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Fees Pendientes</div>
                <div class="font-mono font-black text-emerald-400 text-lg">${formatUSD(feesToClaim)}</div>
                ${feesToClaim > 0 ? `<button onclick="dispatchAction('ACTION_CLAIM_FEES', {tokenId: '${token.id}'});" class="text-[8px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded uppercase mt-1 hover:bg-emerald-500/40 border border-emerald-500/30 transition-colors">Reclamar</button>` : `<div class="text-[8px] text-slate-600 uppercase mt-1">Histórico: ${formatUSD(totalEarned)}</div>`}
            </div>
        </div>`;
    }).join('');
}

function UpdateMarketDynamic() {
    const grid = document.getElementById('market-grid');
    if(!grid) return;
    
    const filtered = Object.values(STATE.tokens)
        .sort((a,b) => b.solPool - a.solPool)
        .filter(t => t.name.toLowerCase().includes(STATE.searchQuery.toLowerCase()) || t.ticker.toLowerCase().includes(STATE.searchQuery.toLowerCase()))
        .filter(t => {
            if(STATE.marketFilter === 'human') return !STATE.players[t.creatorId]?.isBot;
            if(STATE.marketFilter === 'bot') return STATE.players[t.creatorId]?.isBot;
            return true;
        });

    if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-500 border border-slate-800 rounded-3xl border-dashed bg-slate-900/30"><div class="text-4xl md:text-5xl mb-4 opacity-30">${Icons.Chart}</div><div class="font-bold text-sm md:text-lg text-white">No hay tokens aquí.</div></div>`;

// Bucle local para animar las carreras sin depender de renders de red
if(window.raceAnimInterval) clearInterval(window.raceAnimInterval);
window.raceAnimInterval = setInterval(() => {
    if(STATE.activeTab !== 'racing') return;
    const cars = document.querySelectorAll('.car-racer');
    cars.forEach(car => {
        const start = parseInt(car.dataset.start);
        const dur = parseInt(car.dataset.dur);
        const score = parseFloat(car.dataset.score);
        const maxScore = parseFloat(car.dataset.maxscore);
        const isWinner = car.dataset.iswinner === 'true';
        
        if(start && dur) {
            const elapsed = Date.now() - start;
            let rawProgress = elapsed / dur;
            
            if(rawProgress > 1) rawProgress = 1;
            
            // Los carros avanzan a diferentes velocidades basadas en su score, pero el ganador llega al 100%
            let mySpeedRatio = maxScore > 0 ? (score / maxScore) : 1;
            // Para dar sensación de carrera, añadimos un pequeño offset variable
            let variation = (Math.sin(elapsed / 200) * 2); 
            
            let finalProgress = rawProgress * mySpeedRatio * 100;
            
            if (rawProgress >= 1) {
                finalProgress = isWinner ? 100 : (mySpeedRatio * 90);
                variation = 0;
            } else if (isWinner) {
                finalProgress += variation;
            }

            // Clampear entre 0 y 100 (ajustando tamaño del icono 32px)
            finalProgress = Math.max(0, Math.min(100, finalProgress));
            
            car.style.left = `calc(${finalProgress}% - ${finalProgress === 100 ? 32 : 0}px)`;
        }
    });
}, 50);

function UpdateTokenDetailDynamic() {
    const token = STATE.tokens[STATE.selectedTokenId];
    if (!token) return;
    const me = STATE.players[STATE.myProfile.id];
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    const mcap = currentPrice * token.initialSupply; 
    const balTokens = me.portfolio[token.id] || 0;
    const isCex = token.exchange !== 'Pump.fun' && token.exchange !== 'Raydium';
    const vRes = token.virtualSol || VIRTUAL_USD_RESERVE;
    const cLim = token.curveLimit || BONDING_CURVE_LIMIT;
    
    const numAmt = parseFloat(document.getElementById('t-amount')?.value || STATE.tradeAmount) || 0;
    let estimated = 0;
    let feeEst = 0;
    if(STATE.tradeType === 'buy' && numAmt > 0) {
        feeEst = numAmt * 0.02;
        estimated = calcTokensOut(numAmt - feeEst, token.solPool, token.tokenPool);
    }
    if(STATE.tradeType === 'sell' && numAmt > 0) {
        const solVal = calcSolOut(numAmt, token.solPool, token.tokenPool);
        feeEst = solVal * 0.02;
        estimated = solVal - feeEst;
    }

    const progress = Math.min(100, ((token.solPool - vRes) / cLim) * 100);
    const isComplete = progress >= 100;

    const dCex = document.getElementById('tok-cex-badge'); if(dCex) { if(isCex) { dCex.classList.remove('hidden'); dCex.innerText = token.exchange; } else dCex.classList.add('hidden'); }
    const dRep = document.getElementById('tok-dev-rep'); if(dRep) { dRep.innerText = STATE.players[token.creatorId]?.reputation || 1; dRep.className = (STATE.players[token.creatorId]?.reputation || 1) > 70 ? 'text-emerald-400' : 'text-slate-300'; }
    const prEl = document.getElementById('tok-price'); if(prEl) { prEl.innerHTML = '$' + currentPrice.toFixed(8); prEl.className = `text-base sm:text-xl md:text-3xl font-mono font-black ${isCex ? 'text-yellow-400' : isComplete ? 'text-purple-400' : 'text-emerald-400'}`; }
    const mcEl = document.getElementById('tok-mcap'); if(mcEl) mcEl.innerText = formatUSD(mcap);
    
    const pnlDiv = document.getElementById('tok-pnl-container');
    if(pnlDiv) {
        if(balTokens > 0 && me.tradesInfo && me.tradesInfo[token.id]) {
            const entryPrice = me.tradesInfo[token.id].entryPrice;
            const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
            const pnlUsd = (currentPrice - entryPrice) * balTokens;
            pnlDiv.innerHTML = `<span class="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest">Tu PnL</span>
                                <span class="font-mono text-sm md:text-base font-black ml-0 sm:ml-2 ${pnlPercent >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                                    ${pnlPercent >= 0 ? '+' : ''}${formatUSD(pnlUsd)} (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(2)}%)
                                </span>`;
            pnlDiv.classList.remove('hidden');
        } else {
            pnlDiv.classList.add('hidden');
        }
    }

    const pLbl = document.getElementById('tok-prog-lbl'); if(pLbl) pLbl.className = isCex ? 'text-yellow-400 animate-pulse' : isComplete ? 'text-purple-400 animate-pulse' : '';
    const pTxt = document.getElementById('tok-prog-text'); if(pTxt) pTxt.innerText = progress.toFixed(1) + '%';
    const pBar = document.getElementById('tok-prog-bar'); if(pBar) { pBar.style.width = progress + '%'; pBar.className = `h-full transition-all duration-500 ${isCex ? 'bg-gradient-to-r from-yellow-500 to-yellow-300' : isComplete ? 'bg-gradient-to-r from-purple-600 to-purple-400' : 'bg-gradient-to-r from-emerald-600 to-emerald-400'}`; }
    
    const chEl = document.getElementById('tok-chart'); if(chEl) chEl.innerHTML = generateChartSVG(token, 800, 400, false);
    
    const tBal = document.getElementById('tok-bal-base'); if(tBal) tBal.innerText = STATE.tradeType==='buy'?formatUSD(me.solBalance):formatToken(balTokens);
    const eRec = document.getElementById('tok-est-rec'); if(eRec) eRec.innerText = STATE.tradeType==='buy'?formatToken(estimated):formatUSD(estimated);
    const eFee = document.getElementById('tok-fee-est'); if(eFee) eFee.innerText = STATE.tradeType==='buy'?formatUSD(feeEst):formatUSD(feeEst);
    const rLiq = document.getElementById('tok-real-liq'); if(rLiq) rLiq.innerText = formatUSD(token.solPool - vRes);

    const pctBtns = document.getElementById('tok-pct-btns');
    if(pctBtns) {
        pctBtns.innerHTML = [1, 10, 50, 100].map(pct => `
            <button onclick="const am = STATE.tradeType === 'buy' ? (Math.max(0, ${me.solBalance} - 0.01) * ${pct/100}).toFixed(2) : (${balTokens} * ${pct/100}); STATE.tradeAmount = am; document.getElementById('t-amount').value = am; UpdateTokenDetailDynamic();" class="flex-1 bg-slate-950 border border-slate-800 hover:border-emerald-500/50 hover:bg-emerald-500/10 text-slate-400 hover:text-emerald-400 text-[9px] md:text-xs py-2 rounded-lg font-bold font-mono transition-all shadow-inner">
                ${pct}%
            </button>
        `).join('');
    }

    const tools = document.getElementById('tok-tools');
    if(tools) {
        let toolsHTML = `
            <button onclick="const b = prompt('¿Quemar tokens? Se restarán de tu inventario y del Supply Total para subir el precio base.'); if(b && Number(b)>0){ dispatchAction('ACTION_BURN', { tokenId: '${token.id}', amount: Number(b) }); }" ${balTokens <= 0 ? 'disabled' : ''} class="w-full bg-orange-500/10 text-orange-500 border border-orange-500/30 hover:bg-orange-500/20 rounded-xl py-2 md:py-3 text-[9px] md:text-[10px] font-black flex justify-center items-center gap-1.5 transition-all disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-widest">
                ${Icons.Flame} Quemar
            </button>
        `;
        
        if((token.creatorIds || [token.creatorId]).includes(me.id)) {
            const hasEnoughMcap = mcap >= CEX_LISTING_MCAP;
            const creatorsCount = token.creatorIds ? token.creatorIds.length : 1;
            const feesToClaimPool = (token.accumulatedFees || 0) / creatorsCount;

            toolsHTML += `
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mt-2">
                <div class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-2 flex justify-between">
                    <span>Panel de Dev</span>
                    <span class="text-emerald-400">Tus Fees: ${formatUSD(feesToClaimPool)}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="dispatchAction('ACTION_CLAIM_FEES', { tokenId: '${token.id}' });" class="flex-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30 rounded-lg py-2 text-[9px] font-bold transition-all uppercase tracking-wider">
                        Reclamar Fees
                    </button>
                </div>
                ${token.exchange === 'Pump.fun' || token.exchange === 'Raydium' ? `
                <button onclick="${hasEnoughMcap ? `if(window.confirm('Listar en CoinMarketCap cuesta $100 y aumenta el hype. ¿Continuar?')) dispatchAction('ACTION_UPGRADE_EXCHANGE', { tokenId: '${token.id}', exchange: 'CoinMarketCap' });` : `alert('Necesitas $10,000 de MarketCap para listar en Exchange. Tu MCap actual es ${formatUSD(mcap)}.');`}" class="w-full mt-2 bg-blue-500/20 text-blue-400 border border-blue-500/30 hover:bg-blue-500/30 rounded-lg py-2 text-[9px] font-bold transition-all uppercase tracking-wider">
                    Listar en CMC ($100) ${hasEnoughMcap ? '' : '🔒 Req: $10k'}
                </button>
                ` : ''}
                ${token.exchange === 'CoinMarketCap' ? `
                <button onclick="${hasEnoughMcap ? `if(window.confirm('Listar en Binance cuesta $5000. ¿Continuar?')) dispatchAction('ACTION_UPGRADE_EXCHANGE', { tokenId: '${token.id}', exchange: 'Binance' });` : `alert('Necesitas $10,000 de MarketCap para listar en Exchange. Tu MCap actual es ${formatUSD(mcap)}.');`}" class="w-full mt-2 bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 hover:bg-yellow-500/30 rounded-lg py-2 text-[9px] font-bold transition-all uppercase tracking-wider">
                    Listar en Binance ($5000)
                </button>
                ` : ''}
                <button onclick="if(window.confirm('RUG PULL: ¿Vender 100% de tu inventario de golpe? Perderás reputación drásticamente.')){ dispatchAction('ACTION_TRADE', { tokenId: '${token.id}', isBuy: false, amount: ${balTokens} }); }" class="w-full mt-2 bg-red-950/40 text-red-500 border border-red-900/50 hover:bg-red-900/60 rounded-lg py-2 text-[9px] font-bold transition-all uppercase tracking-widest">
                    ${Icons.Alert} Rug Pull
                </button>
            </div>
            `;
        }
        tools.innerHTML = toolsHTML;
    }

    const holders = Object.values(STATE.players).filter(p => p.portfolio[token.id] > 0)
        .map(p => ({ ...p, tokenAmount: p.portfolio[token.id], pct: (p.portfolio[token.id]/token.initialSupply)*100 }))
        .sort((a,b) => b.tokenAmount - a.tokenAmount).slice(0, 50);
        
    const hList = document.getElementById('tok-holders');
    if(hList) {
        if(holders.length === 0) hList.innerHTML = `<div class="text-center text-slate-500 py-6 text-[10px] font-bold">Nadie tiene este token.</div>`;
        else hList.innerHTML = holders.map((h, i) => `
            <div class="cursor-pointer flex justify-between items-center p-2 md:p-3 rounded-xl transition-colors ${h.id===me.id ? 'bg-emerald-900/20 border border-emerald-900/30' : 'hover:bg-slate-800/50 border border-transparent'}" onclick="STATE.viewingProfileId='${h.id}'; STATE.giftTargetId=null; renderModal();">
                <div class="flex items-center gap-2">
                    <span class="text-slate-600 text-[9px] font-mono font-black w-3 text-right">${i+1}.</span>
                    <div class="relative"><span class="text-xl md:text-2xl">${h.avatar}</span></div>
                    <div class="flex flex-col min-w-0">
                        <span class="text-[10px] md:text-xs font-bold text-slate-200 truncate max-w-[80px] md:max-w-[100px]">${h.name}</span>
                        ${h.isBot ? `<span class="text-[8px] text-purple-400 font-mono font-bold uppercase mt-0.5 tracking-wider truncate">${h.id.startsWith('SYSTEM_')?'SYS':'BOT'}</span>` : ''}
                    </div>
                </div>
                <div class="text-right shrink-0">
                    <div class="text-[10px] font-mono font-bold text-emerald-400">${h.pct.toFixed(2)}%</div>
                </div>
            </div>`).join('');
    }
}

function UpdateLeaderboardDynamic() {
    const grid = document.getElementById('lb-grid');
    if(!grid) return;
    
    let filtered = Object.values(STATE.players).filter(p => !p.id.startsWith('SYSTEM_'));
    if(STATE.lbFilter === 'bots') filtered = filtered.filter(p => p.isBot);
    else if(STATE.lbFilter === 'humans') filtered = filtered.filter(p => !p.isBot);

    if(STATE.lbSort === 'balance') filtered.sort((a,b) => (b.solBalance+(b.solStaked||0)) - (a.solBalance+(a.solStaked||0)));
    else if(STATE.lbSort === 'followers') filtered.sort((a,b) => (b.followers||0) - (a.followers||0));
    else if(STATE.lbSort === 'reputation') filtered.sort((a,b) => b.reputation - a.reputation);

function RenderCasino() {
