    const time = new Date().toLocaleTimeString([], {hour12: false});

window.copyInviteLink = function() {
    const link = window.location.origin + window.location.pathname.replace('game.html', 'index.html') + '?room=' + STATE.roomConfig.code;
    try { navigator.clipboard.writeText(link); addToast('Link copiado!', '📋');
    } catch(e) {
        const dummy = document.createElement('input'); document.body.appendChild(dummy);
        dummy.value = link; dummy.select(); document.execCommand('copy'); document.body.removeChild(dummy);
        addToast('Link copiado!', '📋');
    }
};

window.handleImageUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas'); const MAX_SIZE = 150;
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/webp', 0.8);
            STATE.launchData.image = dataUrl;
            const urlInput = document.getElementById('l-image'); if(urlInput) urlInput.value = '';
            const preview = document.getElementById('img-preview');
            if(preview) { preview.src = dataUrl; preview.classList.remove('hidden'); }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};

window.updateLaunchStats = function() {
    const me = STATE.players[STATE.myProfile.id];
    let totalBal = me.solBalance;
    let count = 1;
    document.querySelectorAll('.co-founder-cb:checked').forEach(cb => {
        const p = STATE.players[cb.value];
        if(p) { totalBal += p.solBalance; count++; }
    });
    const maxDevBuy = Math.max(0, totalBal - 1);
    const input = document.getElementById('l-devbuy');
    const lblMax = document.getElementById('lbl-max-devbuy');
    if(input) input.max = maxDevBuy;
    if(lblMax) lblMax.innerText = 'Max: ' + formatUSD(maxDevBuy);
    
    const pInfo = document.getElementById('launch-cofounder-info');
    if(pInfo) {
        if(count > 1) pInfo.innerHTML = `🤝 Proyecto Co-Fundado (${count} dueños). Poder de compra combinado: <span class="text-emerald-400 font-mono font-black">${formatUSD(totalBal)}</span>. <br>Los tokens y comisiones (fees) se repartirán de manera justa y proporcional al aporte financiero de cada uno.`;
        else pInfo.innerHTML = `Selecciona socios para unir fuerzas financieras. Beneficios y costos serán distribuidos proporcionalmente al saldo de cada uno.`;
    }
};

function saveGame() {
    if(!STATE.roomConfig.isHost) return addToast("Solo el Host puede guardar", "❌");
    const saveData = { players: STATE.players, tokens: STATE.tokens, roomConfig: STATE.roomConfig, chat: STATE.chat, posts: STATE.posts, gameState: STATE.gameState, races: STATE.races };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
    const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `DegenTerminal_Save_${STATE.roomConfig.code}.json`);
    dlAnchorElem.click(); addToast("Partida guardada exitosamente", "💾");
}

window.loadGameFromFile = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const loaded = JSON.parse(e.target.result);
            if(loaded && loaded.players && loaded.roomConfig) {
                sessionStorage.setItem('degen_savegame', JSON.stringify(loaded));
                loadGameFromStorage();
                addToast("Partida cargada exitosamente", "📂");
            } else { addToast("Archivo inválido", "❌"); }
        } catch(err) { addToast("Error al leer archivo", "❌"); }
    };
    reader.readAsText(file);
};

function loadGameFromStorage() {
    try {
        const loaded = JSON.parse(sessionStorage.getItem('degen_savegame') || localStorage.getItem('degen_autosave'));
        if(loaded && loaded.players && loaded.roomConfig) {
            STATE.players = loaded.players; STATE.tokens = loaded.tokens || {};
            STATE.roomConfig = loaded.roomConfig; STATE.chat = loaded.chat || []; STATE.posts = loaded.posts || []; STATE.gameState = loaded.gameState || 'waiting';
            STATE.races = loaded.races || {};
            STATE.totalPlayerCount = Object.keys(STATE.players).length;
            
            const hostProfile = Object.values(STATE.players).find(p => !p.isBot) || STATE.players[Object.keys(STATE.players)[0]];
            STATE.myProfile = { ...hostProfile };
            
            const mode = STATE.roomConfig.isOffline ? 'offline' : (STATE.roomConfig.isHost ? 'host' : 'client');
            initNetwork(STATE.roomConfig.code, mode, STATE.roomConfig.botCount);
            
            STATE.route = STATE.gameState === 'playing' ? 'game' : 'lobby';

function playAudioStream(stream, peerId) {
    let audio = document.getElementById('audio-' + peerId);
    if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'audio-' + peerId;
        audio.autoplay = true;
        document.body.appendChild(audio);
    }
    audio.srcObject = stream;
}

async function toggleVoice() {
    if (STATE.voiceActive) {
        if(voiceInterval) clearInterval(voiceInterval);
        if(audioContext) audioContext.close();
        if(window.localAudioStream) {
            window.localAudioStream.getTracks().forEach(t => t.stop());
            window.localAudioStream = null;
        }
        STATE.voiceActive = false;
        STATE.localSpeaking = false;
        dispatchAction('ACTION_VOICE', { isSpeaking: false });
        tLog("Chat de Voz Desactivado", "text-yellow-400");
        updateUI();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.localAudioStream = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        STATE.voiceActive = true;
        tLog("Chat de Voz Activado", "text-emerald-400");
        updateUI();

        if (peer && !STATE.roomConfig.isOffline) {
            Object.values(STATE.players).sort(() => 0.5 - Math.random()).slice(0, 300).forEach(p => {
                if (!p.isBot && p.peerId && p.id !== STATE.myProfile.id) {
                    const call = peer.call(p.peerId, stream);
                    if(call) { call.on('stream', remoteStream => { playAudioStream(remoteStream, p.id); }); }
                }
            });
        }

        voiceInterval = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<bufferLength; i++) sum += dataArray[i];
            let avg = sum / bufferLength;
            
            let isSpeaking = avg > 15; 
            if(isSpeaking !== STATE.localSpeaking) {
                STATE.localSpeaking = isSpeaking;
                dispatchAction('ACTION_VOICE', { isSpeaking: isSpeaking });
                if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = isSpeaking;
                updateUI();
            }
        }, 150); 
    } catch(e) { 
        console.error(e); 
        tLog("Error WebRTC Audio: Permiso Denegado", "text-red-400");
        alert("Permiso de micrófono denegado o no disponible."); 
    }
}

    const currentBots = Object.values(STATE.players).filter(p => p.isBot && !p.id.startsWith('SYSTEM_'));
    let currentMillionaires = currentBots.filter(p => p.solBalance >= 1000000).length;
    let currentRichBots = currentBots.filter(p => p.solBalance >= 10000 && p.solBalance < 1000000).length;
    
    if (currentBots.length < targetCount) {
        const toAdd = targetCount - currentBots.length;
        const startIndex = currentBots.length;

        for (let i = 0; i < toAdd; i++) {
            let strategy = BOT_STRATEGIES[Math.floor(Math.random() * BOT_STRATEGIES.length)];

    }

    broadcastState();
};

const BROKER_URLS = [
    'wss://broker.emqx.io:8084/mqtt',      
    'wss://broker.hivemq.com:8884/mqtt',   
    'wss://test.mosquitto.org:8081/mqtt'   
];
let currentBrokerIndex = 0;

function setupSystemBots() {
    if(!STATE.players['SYSTEM_MM']) STATE.players['SYSTEM_MM'] = { id: 'SYSTEM_MM', name: 'Exchange_MM', avatar: '🏦', isBot: true, isVerified: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, followers: 999999 };
    if(!STATE.players['SYSTEM_CMC']) STATE.players['SYSTEM_CMC'] = { id: 'SYSTEM_CMC', name: 'CoinMarketCap', avatar: '📈', isBot: true, isVerified: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, followers: 500000 };
    if(!STATE.players['SYSTEM_BINANCE']) STATE.players['SYSTEM_BINANCE'] = { id: 'SYSTEM_BINANCE', name: 'Binance', avatar: '🔶', isBot: true, isVerified: true, solBalance: 9999999, portfolio: {}, reputation: 100, solStaked: 0, followers: 2000000 };
}

function initNetwork(roomId, mode, customBotCount = 50) {
    if (peer && peer.destroy) { peer.destroy(); peer = null; }
    if(mqttClient && mode === 'offline') { mqttClient.end(); mqttClient = null; }
    STATE.netLogs = []; 

    if (mode === 'offline') {
        tLog("Iniciando Entorno de Simulación Local.", "text-purple-400");
        if (!STATE.players[STATE.myProfile.id]) {
            STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
        }
        setupSystemBots();
        window.adjustBots(customBotCount);
        addToast("Modo Offline Activado", "🔌");
        requestUIRender(true);
        startSystemEvents(); 
        startHostAutoSave();
        return;
    }

    const url = BROKER_URLS[currentBrokerIndex];
    tLog(`[PROXY] Conectando servicio de señalización...`, "text-blue-400");
    const clientId = 'degen_' + Math.random().toString(16).substr(2, 8);
    
    if(!mqttClient || !mqttClient.connected) {
        mqttClient = mqtt.connect(url, { clientId, connectTimeout: 5000, reconnectPeriod: 0 });

        mqttClient.on('connect', () => {
            tLog("✓ [VPN-SIM] Señalización lista.", "text-emerald-400");
            mqttClient.options.reconnectPeriod = 1000;
            STATE._connectAttempts = 0;
            
            if (mode === 'host') {
                mqttClient.subscribe(`dgn/${roomId}/in`);
                addToast(`Sala Segura Creada/Reconectada: ${roomId}`, '🌐');
                
                if (!STATE.players[STATE.myProfile.id]) {
                    STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
                }
                setupSystemBots();
                window.adjustBots(customBotCount);
                requestUIRender(true);
                startSystemEvents();
                startHostAutoSave();

                if(window.discoveryInterval) clearInterval(window.discoveryInterval);
                window.discoveryInterval = setInterval(() => {
                    if (STATE.roomConfig.isHost && !STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
                        const discPayload = JSON.stringify({
                            code: STATE.roomConfig.code,
                            roomName: STATE.roomConfig.name,
                            hasMap: false,
                            host: STATE.myProfile.name,
                            players: Object.keys(STATE.players).length,
                            max: STATE.roomConfig.maxPlayers,
                            gameState: STATE.gameState
                        });
                        // Publicar en ambos canales para asegurar compatibilidad PC-Teléfono
                        mqttClient.publish('dgn_global_discovery_v2', discPayload);
                        mqttClient.publish('dgn_global_discovery', discPayload);
                    }
                }, 3000);


            } else {
                mqttClient.subscribe(`dgn/${roomId}/out`);
                const joinPacket = { type: 'JOIN_REQ', payload: { ...STATE.myProfile }, senderId: STATE.myProfile.id };
                mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
                addToast("Buscando al Host...", '⏳');
                
                if(window.handshakeInterval) clearInterval(window.handshakeInterval);
                window.handshakeInterval = setInterval(() => {
                    tLog(`[!] Intentando conectar (Host ocupado o de lejos)...`, "text-orange-400");
                    mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
                    
                    // Sistema de auto-reparación si la sala "parece vacía" por fallo de Broker
                    if (STATE.gameState === 'waiting' && STATE.totalPlayerCount <= 1) {
                        STATE._connectAttempts = (STATE._connectAttempts || 0) + 1;
                        if (STATE._connectAttempts > 8) {
                            tLog(`[!] El servidor no responde. Cambiando ruta...`, "text-red-400");
                            currentBrokerIndex = (currentBrokerIndex + 1) % BROKER_URLS.length;
                            initNetwork(roomId, mode, customBotCount);
                        }
                    }
                }, 3000);
            }
        });

        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (mode === 'host' && topic.endsWith('/in')) processMessageAsHost(data);
                else if (mode === 'client' && topic.endsWith('/out')) processMessageAsClient(data);
            } catch(e) {}
        });

        mqttClient.on('close', () => {
            if (!mqttClient.connected) {
                tLog(`[!] Señalización interrumpida. Recuperando...`, "text-yellow-400");
                currentBrokerIndex = (currentBrokerIndex + 1) % BROKER_URLS.length;
                setTimeout(() => { if(STATE.route === 'lobby' || STATE.route === 'game') initNetwork(roomId, mode, customBotCount); }, 1500);
            }
        });
    }

    // WEBRTC P2P DATA (LA RUTA ULTRA RÁPIDA 0MS)
    if(!peer) {
        try {
            if (mode === 'host') {
                peer = new Peer(`dgn-voice-${roomId}`, WEBRTC_CONFIG);
                window.clientConns = {}; 
                peer.on('open', (id) => { 
                    STATE.myProfile.peerId = id; 
                    STATE.roomConfig.hostPeerId = id; 
                });
                peer.on('connection', (conn) => {
                    conn.on('data', (data) => {
                        if (data.senderId) {
                            window.clientConns[data.senderId] = conn;
                            if (data.type === 'P2P_HELLO') {
                                conn.send({ type: 'STATE_SYNC', payload: getCompressedState() });
                                return;
                            }
                        }
                        if (data.type === 'PING') { conn.send({ type: 'PONG', target: data.senderId, time: data.time }); return; }
                        processMessageAsHost(data);
                    });
                });
                peer.on('call', call => {
                    if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                    call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
                });
            } else {
                peer = new Peer(WEBRTC_CONFIG);
                peer.on('open', (id) => { STATE.myProfile.peerId = id; });
                peer.on('call', call => {
                    if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                    call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
                });
            }
        } catch(e) { tLog("Servicio WebRTC no disponible.", "text-slate-500"); }
    }

    if (pingerInterval) clearInterval(pingerInterval);
    pingerInterval = setInterval(() => {
        if (STATE.gameState === 'playing' && !STATE.roomConfig.isHost) {
            const pPacket = { type: 'PING', senderId: STATE.myProfile.id, time: Date.now() };
            if (window.dataConn && window.dataConn.open) {
                window.dataConn.send(pPacket);
            } else if (mqttClient && mqttClient.connected) {
                mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(pPacket));
            }
        }
    }, 2000);
}

function processMessageAsHost(data) {
    const { type, payload, senderId, time } = data;
    
    if (type === 'PING') { 
        if (window.clientConns && window.clientConns[senderId] && window.clientConns[senderId].open) {
            window.clientConns[senderId].send({ type: 'PONG', target: senderId, time });
        } else if (mqttClient) {
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'PONG', target: senderId, time })); 
        }
        return; 
    }
    
    if (type === 'JOIN_REQ') {
        if (STATE.players[payload.id]) {
            STATE.players[payload.id].name = payload.name;
            STATE.players[payload.id].avatar = payload.avatar;
        } else {
            if (Object.keys(STATE.players).length >= STATE.roomConfig.maxPlayers) {
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'JOIN_REJECT', target: payload.id, reason: 'Sala llena' }));
                return;
            }
            STATE.players[payload.id] = { ...payload, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, followers: 0, carTuning: { speedLevel: 1, accelLevel: 1 } };
            STATE.totalPlayerCount = Object.keys(STATE.players).length;
        }
        mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'ROOM_CONFIG', payload: STATE.roomConfig, target: payload.id }));
        broadcastState();
    }
    
    if (type === 'ACTION_TRADE') {

function processMessageAsClient(data) {
    const { type, payload, senderId, time, target } = data;
    
    if (type === 'ROOM_CONFIG' && target === STATE.myProfile.id) {
        if (window.handshakeInterval) clearInterval(window.handshakeInterval); // Romper bucle de espera inmediatamente
        STATE.roomConfig.name = payload.name;
        STATE.roomConfig.hostPeerId = payload.hostPeerId; 
        STATE.roomConfig.botPostsEnabled = payload.botPostsEnabled;
        requestUIRender(true);

        if (payload.hostPeerId && (!window.dataConn || !window.dataConn.open)) {
            try {
                window.dataConn = peer.connect(payload.hostPeerId);
                window.dataConn.on('open', () => { 
                    tLog("⚡ Conexión P2P Directa Establecida (Latencia 0ms)", "text-cyan-400"); 
                    window.dataConn.send({ type: 'P2P_HELLO', senderId: STATE.myProfile.id });
                });
                window.dataConn.on('data', (data) => processMessageAsClient(data));
            } catch(e) {}
        }
    }
    
   if (type === 'STATE_SYNC') {
        if (window.handshakeInterval) clearInterval(window.handshakeInterval);
        if (STATE.lastSyncTime && time && time < STATE.lastSyncTime) return; 
        if (time) STATE.lastSyncTime = time;

        STATE.players = payload.players; 
        
        // FUSIÓN DE HISTORIAL: Evita que el paquete optimizado de red borre la gráfica Pro completa que estamos viendo
        if (STATE.selectedTokenId && STATE.tokens[STATE.selectedTokenId] && payload.tokens[STATE.selectedTokenId]) {
            const currentHistory = STATE.tokens[STATE.selectedTokenId].history || [];
            const incomingHistory = payload.tokens[STATE.selectedTokenId].history || [];
            if (currentHistory.length > 100) {
                let merged = [...currentHistory];
                const lastTime = merged[merged.length - 1]?.time || 0;
                merged.push(...incomingHistory.filter(c => c.time > lastTime));
                payload.tokens[STATE.selectedTokenId].history = merged;
            }
        }
        STATE.tokens = payload.tokens;
        STATE.gameState = payload.gameState; 
        STATE.chat = payload.chat;
        STATE.races = payload.races || {};
        if(payload.posts) STATE.posts = payload.posts;
        if(payload.totalPlayerCount) STATE.totalPlayerCount = payload.totalPlayerCount;
        
        let force = false;
        if(STATE.route === 'lobby' && STATE.gameState === 'playing') { STATE.route = 'game'; force = true; }
        requestUIRender(force);
    }
    
    if (type === 'PONG' && target === STATE.myProfile.id) { STATE.ping = Date.now() - time; const pingEl = document.getElementById('ping-display'); if(pingEl) pingEl.innerText = STATE.ping + 'ms'; }
    if (type === 'JOIN_REJECT' && target === STATE.myProfile.id) {
        addToast("Error: " + payload.reason, "❌"); if(mqttClient) { mqttClient.end(); mqttClient = null; }
        setTimeout(() => window.location.href = 'index.html', 2000);
    }
    if (type === 'EVENT_ALERT') { if (STATE.trackedIds.has(senderId)) addToast(payload.msg, payload.icon); }
        if (type === 'SYNC_FULL_CHART' && target === STATE.myProfile.id) {
            if(STATE.tokens[payload.id]) {
                STATE.tokens[payload.id].history = payload.history;
                if(STATE.selectedTokenId === payload.id && typeof UpdateChartVisualsOnly === 'function') UpdateChartVisualsOnly();
            }
        }
    }


// ---------------- ALGORITMO COMPRESIÓN (PING 0MS REAL) ----------------
function getCompressedState() {
    const humans = {};
    const bots = [];
    
    Object.values(STATE.players).sort(() => 0.5 - Math.random()).slice(0, 300).forEach(p => {
        if (!p.isBot || p.id.startsWith('SYSTEM_')) humans[p.id] = p;
        else bots.push(p);
    });

    bots.sort((a,b) => (b.solBalance + (b.solStaked||0)) - (a.solBalance + (a.solStaked||0)));
    const topBots = bots.slice(0, 70); 
    
    const compressedPlayers = { ...humans };
    topBots.forEach(b => compressedPlayers[b.id] = b);
    bots.forEach(b => {
        if (Object.keys(b.portfolio).length > 0) compressedPlayers[b.id] = b;
    });
    
    const compressedTokens = {};
    Object.values(STATE.tokens).forEach(t => {
        compressedTokens[t.id] = {
            ...t,
            // OPTIMIZACIÓN DE RED: Solo enviamos la vela actual por defecto. Ahorra muchísimo PING.
            // Se cargan 1000 velas completas al entrar al token vía ACTION_GET_FULL_CHART
            history: t.history ? t.history.slice(-1) : [] 
        };
    });
    return { 
        players: compressedPlayers, 
        tokens: compressedTokens, 
        chat: STATE.chat.slice(0, 30), 
        posts: STATE.posts.slice(0, 30), 
        races: STATE.races,
        gameState: STATE.gameState,
        totalPlayerCount: Object.keys(STATE.players).length
    };
}

function broadcastState() {
    if (STATE.roomConfig.isHost) {
        requestUIRender();
        if (STATE.roomConfig.isOffline) return;
        
        const now = Date.now();
        const timeSinceLast = now - (window.lastMqttBroadcast || 0);
        const statePayload = getCompressedState();
        
        // P2P Direct
        Object.values(window.clientConns || {}).forEach(conn => {
            if (conn && conn.open) conn.send({ type: 'STATE_SYNC', time: now, payload: statePayload });
        });

        // MQTT Broadcast
        if (mqttClient && mqttClient.connected) {
            if (timeSinceLast >= 500) {
                window.lastMqttBroadcast = now;
                const msg = { type: 'STATE_SYNC', time: now, payload: statePayload };
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(msg));
            } else {
                // Si se limitó por velocidad, programa un envío garantizado
                if (window.mqttBroadcastTimer) clearTimeout(window.mqttBroadcastTimer);
                window.mqttBroadcastTimer = setTimeout(() => {
                    window.lastMqttBroadcast = Date.now();
                    const msg = { type: 'STATE_SYNC', time: window.lastMqttBroadcast, payload: statePayload };
                    mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(msg));
                }, 600 - timeSinceLast);
            }
        }
    }
}

function hostEmitAlert(senderId, msg, icon) {
    if(STATE.roomConfig.isHost) {
        if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
            const packet = { type: 'EVENT_ALERT', senderId, payload: { msg, icon } };
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(packet));

        if (STATE.trackedIds.has(senderId)) addToast(msg, icon);
    }
}

function calculateHypeMultiplier(tokenTicker) {
    let hype = 1.0;
    STATE.posts.slice(0, 30).forEach(p => {
        if(p.text.includes(`$${tokenTicker}`)) {
            // El FOMO escala directamente con las VISITAS del post.
            const views = p.views || 0;
            // Cada 1,000 visitas suma 1.0 al hype. Un post con 10,000 vistas genera un FOMO x10.
            hype += (views / 1000); 
        }
    });
    // Límite subido drásticamente (hasta x100) para permitir que un post ultra-viral rompa el mercado
    return Math.min(hype, 100.0); 
}

function handlePostHost(text, playerId) {
    if(!text || text.trim() === '') return;
    const author = STATE.players[playerId];
    if(!author) return;
    
    // Solo cuentas verificadas pueden publicar en DegenX
    if(!author.isVerified) {
        hostEmitAlert(playerId, "Solo cuentas verificadas (Check Azul o Exchanges) pueden postear en DegenX.", "❌");
        return;
    }

    STATE.posts.unshift({
        id: 'post_' + Date.now() + Math.random().toString(36).substr(2,5),
        authorId: playerId,
        authorName: author.name,
        authorAvatar: author.avatar,
        text: text.substring(0, 280),
        time: Date.now(),
        views: 0,
        likes: 0
    });
    STATE.posts = STATE.posts.slice(0, 80); 
    broadcastState();
}

function handleTradeHost(tokenId, isBuy, amount, playerId, silent = false, isPct = false) {
    const player = STATE.players[playerId];
    const token = STATE.tokens[tokenId];
    if (!player || !token || amount <= 0) return;

    if (!player.tradesInfo) player.tradesInfo = {};
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    
    let currentCandle = token.currentCandle;
if (!currentCandle || Date.now() - currentCandle.time > 1000) {
        if (currentCandle) {
            token.history.push(currentCandle);
           if (token.history.length > 1000) token.history.shift();
        }
        currentCandle = { time: Date.now(), open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, vol: 0 };
    }

    // Fee system (2%)
    let netAmount = amount;
    if(!player.isBot || player.id.startsWith('SYSTEM_')) {
        const fee = amount * 0.02;
        netAmount = amount - fee;
        token.accumulatedFees = (token.accumulatedFees || 0) + (isBuy ? fee : 0); // Fees solo se guardan en USD para reclamar
    }

    if (isBuy) {
        if (player.solBalance < amount) return;
        const tokensOut = calcTokensOut(netAmount, token.solPool, token.tokenPool);
        token.solPool += netAmount; token.tokenPool -= tokensOut;
        player.solBalance -= amount; player.portfolio[tokenId] = (player.portfolio[tokenId] || 0) + tokensOut;
        player.tradesInfo[tokenId] = { entryPrice: getPrice(token.solPool, token.tokenPool) };
        
        // CopyTrading Hook
       // CopyTrading Hook (Mejorado y Realista)
        if(!silent && player.followers > 100 && (player.reputation > 50 || !player.isBot)) {
            // 1. Depende MUCHO de los seguidores (Ej: 10,000 seguidores = 80% de convencerlos, 1000 seguidores = 8%)
            const convictionRate = Math.min(player.followers / 12000, 0.85); 
            
            // 2. Calculamos el 1% de la población total de bots
            const totalBots = Object.values(STATE.players).filter(p => p.isBot && !p.id.startsWith('SYSTEM_'));
            const maxCopiers = Math.max(1, Math.floor(totalBots.length * 0.01)); 
            
            // Filtramos solo a los CopyTraders, los mezclamos al azar y tomamos solo ese 1%
            const copyBots = totalBots.filter(p => p.strategy === 'CopyTrader' && p.solBalance > 5)
                                      .sort(() => 0.5 - Math.random()) 
                                      .slice(0, maxCopiers); 
            
            copyBots.forEach(bot => {
                // 3. "Pensarán si de verdad hacerlo" - Tiran los dados contra tu convictionRate
                if (Math.random() < convictionRate) {
                    setTimeout(() => {
                        // Si se convencen, invierten entre un 10% y 30% de su balance
                        const investAmount = bot.solBalance * (0.1 + Math.random() * 0.2);
                        handleTradeHost(tokenId, true, investAmount, bot.id, true);
                        broadcastState();
                    }, 1000 + Math.random() * 5000); // Tardan entre 1 y 6 segundos en decidirse y ejecutar
                }
            });
        }

    } else {
        // FOMO: Bloqueo de ventas (Tokens Congelados)
        if (token.isFrozen && !(token.creatorIds || [token.creatorId]).includes(player.id)) {
            if(!silent) hostEmitAlert(player.id, "🥶 Este token está congelado. No puedes vender.", "🚫");
            return;
        }

        const currentBal = player.portfolio[tokenId] || 0;
        let sellAmount = amount;
        if (amount >= currentBal * 0.999) sellAmount = currentBal;
        if (currentBal < sellAmount) return;

        if (sellAmount > (token.tokenPool * 0.5) && !player.isBot) player.reputation = Math.max(1, (player.reputation || 1) - 30);

        const solOut = calcSolOut(sellAmount, token.solPool, token.tokenPool);
        const fee = solOut * 0.02;
        const netSolOut = player.isBot && !player.id.startsWith('SYSTEM_') ? solOut : (solOut - fee);
        token.accumulatedFees = (token.accumulatedFees || 0) + (player.isBot && !player.id.startsWith('SYSTEM_') ? 0 : fee);

        token.solPool -= solOut; token.tokenPool += sellAmount;
        player.solBalance += netSolOut; player.portfolio[tokenId] -= sellAmount;
        if(player.portfolio[tokenId] <= 0) delete player.tradesInfo[tokenId];
    }

    const newPrice = getPrice(token.solPool, token.tokenPool);
    currentCandle.close = newPrice; currentCandle.high = Math.max(currentCandle.high, newPrice);
    currentCandle.low = Math.min(currentCandle.low, newPrice); currentCandle.vol += amount;
    token.currentCandle = currentCandle;

    let milestoneMsg = null;
    let postMsg = null;
    let posterSys = 'SYSTEM_MM';
    const mcapUsd = newPrice * token.initialSupply; 
    const vRes = token.virtualSol || VIRTUAL_USD_RESERVE;
    const cLim = token.curveLimit || BONDING_CURVE_LIMIT;
    const realLiq = token.solPool - vRes;

    if (!token.milestones) token.milestones = {};
    const creator = STATE.players[token.creatorId];

    if (realLiq >= cLim && !token.milestones.mRaydium) {
        token.milestones.mRaydium = true; 
        milestoneMsg = `👑 $${token.ticker} COMPLETÓ LA CURVA Y SE FUE A RAYDIUM!`;
        postMsg = `Acabo de ver a $${token.ticker} tocar Raydium. El dev es un chad. Enhorabuena. 🔥`;
        if(creator) { 
            creator.reputation = Math.min(100, (creator.reputation || 1) + 20); 
            // 50% menos de seguidores por completar la curva a Raydium (Antes 500 a 1000, ahora 250 a 500)
            creator.followers += 250 + Math.floor(Math.random() * 250); 
        }
    } else if (mcapUsd >= 1000000 && !token.milestones.m1m) { 
        token.milestones.m1m = true; 
        milestoneMsg = `🚀 $${token.ticker} ALCANZÓ $1M MCap!`; 
        postMsg = `$${token.ticker} superó el Millón de Market Cap. ¿Quién más está holdeando? 💎`;
        // 50% menos de seguidores por tocar $1M MCap (Antes 100 a 200, ahora 50 a 100)
        if(creator) { creator.followers += 50 + Math.floor(Math.random() * 50); }
    }

    if (!silent && milestoneMsg) {
        STATE.chat.unshift({ id: Date.now() + Math.random(), sender: 'System', text: milestoneMsg, sys: true });
        STATE.chat = STATE.chat.slice(0, 80);
        if(postMsg) handlePostHost(postMsg, posterSys);
    }
}

function handleLaunchHost(name, ticker, image, devBuy, playerId, coFounders = []) {
    if (ticker.toUpperCase() === 'QRYZO') {

            hostEmitAlert(playerId, "¡Ya existe el legendario token QRYZO en la sala! Solo puede haber uno.", "❌");
            return;
        }
    }
    const creators = [playerId, ...(coFounders || [])].filter(id => STATE.players[id]); // Valid players only
    const numCreators = creators.length;
    const feePerPerson = 1 / numCreators;
    const actualDevBuy = Math.max(0, devBuy);

    // Check if all creators have enough balance for the base fee ($1 total shared)
    for (let id of creators) {
        if (STATE.players[id].solBalance < feePerPerson) {
            if (id === playerId) hostEmitAlert(playerId, "No tienes suficiente saldo para la tarifa base compartida ($1).", "❌");
            else hostEmitAlert(playerId, `El co-fundador ${STATE.players[id].name} está quebrado y no puede pagar su parte del despliegue.`, "❌");
            return;
        }
    }

    let totalAvailableForBuy = 0;
    creators.forEach(id => { totalAvailableForBuy += (STATE.players[id].solBalance - feePerPerson); });

    if (actualDevBuy > totalAvailableForBuy) {
        hostEmitAlert(playerId, `El Snipe del Dev (${formatUSD(actualDevBuy)}) excede el poder de compra combinado (${formatUSD(totalAvailableForBuy)}).`, "❌");
        return;
    }

    // Calcular distribución proporcional
    const contributions = {};
    creators.forEach(id => {
        const available = STATE.players[id].solBalance - feePerPerson;
        // El aporte es directamente proporcional al dinero disponible de cada uno
        const shareOfBuy = actualDevBuy > 0 ? (available / totalAvailableForBuy) * actualDevBuy : 0;
        const sharePct = actualDevBuy > 0 ? (shareOfBuy / actualDevBuy) : (1 / numCreators);
        
       STATE.players[id].solBalance -= (feePerPerson + shareOfBuy);
        STATE.players[id].reputation = Math.min(100, (STATE.players[id].reputation || 1) + 0.5);
        STATE.players[id].followers += 5; // 50% menos seguidores por crear token
        
        contributions[id] = { cost: feePerPerson + shareOfBuy, share: sharePct };
    });
    
    // Logica AMM Realista: La inversión del dev añade a la liquidez virtual base (x3)
   // Cambiamos el multiplicador de vSol y cLim de 3 a 1.5 (50% menos impacto de liquidez inicial)
    const vSol = VIRTUAL_USD_RESERVE + (actualDevBuy * 1.5);
    const cLim = BONDING_CURVE_LIMIT + (actualDevBuy * 1.5);
    const initialPrice = vSol / 1000000000; 
    
    const tokenId = ticker.toUpperCase() + '_' + Date.now();
    const creatorNames = creators.map(id => STATE.players[id].name).join(', ');

    STATE.tokens[tokenId] = {
        id: tokenId, name, ticker: ticker.toUpperCase(), image: image, 
        creatorId: playerId, creatorIds: creators, creatorName: creatorNames,
        coFounders: contributions, // Guardar historial de aportes para las fees
        solPool: vSol, tokenPool: 1000000000, initialSupply: 1000000000, createdAt: Date.now(),
        virtualSol: vSol, curveLimit: cLim,
        milestones: {}, history: [], exchange: 'Pump.fun', accumulatedFees: 0, totalFeesEarned: 0,
        currentCandle: { time: Date.now(), open: initialPrice, high: initialPrice, low: initialPrice, close: initialPrice, vol: 0 }
    };
    
    const logMsg = `🚀 ${creatorNames} lanzaron $${STATE.tokens[tokenId].ticker} ${numCreators > 1 ? '(Multi-Firma 🤝)' : ''}`;
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: logMsg, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    
    creators.forEach(id => hostEmitAlert(id, logMsg, '🚀'));
    
    if (actualDevBuy > 0) {
        const tokensOut = calcTokensOut(actualDevBuy, STATE.tokens[tokenId].solPool, STATE.tokens[tokenId].tokenPool);
        STATE.tokens[tokenId].solPool += actualDevBuy; 
        STATE.tokens[tokenId].tokenPool -= tokensOut;
        
        // Repartir tokens proporcionalmente a los creadores
        creators.forEach(id => {
            const pTokens = tokensOut * contributions[id].share;
            if(pTokens > 0) {
                STATE.players[id].portfolio[tokenId] = (STATE.players[id].portfolio[tokenId] || 0) + pTokens;
                if(!STATE.players[id].tradesInfo) STATE.players[id].tradesInfo = {};
                STATE.players[id].tradesInfo[tokenId] = { entryPrice: initialPrice };
            }
        });
        
        const newPrice = getPrice(STATE.tokens[tokenId].solPool, STATE.tokens[tokenId].tokenPool);
        STATE.tokens[tokenId].currentCandle.close = newPrice;
        STATE.tokens[tokenId].currentCandle.high = Math.max(STATE.tokens[tokenId].currentCandle.high, newPrice);
    }
    
    broadcastState();
}

function handleGiftHost(targetId, asset, amount, senderId) {
    const sender = STATE.players[senderId]; const target = STATE.players[targetId];
    if (!sender || !target || amount <= 0) return;
    if (asset === 'USD') {
        if (sender.solBalance < amount) return;

    }
    sender.reputation = Math.min(100, (sender.reputation || 1) + 0.5);
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🎁 ${sender.name} le regaló a ${target.name} ${formatToken(amount)} ${asset==='USD'?'USD':'Tokens'}`, sys: true });

function handleBuyLuxuryHost(itemId, playerId) {

    if (!player || !item || player.solBalance < item.price) return;

    }

    player.reputation = Math.min(100, (player.reputation || 1) + item.rep);

    player.viralMultiplier = (player.viralMultiplier || 1.0) + (item.rep * 0.05);

    broadcastState();
}

function handleClaimFeesHost(tokenId, playerId) {
    const token = STATE.tokens[tokenId];
    const player = STATE.players[playerId];
    const creators = token.creatorIds || [token.creatorId];

    if(!token || !player || !creators.includes(playerId) || token.accumulatedFees <= 0) return;

    const claimAmtTotal = token.accumulatedFees;

    creators.forEach(id => {
        if (STATE.players[id]) {
            const share = token.coFounders ? token.coFounders[id].share : (1 / creators.length);
            const amt = claimAmtTotal * share;
            if(amt > 0) {
                STATE.players[id].solBalance += amt;
                hostEmitAlert(id, `Has reclamado ${formatUSD(amt)} en Fees ($${token.ticker}).`, "💰");
            }
        }
    });

    token.totalFeesEarned = (token.totalFeesEarned || 0) + claimAmtTotal;
    token.accumulatedFees = 0;
    broadcastState();
}

function handleClaimAllFeesHost(playerId) {
    const player = STATE.players[playerId];
    if(!player) return;
    let totalClaimedForMe = 0;
    
    Object.values(STATE.tokens).forEach(t => {
        const creators = t.creatorIds || [t.creatorId];
        if(creators.includes(playerId) && t.accumulatedFees > 0) {
            const claimAmtTotal = t.accumulatedFees;

            creators.forEach(id => {
                if (STATE.players[id]) {
                    const share = t.coFounders ? t.coFounders[id].share : (1 / creators.length);
                    const amt = claimAmtTotal * share;
                    if(amt > 0) {
                        STATE.players[id].solBalance += amt;
                        if (id !== playerId) hostEmitAlert(id, `Has recibido ${formatUSD(amt)} en Fees ($${t.ticker}).`, "💰");
                        if (id === playerId) totalClaimedForMe += amt;
                    }
                }
            });

            t.totalFeesEarned = (t.totalFeesEarned || 0) + claimAmtTotal;
            t.accumulatedFees = 0;
        }
    });

    if(totalClaimedForMe > 0) {
        hostEmitAlert(playerId, `Has reclamado tu parte de ${formatUSD(totalClaimedForMe)} en Fees.`, "💰");

function handleUpgradeExchangeHost(tokenId, exchangeName, playerId) {
    const token = STATE.tokens[tokenId];
    const player = STATE.players[playerId];
    const creators = token.creatorIds || [token.creatorId];
    if(!token || !player || !creators.includes(playerId)) return;

// ---- RACING LOGIC ----
function handleCreateRaceHost(bet, playerId) {
    const player = STATE.players[playerId];
    if(!player || player.solBalance < bet || bet < 1) return;
    
    player.solBalance -= bet;
    const raceId = 'race_' + Date.now();
    STATE.races[raceId] = {
        id: raceId, hostId: playerId, hostName: player.name, bet: bet, state: 'waiting',
        participants: [{ id: playerId, name: player.name, avatar: player.avatar, tuning: player.carTuning }]
    };
    broadcastState();
}

function handleJoinRaceHost(raceId, playerId) {
    const race = STATE.races[raceId];
    const player = STATE.players[playerId];
    if(!race || !player || race.state !== 'waiting' || player.solBalance < race.bet) return;
    
    if(race.participants.find(p => p.id === playerId)) return;
    
    player.solBalance -= race.bet;
    race.participants.push({ id: playerId, name: player.name, avatar: player.avatar, tuning: player.carTuning });
    broadcastState();
}

function handleStartRaceHost(raceId, playerId) {
    const race = STATE.races[raceId];
    if(!race || race.state !== 'waiting' || race.hostId !== playerId || race.participants.length < 2) return;
    
    race.state = 'racing';
    race.startTime = Date.now();
    race.duration = 6000; // 6 segundos de carrera visual
    
    // Pre-calcular ganador
    let maxScore = -1;
    let winner = null;
    race.participants.forEach(p => {
        const speed = p.tuning?.speedLevel || 1;
        const accel = p.tuning?.accelLevel || 1;
        const score = (speed * 0.6) + (accel * 0.4) + (Math.random() * 5); // Tuning + RNG Suerte
        p.score = score;
        if(score > maxScore) { maxScore = score; winner = p; }
    });
    race.maxScore = maxScore;
    race.winner = winner.id;
    
    broadcastState();

    setTimeout(() => {
        race.state = 'finished';
        const pot = race.bet * race.participants.length;
        const winnerPlayer = STATE.players[winner.id];
        if(winnerPlayer) winnerPlayer.solBalance += pot;
        
        handleChatHost(`🏁 ${winner.name} ganó la carrera y se llevó ${formatUSD(pot)}!`, 'System', true);
        broadcastState();
        
        setTimeout(() => {
            delete STATE.races[raceId];
            broadcastState();
        }, 10000);

    }, 6000);
}

function handleTuneCarHost(type, playerId) {
    const player = STATE.players[playerId];
    if(!player || !player.carTuning) return;
    const cost = 20;
    if(player.solBalance < cost) return;
    
    player.solBalance -= cost;
    if(type === 'speed') player.carTuning.speedLevel += 1;
    if(type === 'accel') player.carTuning.accelLevel += 1;
    
    hostEmitAlert(playerId, "Tuning mejorado con éxito!", "🛠️");
    broadcastState();
}

   if(botInterval) clearInterval(botInterval);

                });

        });

                const currentPrice = getPrice(token.solPool, token.tokenPool);
                const entryPrice = bot.tradesInfo?.[tokenId]?.entryPrice || currentPrice;
                const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
                let sellRatio = 0;
                
               // --- MODO PROFIT HUNTER (PELEA POR GANANCIA Y VENDEN RÁPIDO) ---
                const pnlFact = pnlPercent;
                const isQryzo = token.ticker === 'QRYZO';
                
                if (bot.strategy === 'RugPuller' && pnlFact > 50) sellRatio = 1.0;
                else if (isQryzo && pnlFact > 5) sellRatio = 0.5; // Lucha encarnizada por profit en QRYZO

                    const maxSafeDumpUsd = token.solPool * 0.4; // Max dump 40% of pool at once
                    
                    if (estUsdValue > maxSafeDumpUsd) {
                        // Scale down the dump amount to not drain more than 40% of liquidity
                        dumpAmount = dumpAmount * (maxSafeDumpUsd / estUsdValue);

let baseProb = isHighlyTrusted ? 0.2 : 0.01;

                    const newViews = Math.floor(baseViews * viralMult) + followersFactor;
                    
                    // LÍMITE 1M: Se sumarán las vistas hasta llegar a un tope máximo de 1,000,000
                    randomPost.views = Math.min(1000000, (randomPost.views || 0) + newViews);
                    
                    // Likes casi inexistentes (1 entre 1000 visitas en promedio)
                    if (Math.random() < 0.001 * viralMult) {
                        randomPost.likes = (randomPost.likes || 0) + 1;
                        if (Math.random() < 0.01) { // Que te sigan es aún más raro (1% después de dar like)
                            postAuthor.followers = (postAuthor.followers || 0) + 1;
                        }
                        didTrade = true;
                    }
                }
            }

            // --- BOTS POSTEAN EN DEGENX ---
            if (bot.isVerified && Math.random() < 0.002) {
                const msgs = ["Bullish en este mercado 🚀", "Acabo de inyectar liquidez. Estamos listos.", "Buscando la próxima gema 💎", "Paperhands out, real degens in.", "El FOMO es real hoy 🔥"];
                handlePostHost(msgs[Math.floor(Math.random()*msgs.length)], bot.id);
            }

            const canLaunch = bot.solBalance > 5 && tokenKeys.length < 50;
            // --- NUEVA LÓGICA DE CREACIÓN ---
            // Forzamos a 'false' para que los bots no generen tokens propios nunca
            const wantsToLaunch = false;
            if (canLaunch && wantsToLaunch && bot.solBalance < 1000000) { // Millionaires don't launch shitcoins
                const names = ["PepeBot", "Inu AI", "Safe", "Moon", "Cat", "Doge", "Gold", "Sigma", "Turbo"];
                const tName = names[Math.floor(Math.random()*names.length)] + " " + Math.floor(Math.random()*99);
                handleLaunchHost(tName, tName.substring(0,4).toUpperCase().replace(/\s/g, ''), '', bot.solBalance * 0.1, bot.id);
                didTrade = true;
            }
        });
        
        if(didTrade || needsBroadcast) broadcastState();
    }, 1500); 
}

// CLIENT ACTIONS DISPATCHER
function dispatchAction(type, payload) {
    if (STATE.roomConfig.isHost) {
        processMessageAsHost({ type, payload, senderId: STATE.myProfile.id, time: Date.now() });
    } else {
        const packet = { type, payload, senderId: STATE.myProfile.id };
        if (window.dataConn && window.dataConn.open) {
            window.dataConn.send(packet); 
        } else if(mqttClient && mqttClient.connected) {
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/in`, JSON.stringify(packet)); 
        }
    }
}

function addToast(msg, icon) {
    const id = Date.now() + Math.random(); STATE.toasts.push({ id, msg, icon }); updateToasts();
    setTimeout(() => { STATE.toasts = STATE.toasts.filter(t => t.id !== id); updateToasts(); }, 4000);
}

function updateToasts() {
    const c = document.getElementById('toasts-container');
    if (c) c.innerHTML = STATE.toasts.map(t => `<div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto"><span>${t.icon}</span> ${t.msg}</div>`).join('');

function requestUIRender(forceFull = false) {
    if (forceFull || STATE.route !== 'game') {

    requestAnimationFrame(() => { updateDynamicDOM(); uiRenderScheduled = false; });

function UpdateDevPanelDynamic() {
    const grid = document.getElementById('dev-tokens-grid');
    if(!grid) return;

    const myTokens = Object.values(STATE.tokens).filter(t => (t.creatorIds || [t.creatorId]).includes(STATE.myProfile.id));
    const totalTokens = myTokens.length;
    let totalFees = 0;
    let successfulTokens = 0;

    myTokens.forEach(t => {
        const vRes = t.virtualSol || VIRTUAL_USD_RESERVE;
        const cLim = t.curveLimit || BONDING_CURVE_LIMIT;
        
        const creatorsCount = t.creatorIds ? t.creatorIds.length : 1;
        const share = t.coFounders && t.coFounders[STATE.myProfile.id] ? t.coFounders[STATE.myProfile.id].share : (1/creatorsCount);
        
        totalFees += ((t.totalFeesEarned || 0) + (t.accumulatedFees || 0)) * share;
        
        const progress = Math.min(100, ((t.solPool - vRes) / cLim) * 100);
        if(progress >= 100) successfulTokens++;
    });

    const winRate = totalTokens > 0 ? ((successfulTokens / totalTokens) * 100).toFixed(1) : 0;

    const elTotalTokens = document.getElementById('dev-total-tokens'); if(elTotalTokens) elTotalTokens.innerText = totalTokens;
    const elWinRate = document.getElementById('dev-win-rate'); if(elWinRate) elWinRate.innerText = winRate + '%';
    const elTotalFees = document.getElementById('dev-total-fees'); if(elTotalFees) elTotalFees.innerText = formatUSD(totalFees);

    if(myTokens.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-10 flex flex-col items-center text-slate-500 border border-slate-800 rounded-2xl border-dashed bg-slate-900/30">No has creado ningún token aún.</div>`;
        return;
    }

    grid.innerHTML = myTokens.map(token => {
        const mcap = getPrice(token.solPool, token.tokenPool) * (token.initialSupply * 0.1);
        
        const creatorsCount = token.creatorIds ? token.creatorIds.length : 1;
        const share = token.coFounders && token.coFounders[STATE.myProfile.id] ? token.coFounders[STATE.myProfile.id].share : (1/creatorsCount);
        
        const feesToClaim = (token.accumulatedFees || 0) * share;
        const totalEarned = (token.totalFeesEarned || 0) * share;

        return `
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row justify-between gap-4 shadow-inner">
            <div class="flex items-center gap-3">
                <div class="text-3xl bg-slate-900 w-12 h-12 rounded-xl flex items-center justify-center border border-slate-700">${token.image?.startsWith('http') || token.image?.startsWith('data:') ? `<img src="${token.image}" class="w-full h-full object-cover rounded-xl"/>` : '🪙'}</div>
                <div>
                    <div class="font-black text-white text-base">${token.name} <span class="text-[10px] text-slate-500 font-mono bg-slate-900 px-1 rounded ml-1">$${token.ticker}</span></div>
                    <div class="text-[10px] text-slate-400 mt-1 uppercase tracking-wider font-bold">MCap: ${formatUSD(mcap)} • Exch: <span class="text-yellow-400">${token.exchange||'Pump'}</span></div>
                </div>
            </div>
            <div class="flex flex-col justify-center items-end bg-slate-900 p-2 px-3 rounded-xl border border-slate-800">
                <div class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Fees Pendientes (Tu Parte)</div>
                <div class="font-mono font-black text-emerald-400 text-lg">${formatUSD(feesToClaim)}</div>
                ${feesToClaim > 0 ? `<button onclick="dispatchAction('ACTION_CLAIM_FEES', {tokenId: '${token.id}'});" class="text-[8px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded uppercase mt-1 hover:bg-emerald-500/40 border border-emerald-500/30 transition-colors">Reclamar</button>` : `<div class="text-[8px] text-slate-600 uppercase mt-1">Histórico: ${formatUSD(totalEarned)}</div>`}
            </div>
        </div>`;
    }).join('');
}

function UpdateMarketDynamic() {
    const grid = document.getElementById('market-grid');
    if(!grid) return;
    
    const filtered = Object.values(STATE.tokens)
        .sort((a,b) => b.solPool - a.solPool)
        .filter(t => t.name.toLowerCase().includes(STATE.searchQuery.toLowerCase()) || t.ticker.toLowerCase().includes(STATE.searchQuery.toLowerCase()))
        .filter(t => {
            const creator = STATE.players[t.creatorId];
            if(STATE.marketFilter === 'human') return creator && !creator.isBot;
            if(STATE.marketFilter === 'bot') return !creator || creator.isBot;
            return true;
        });

    if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-500 border border-slate-800 rounded-3xl border-dashed bg-slate-900/30"><div class="text-4xl md:text-5xl mb-4 opacity-30">${Icons.Chart}</div><div class="font-bold text-sm md:text-lg text-white">No hay tokens aquí.</div></div>`;
        return;
    }

    grid.innerHTML = filtered.map(token => {
        const vRes = token.virtualSol || VIRTUAL_USD_RESERVE;
        const cLim = token.curveLimit || BONDING_CURVE_LIMIT;
        const progress = Math.min(100, ((token.solPool - vRes) / cLim) * 100);
        const isComplete = progress >= 100;
        const currentPrice = getPrice(token.solPool, token.tokenPool);
        const mcap = currentPrice * (token.initialSupply * 0.1);
        const exch = token.exchange || 'Pump.fun';

        const imgHTML = token.image && token.image.startsWith('data:image') || (token.image && token.image.startsWith('http'))

                    <h3 class="font-black text-white text-sm md:text-base truncate leading-tight mb-1">${token.name}</h3>

                </div>
                <div class="text-right shrink-0">
                    <div class="text-[10px] md:text-sm font-mono font-bold ${exch !== 'Pump.fun' ? 'text-yellow-400 animate-pulse' : isComplete ? 'text-purple-400 animate-pulse' : 'text-emerald-400'}">$${currentPrice.toFixed(8)}</div>

            </div>

// Bucle local para animar las carreras sin depender de renders de red
if(window.raceAnimInterval) clearInterval(window.raceAnimInterval);
window.raceAnimInterval = setInterval(() => {
    if(STATE.activeTab !== 'racing') return;
    const cars = document.querySelectorAll('.car-racer');
    cars.forEach(car => {
        const start = parseInt(car.dataset.start);
        const dur = parseInt(car.dataset.dur);
        const score = parseFloat(car.dataset.score);
        const maxScore = parseFloat(car.dataset.maxscore);
        const isWinner = car.dataset.iswinner === 'true';
        
        if(start && dur) {
            const elapsed = Date.now() - start;
            let rawProgress = elapsed / dur;
            
            if(rawProgress > 1) rawProgress = 1;
            
            // Los carros avanzan a diferentes velocidades basadas en su score, pero el ganador llega al 100%
            let mySpeedRatio = maxScore > 0 ? (score / maxScore) : 1;
            // Para dar sensación de carrera, añadimos un pequeño offset variable
            let variation = (Math.sin(elapsed / 200) * 2); 
            
            let finalProgress = rawProgress * mySpeedRatio * 100;
            
            if (rawProgress >= 1) {
                finalProgress = isWinner ? 100 : (mySpeedRatio * 90);
                variation = 0;
            } else if (isWinner) {
                finalProgress += variation;
            }

            // Clampear entre 0 y 100 (ajustando tamaño del icono 32px)
            finalProgress = Math.max(0, Math.min(100, finalProgress));
            
            car.style.left = `calc(${finalProgress}% - ${finalProgress === 100 ? 32 : 0}px)`;
        }
    });
}, 50);

function generateChartSVG(token, w, h, simplified) {
    let baseData = [...token.history];
    if (token.currentCandle) baseData.push(token.currentCandle);
    
    // AGREGACIÓN DE VELAS SEGÚN EL TIMEFRAME (1s o 15s)
    let data = [];
    const tf = STATE.chartTimeframe || 1;
    if (tf > 1 && !simplified) {
        let currentAgg = null;
        const msPerFrame = tf * 1000;
        baseData.forEach(candle => {
            const aggTime = Math.floor(candle.time / msPerFrame) * msPerFrame;
            if (!currentAgg || currentAgg.time !== aggTime) {
                if (currentAgg) data.push(currentAgg);
                currentAgg = { ...candle, time: aggTime };
            } else {
                currentAgg.high = Math.max(currentAgg.high, candle.high);
                currentAgg.low = Math.min(currentAgg.low, candle.low);
                currentAgg.close = candle.close;
                currentAgg.vol += candle.vol;
            }
        });
        if (currentAgg) data.push(currentAgg);
    } else {
        data = baseData;
    }

    let viewData = [];
    if (simplified) {
        viewData = data.slice(-100); 
    } else {
        let zoom = STATE.chartConfig?.zoom || 100;
        let offset = STATE.chartConfig?.offset || 0;
        const startIdx = Math.max(0, data.length - zoom - offset);
        const endIdx = Math.max(1, data.length - offset);
        viewData = data.slice(startIdx, endIdx);
    }

    if(viewData.length === 0) return '';

    // --- CÁLCULO DE DIMENSIONES CON EJE Y (NUEVO) ---
    const rightPadding = simplified ? 0 : 55; // Espacio para los labels de MC
    const pad = simplified ? 0 : 20;
    const iW = w - pad * 2 - rightPadding, iH = h - pad * 2;
    const minP = Math.min(...viewData.map(d=>d.low)), maxP = Math.max(...viewData.map(d=>d.high));
    const range = maxP - minP || 1;
    const yPad = range * 0.1;
    const dMin = minP - yPad, dMax = maxP + yPad, dRange = dMax - dMin;
    const getY = (val) => pad + iH - ((val - dMin) / dRange) * iH;
    const space = iW / Math.max(viewData.length, 25);
    const cW = Math.max(2, space * 0.7);

    let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
    
    // --- FONDO, REJILLA Y EJE Y ---
    if (!simplified) {
        for(let i=0; i<=4; i++) {
            const val = dMin + (dRange * (i/4));
            const y = getY(val);
            const mcapVal = val * ((token.initialSupply || 1000000000) * 0.1);
            
            // Formatear el label de la escala (Ej: 20K, 1.5M)
            let label = mcapVal >= 1000000 ? (mcapVal/1000000).toFixed(1) + 'M' : mcapVal >= 1000 ? (mcapVal/1000).toFixed(1) + 'K' : mcapVal.toFixed(0);

            // Líneas horizontales de fondo
            svg += `<line x1="0" y1="${y}" x2="${w - rightPadding}" y2="${y}" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1" />`;
            // Textos del Eje Y
            svg += `<text x="${w - rightPadding + 5}" y="${y + 4}" fill="#64748b" font-family="monospace" font-size="10">${label}</text>`;
        }
    }

    // --- DIBUJAR VELAS ---
    viewData.forEach((c, i) => {
        const isUp = c.close >= c.open;
        const color = isUp ? '#10b981' : '#ef4444';
        const x = pad + (i * space) + (space / 2);
        const bY = Math.min(getY(c.open), getY(c.close));
        const bH = Math.max(Math.abs(getY(c.open) - getY(c.close)), 1.5);
        svg += `<line x1="${x}" y1="${getY(c.high)}" x2="${x}" y2="${getY(c.low)}" stroke="${color}" stroke-width="${simplified?1:2}" opacity="0.6"/>`;
        svg += `<rect x="${x - cW/2}" y="${bY}" width="${cW}" height="${bH}" fill="${color}" rx="1" />`;
    });

    // --- LÍNEA DE PRECIO ACTUAL ESTILO TRADINGVIEW (NUEVO) ---
    if (!simplified && viewData.length > 0) {
        const currentPrice = viewData[viewData.length - 1].close;
        const currentY = getY(currentPrice);
        const currentMcap = currentPrice * ((token.initialSupply || 1000000000) * 0.1);
        let mcapLabel = currentMcap >= 1000000 ? (currentMcap/1000000).toFixed(2) + 'M' : currentMcap >= 1000 ? (currentMcap/1000).toFixed(1) + 'K' : currentMcap.toFixed(0);

        // Línea punteada que cruza la pantalla
        svg += `<line x1="0" y1="${currentY}" x2="${w - rightPadding}" y2="${currentY}" stroke="#94a3b8" stroke-dasharray="2 2" stroke-width="1" opacity="0.8" />`;
        
        // Caja resaltada en el eje Y
        svg += `<rect x="${w - rightPadding}" y="${currentY - 10}" width="${rightPadding}" height="20" fill="#1e293b" stroke="#475569" stroke-width="1" />`;
        
        // Texto exacto dentro de la caja
        svg += `<text x="${w - rightPadding + 5}" y="${currentY + 4}" fill="#f8fafc" font-family="monospace" font-weight="bold" font-size="10">${mcapLabel}</text>`;
    }

    svg += `</svg>`;
    return svg;
}

window.onload = () => {
    const navEntries = performance.getEntriesByType("navigation");
    if (navEntries.length > 0 && navEntries[0].type === "reload") {
        window.location.href = 'index.html';
        return;
    }

    const profileStr = localStorage.getItem('degen_profile');
    if(!profileStr) { window.location.href = 'index.html'; return; }

    STATE.myProfile = JSON.parse(profileStr);
    const urlParams = new URLSearchParams(window.location.search);

    // CASO DE CARGAR PARTIDA
    if(urlParams.get('load') === 'true') {
        loadGameFromStorage();
        if(botInterval) clearInterval(botInterval); startBotBrain();
        return;
    }

    // Normalización de código para evitar problemas de minúsculas o espacios
    let codeParam = urlParams.get('code') || urlParams.get('room');
    const code = codeParam ? codeParam.trim().toUpperCase() : null;
    
    const isHost = urlParams.get('host') === 'true';
    const isOffline = urlParams.get('offline') === 'true';

    if(!code && !isOffline) { window.location.href = 'index.html'; return; }

    if(isOffline) {
        STATE.roomConfig = {...STATE.roomConfig, code: 'LOCAL', isHost: true, isOffline: true };
        initNetwork('LOCAL', 'offline', STATE.roomConfig.botCount);
    } else if(isHost) {
        STATE.roomConfig = {...STATE.roomConfig, code: code, isHost: true, isOffline: false };
        initNetwork(code, 'host', STATE.roomConfig.botCount);
    } else {
        STATE.roomConfig = {...STATE.roomConfig, code: code, isHost: false, isOffline: false};
        initNetwork(code, 'client');
    }

    if(botInterval) clearInterval(botInterval); startBotBrain();
    requestUIRender(true);
};
// --- MOTOR INTERACTIVO DE LA GRÁFICA (ZOOM Y PANNING) ---
function setupChartInteractions(container) {
    if (container.hasAttribute('data-interactive')) return;
    container.setAttribute('data-interactive', 'true');
    container.style.cursor = 'grab';
    container.style.touchAction = 'none'; 

    let isDragging = false;
    let startX = 0;
    let currentOffsetAtStart = 0;

    // ZOOM CON RUEDA (PC)
    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (!STATE.chartConfig) STATE.chartConfig = { zoom: 100, offset: 0 };
        const zoomStep = Math.ceil(STATE.chartConfig.zoom * 0.1);
        STATE.chartConfig.zoom += e.deltaY > 0 ? zoomStep : -zoomStep;
        STATE.chartConfig.zoom = Math.max(10, Math.min(STATE.chartConfig.zoom, 1000));
        UpdateChartVisualsOnly();
    }, { passive: false });

    // MOVILIDAD (PC)
    container.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX;
        currentOffsetAtStart = STATE.chartConfig?.offset || 0;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const diffX = e.pageX - startX;
        const candleDiff = Math.floor(diffX / 5);
        const tf = STATE.chartTimeframe || 1;
        const token = STATE.tokens[STATE.selectedTokenId];
        if (!token) return;
        const totalCandles = Math.ceil((token.history.length + 1) / tf);
        const maxOffset = Math.max(0, totalCandles - (STATE.chartConfig?.zoom || 100));
        STATE.chartConfig.offset = Math.max(0, Math.min(maxOffset, currentOffsetAtStart + candleDiff));
        UpdateChartVisualsOnly();
    });

    window.addEventListener('mouseup', () => { isDragging = false; container.style.cursor = 'grab'; });

    // ZOOM Y MOVILIDAD TÁCTIL (MÓVIL)
    let initialPinchDist = null;
    let initialZoomAtPinch = 100;

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].pageX;
            currentOffsetAtStart = STATE.chartConfig?.offset || 0;
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            initialZoomAtPinch = STATE.chartConfig?.zoom || 100;
        }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            const diffX = e.touches[0].pageX - startX;
            const candleDiff = Math.floor(diffX / 5);
            const token = STATE.tokens[STATE.selectedTokenId];
            if (!token) return;
            const totalCandles = Math.ceil((token.history.length + 1) / (STATE.chartTimeframe || 1));
            const maxOffset = Math.max(0, totalCandles - (STATE.chartConfig?.zoom || 100));
            STATE.chartConfig.offset = Math.max(0, Math.min(maxOffset, currentOffsetAtStart + candleDiff));
            UpdateChartVisualsOnly();
        } else if (e.touches.length === 2 && initialPinchDist) {
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const scale = initialPinchDist / dist;
            STATE.chartConfig.zoom = Math.max(10, Math.min(initialZoomAtPinch * scale, 1000));
            UpdateChartVisualsOnly();
        }
    }, { passive: false });

    container.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });
}

function UpdateChartVisualsOnly() {
    const token = STATE.tokens[STATE.selectedTokenId];
    if (!token) return;
    const chEl = document.getElementById('tok-chart');
    if (chEl) chEl.innerHTML = generateChartSVG(token, chEl.clientWidth, chEl.clientHeight, false);
}
// ==========================================
// MOTOR DE REDIMENSIONADO SPLIT-SCREEN
// ==========================================
function setupResizableSplitter() {
    const container = document.getElementById('split-container');
    const resizer = document.getElementById('resizer-h');
    const paneChart = document.getElementById('pane-chart');
    const paneTrade = document.getElementById('pane-trade');

    if (!container || !resizer || !paneChart || !paneTrade) return;

    let isResizing = false;

    // Iniciar arrastre (PC y Móvil)
    const startResize = (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none'; // Evitar seleccionar texto al arrastrar
        resizer.classList.add('bg-emerald-500'); // Feedback visual
    };

    // Detener arrastre (PC y Móvil)
    const stopResize = () => {
        if (!isResizing) return;
        isResizing = false;
        document.body.style.cursor = 'default';
        document.body.style.userSelect = 'auto';
        resizer.classList.remove('bg-emerald-500');
        // Forzar actualización de la gráfica para que se ajuste al nuevo tamaño
        if(typeof UpdateChartVisualsOnly === 'function') UpdateChartVisualsOnly();
    };

    // Lógica de movimiento (PC y Móvil)
    const resize = (e) => {
        if (!isResizing) return;

        let clientX;
        if (e.type === 'touchmove') {
            clientX = e.touches[0].clientX;
        } else {
            clientX = e.clientX;
        }

        const containerRect = container.getBoundingClientRect();
        const containerWidth = containerRect.width;
        
        // Calcular la posición relativa en porcentaje (0 a 100)
        let pointerX = clientX - containerRect.left;
        let percentage = (pointerX / containerWidth) * 100;

        // Aplicar límites (mínimo 20% para la gráfica, mínimo 300px para el trade)
        const minChartPct = (200 / containerWidth) * 100; // min-w-[200px]
        const minTradePct = (300 / containerWidth) * 100; // min-w-[300px]
        
        percentage = Math.max(minChartPct, Math.min(percentage, 100 - minTradePct));

        // Aplicar anchos
        paneChart.style.width = `${percentage}%`;
        paneTrade.style.width = `${100 - percentage}%`;
    };

    // Event Listeners Ratón (PC)
    resizer.addEventListener('mousedown', startResize);
    window.addEventListener('mousemove', resize);
    window.addEventListener('mouseup', stopResize);

    // Event Listeners Táctil (Móvil)
    resizer.addEventListener('touchstart', startResize, { passive: true });
    window.addEventListener('touchmove', resize, { passive: false }); // preventDefault necesario aquí
    window.addEventListener('touchend', stopResize);
}

// Enganchar el redimensionador cada vez que se navega al detalle de un token
// Enganchar el redimensionador cada vez que se navega al detalle de un token
const originalUpdateUI = window.updateUI;
window.updateUI = function() {
    if (typeof originalUpdateUI === 'function') originalUpdateUI();
    if (STATE.selectedTokenId) {
        // Un pequeño delay para asegurar que el DOM se renderizó
        setTimeout(setupResizableSplitter, 50);
    }
};
