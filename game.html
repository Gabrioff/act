function getSpawnPos() {
    const spawn = (STATE.worldMap?.objects || []).find(o => o.type === 'spawn');
    if (spawn) return { x: spawn.x + spawn.w/2, y: spawn.y + spawn.h/2 };
    return { x: (STATE.worldMap?.width || 10000)/2, y: (STATE.worldMap?.height || 10000)/2 };
}

function tLog(msg, color='text-emerald-400') {
    const time = new Date().toLocaleTimeString([], {hour12: false});
    STATE.netLogs.push(`<span class="text-slate-500">[${time}]</span> <span class="${color}">${msg}</span>`);
    if(STATE.netLogs.length > 50) STATE.netLogs.shift();
    const consoleEl = document.getElementById('debug-console');
    if(consoleEl) { consoleEl.innerHTML = STATE.netLogs.join('<br>'); consoleEl.scrollTop = consoleEl.scrollHeight; }
}

window.copyInviteLink = function() {
    const link = window.location.origin + window.location.pathname.replace('game.html', 'index.html') + '?room=' + STATE.roomConfig.code;
    try { navigator.clipboard.writeText(link); addToast('Link copiado!', '📋');
    } catch(e) {
        const dummy = document.createElement('input'); document.body.appendChild(dummy);
        dummy.value = link; dummy.select(); document.execCommand('copy'); document.body.removeChild(dummy);
        addToast('Link copiado!', '📋');
    }
};

window.handleImageUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas'); const MAX_SIZE = 150;
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/webp', 0.8);
            STATE.launchData.image = dataUrl;
            const urlInput = document.getElementById('l-image'); if(urlInput) urlInput.value = '';
            const preview = document.getElementById('img-preview');
            if(preview) { preview.src = dataUrl; preview.classList.remove('hidden'); }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};

window.loadCustomMap = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const loaded = JSON.parse(e.target.result);
            if(loaded.width && loaded.objects) {
                STATE.worldMap = loaded;
                const pos = getSpawnPos();
                Object.values(STATE.players).forEach(p => { p.x = pos.x; p.y = pos.y; });
                addToast("Mapa personalizado cargado!", "🌍");
                broadcastState();
            } else { addToast("Mapa inválido. Usa un archivo exportado por Degen Editor.", "❌"); }
        } catch(err) { addToast("Error leyendo archivo.", "❌"); }
        event.target.value = ''; 
    };
    reader.readAsText(file);
};

function saveGame() {
    if(!STATE.roomConfig.isHost) return addToast("Solo el Host puede guardar", "❌");
    const saveData = { players: STATE.players, tokens: STATE.tokens, roomConfig: STATE.roomConfig, chat: STATE.chat, gameState: STATE.gameState, worldMap: STATE.worldMap };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
    const dlAnchorElem = document.createElement('a'); dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `DegenTerminal_Save_${STATE.roomConfig.code}.json`);
    dlAnchorElem.click(); addToast("Partida guardada exitosamente", "💾");
}

function loadGameFromStorage() {
    try {
        const loaded = JSON.parse(sessionStorage.getItem('degen_savegame'));
        if(loaded && loaded.players && loaded.roomConfig) {
            STATE.players = loaded.players; STATE.tokens = loaded.tokens || {};
            STATE.roomConfig = loaded.roomConfig; STATE.chat = loaded.chat || []; STATE.gameState = loaded.gameState || 'waiting';
            if(loaded.worldMap) STATE.worldMap = loaded.worldMap;
            
            const hostProfile = Object.values(STATE.players).find(p => !p.isBot) || STATE.players[Object.keys(STATE.players)[0]];
            STATE.myProfile = { ...hostProfile };
            
            const mode = STATE.roomConfig.isOffline ? 'offline' : (STATE.roomConfig.isHost ? 'host' : 'client');
            initNetwork(STATE.roomConfig.code, mode, STATE.roomConfig.botCount);
            
            STATE.route = STATE.gameState === 'playing' ? 'game' : 'lobby';
            if(!STATE.roomConfig.hasMap && STATE.activeTab === 'world') STATE.activeTab = 'market';
            addToast("Partida cargada", "✅"); requestUIRender(true);
        } else { addToast("Archivo inválido.", "❌"); setTimeout(()=>window.location.href='index.html', 2000); }
    } catch(err) { addToast("Error leyendo archivo.", "❌"); setTimeout(()=>window.location.href='index.html', 2000); }
}

function playAudioStream(stream, peerId) {
    let audio = document.getElementById('audio-' + peerId);
    if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'audio-' + peerId;
        audio.autoplay = true;
        document.body.appendChild(audio);
    }
    audio.srcObject = stream;
}

async function toggleVoice() {
    if (STATE.voiceActive) {
        if(voiceInterval) clearInterval(voiceInterval);
        if(audioContext) audioContext.close();
        if(window.localAudioStream) {
            window.localAudioStream.getTracks().forEach(t => t.stop());
            window.localAudioStream = null;
        }
        STATE.voiceActive = false;
        STATE.localSpeaking = false;
        dispatchAction('ACTION_VOICE', { isSpeaking: false });
        tLog("Chat de Voz Desactivado", "text-yellow-400");
        updateUI();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.localAudioStream = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        STATE.voiceActive = true;
        tLog("Chat de Voz Activado y Compartiendo", "text-emerald-400");
        updateUI();

        if (peer && !STATE.roomConfig.isOffline) {
            Object.values(STATE.players).forEach(p => {
                if (!p.isBot && p.peerId && p.id !== STATE.myProfile.id) {
                    const call = peer.call(p.peerId, stream);
                    if(call) { call.on('stream', remoteStream => { playAudioStream(remoteStream, p.id); }); }
                }
            });
        }

        voiceInterval = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<bufferLength; i++) sum += dataArray[i];
            let avg = sum / bufferLength;
            
            let isSpeaking = avg > 15; 
            if(isSpeaking !== STATE.localSpeaking) {
                STATE.localSpeaking = isSpeaking;
                dispatchAction('ACTION_VOICE', { isSpeaking: isSpeaking });
                if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = isSpeaking;
                updateUI();
            }
        }, 150); 
    } catch(e) { 
        console.error(e); 
        tLog("Error WebRTC Audio: Permiso Denegado", "text-red-400");
        alert("Permiso de micrófono denegado o no disponible."); 
    }
}

window.adjustBots = function(targetCount) {
    if (!STATE.roomConfig.isHost) return;
    if (!STATE.roomConfig.botsEnabled) targetCount = 0;
    
    const currentBotKeys = Object.keys(STATE.players).filter(k => STATE.players[k].isBot && k !== 'SYSTEM_MM');
    if (currentBotKeys.length < targetCount) {
        const toAdd = targetCount - currentBotKeys.length;
        const startIndex = currentBotKeys.length;
        const pos = getSpawnPos();

        for (let i = 0; i < toAdd; i++) {
            const strategy = BOT_STRATEGIES[Math.floor(Math.random() * BOT_STRATEGIES.length)];
            let startBal = 10;
            if (strategy === 'Whale') startBal = 200;
            else if (strategy === 'Degen' || strategy === 'Sniper' || strategy === 'RugPuller') startBal = 40;
            else if (strategy === 'PaperHands') startBal = 15;
            
            const id = `bot_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
            STATE.players[id] = { 
                id: id, name: `${strategy}_Bot${startIndex + i}`, avatar: '🤖', 
                solBalance: startBal, portfolio: {}, isBot: true, strategy: strategy,
                reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0,
                x: pos.x + (Math.random() * 400 - 200), y: pos.y + (Math.random() * 400 - 200)
            };
        }
    } else if (currentBotKeys.length > targetCount) {
        const toRemove = currentBotKeys.length - targetCount;
        for (let i = 0; i < toRemove; i++) delete STATE.players[currentBotKeys[i]];
    }
    broadcastState();
};

const BROKER_URLS = [
    'wss://broker.emqx.io:8084/mqtt',      
    'wss://broker.hivemq.com:8884/mqtt',   
    'wss://test.mosquitto.org:8081/mqtt'   
];
let currentBrokerIndex = 0;

function initNetwork(roomId, mode, customBotCount = 20) {
    if (peer) { peer.destroy(); peer = null; }
    if (mqttClient) { mqttClient.end(); mqttClient = null; }
    STATE.netLogs = []; 

    if (mode === 'offline') {
        tLog("Iniciando Entorno de Simulación Local.", "text-purple-400");
        const pos = getSpawnPos();
        STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, x: pos.x, y: pos.y, speed: 2, mountedId: null };
        if(!STATE.players['SYSTEM_MM']) STATE.players['SYSTEM_MM'] = { id: 'SYSTEM_MM', name: 'Market_Maker', avatar: '📰', isBot: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, x:-100, y:-100 };
        window.adjustBots(customBotCount);
        addToast("Modo Offline Activado", "🔌");
        requestUIRender(true);
        startSystemEvents(); 
        if(STATE.roomConfig.hasMap) startWorldEngine();
        return;
    }

    const url = BROKER_URLS[currentBrokerIndex];
    tLog(`[PROXY] Construyendo túnel cifrado a través de: ${url.split('//')[1]}`, "text-blue-400");
    const clientId = 'degen_' + Math.random().toString(16).substr(2, 8);
    mqttClient = mqtt.connect(url, { clientId, connectTimeout: 5000, reconnectPeriod: 0 });

    mqttClient.on('connect', () => {
        tLog("✓ [VPN-SIM] Firewall evadido. Tráfico cifrado.", "text-emerald-400");
        mqttClient.options.reconnectPeriod = 1000;
        
        if (mode === 'host') {
            mqttClient.subscribe(`dgn/${roomId}/in`);
            addToast(`Sala Segura Creada: ${roomId}`, '🌐');
            const pos = getSpawnPos();
            STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0, x: pos.x, y: pos.y, speed: 2, mountedId: null };
            if(!STATE.players['SYSTEM_MM']) STATE.players['SYSTEM_MM'] = { id: 'SYSTEM_MM', name: 'Market_Maker', avatar: '📰', isBot: true, solBalance: 999999, portfolio: {}, reputation: 100, solStaked: 0, x:-100, y:-100 };
            window.adjustBots(customBotCount);
            requestUIRender(true);
            startSystemEvents();
            if(STATE.roomConfig.hasMap) startWorldEngine();

            // PUBLICADOR GLOBAL SERVERLESS (Muestra la sala en el index.html de otros)
            setInterval(() => {
                if (STATE.roomConfig.isHost && !STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
                    mqttClient.publish('dgn_global_discovery_v2', JSON.stringify({
                        code: STATE.roomConfig.code,
                        roomName: STATE.roomConfig.name,
                        hasMap: STATE.roomConfig.hasMap,
                        host: STATE.myProfile.name,
                        players: Object.keys(STATE.players).length,
                        max: STATE.roomConfig.maxPlayers,
                        gameState: STATE.gameState
                    }));
                }
            }, 3000);

        } else {
            mqttClient.subscribe(`dgn/${roomId}/out`);
            const pos = getSpawnPos();
            const joinPacket = { type: 'JOIN_REQ', payload: { ...STATE.myProfile, x: pos.x, y: pos.y, speed: 2, mountedId: null }, senderId: STATE.myProfile.id };
            mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
            addToast("Buscando al Host...", '⏳');
            
            if(window.handshakeInterval) clearInterval(window.handshakeInterval);
            window.handshakeInterval = setInterval(() => {
                if(Object.keys(STATE.players).length <= 1) {
                    tLog(`[!] Intentando conectar (Host ocupado o de lejos)...`, "text-orange-400");
                    mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(joinPacket));
                } else {
                    clearInterval(window.handshakeInterval);
                    if(STATE.roomConfig.hasMap && !window.worldEngineStarted) {
                        window.worldEngineStarted = true;
                        startWorldEngine();
                    }
                }
            }, 3000);
        }
    });

    mqttClient.on('message', (topic, message) => {
        try {
            const data = JSON.parse(message.toString());
            if (mode === 'host' && topic.endsWith('/in')) processMessageAsHost(data);
            else if (mode === 'client' && topic.endsWith('/out')) processMessageAsClient(data);
        } catch(e) {}
    });

    mqttClient.on('close', () => {
        if (!mqttClient.connected) {
            tLog(`[!] Túnel colapsó. Rotando proxy...`, "text-yellow-400");
            currentBrokerIndex = (currentBrokerIndex + 1) % BROKER_URLS.length;
            setTimeout(() => { if(STATE.route === 'lobby' || STATE.route === 'game') connectMQTT(roomId, mode, customBotCount); }, 1500);
        }
    });

    // WEBRTC VOZ Y P2P DATA
    try {
        if (mode === 'host') {
            peer = new Peer(`dgn-voice-${roomId}`, WEBRTC_CONFIG);
            window.clientConns = {}; // Almacenar conexiones de datos P2P
            peer.on('open', (id) => { 
                STATE.myProfile.peerId = id; 
                STATE.roomConfig.hostPeerId = id; // Guardar para clientes
            });
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.senderId) {
                        window.clientConns[data.senderId] = conn;
                        // Si es un saludo inicial P2P, le enviamos el mapa pesado directo
                        if (data.type === 'P2P_HELLO') {
                            conn.send({ type: 'STATE_SYNC', payload: { players: STATE.players, tokens: STATE.tokens, chat: STATE.chat, gameState: STATE.gameState, worldMap: STATE.worldMap } });
                            return;
                        }
                    }
                    if (data.type === 'PING') { conn.send({ type: 'PONG', target: data.senderId, time: data.time }); return; }
                    processMessageAsHost(data);
                });
            });
            peer.on('call', call => {
                if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
            });
        } else {
            peer = new Peer(WEBRTC_CONFIG);
            peer.on('open', (id) => { STATE.myProfile.peerId = id; });
            peer.on('call', call => {
                if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
            });
        }
    } catch(e) { tLog("Servicio WebRTC no disponible.", "text-slate-500"); }

    if (pingerInterval) clearInterval(pingerInterval);
    pingerInterval = setInterval(() => {
        if (STATE.gameState === 'playing' && !STATE.roomConfig.isHost) {
            const pPacket = { type: 'PING', senderId: STATE.myProfile.id, time: Date.now() };
            if (window.dataConn && window.dataConn.open) {
                window.dataConn.send(pPacket);
            } else if (mqttClient && mqttClient.connected) {
                mqttClient.publish(`dgn/${roomId}/in`, JSON.stringify(pPacket));
            }
        }
    }, 2000);
}

// ---------------- EVENTOS DEL SISTEMA ----------------
function startSystemEvents() {
    if (!STATE.roomConfig.isHost) return;
    
    if (newsInterval) clearInterval(newsInterval);
    newsInterval = setInterval(() => {
        if (STATE.gameState !== 'playing' || !STATE.roomConfig.botsEnabled) return;
        const tKeys = Object.keys(STATE.tokens);
        if (tKeys.length === 0 || Math.random() > 0.4) return; 
        
        const randomTokenId = tKeys[Math.floor(Math.random() * tKeys.length)];
        const token = STATE.tokens[randomTokenId];
        if ((token.solPool - VIRTUAL_USD_RESERVE) < 1) return; 
        
        const events = [
            { msg: `📰 RUMOR: ¡Elon Musk acaba de tuitear algo sospechosamente parecido a $${token.ticker}!`, buy: true },
            { msg: `📰 HYPE: Un exchange Top 10 acaba de anunciar que está revisando $${token.ticker}!`, buy: true },
            { msg: `📰 FOMO: ¡Un wallet anónimo acaba de comprar masivamente $${token.ticker}!`, buy: true },
            { msg: `📰 FUD: Se detectó que el dev de $${token.ticker} está moviendo tokens a una nueva wallet...`, buy: false },
            { msg: `📰 PANIC: ¡Un grupo de Telegram está coordinando un dump masivo de $${token.ticker}!`, buy: false }
        ];
        
        const ev = events[Math.floor(Math.random() * events.length)];
        const simVol = Math.random() * 8 + 2; 
        if (!ev.buy) {
             const mm = STATE.players['SYSTEM_MM'];
             mm.portfolio[randomTokenId] = (mm.portfolio[randomTokenId] || 0) + calcTokensOut(simVol, token.solPool, token.tokenPool);
        }
        
        handleTradeHost(randomTokenId, ev.buy, ev.buy ? simVol : STATE.players['SYSTEM_MM'].portfolio[randomTokenId], 'SYSTEM_MM', true);
        handleChatHost(ev.msg, 'SYSTEM_MM', true);
        broadcastState();
    }, 20000); 

    if (stakingInterval) clearInterval(stakingInterval);
    stakingInterval = setInterval(() => {
        if (STATE.gameState !== 'playing') return;
        let stateChanged = false;
        Object.values(STATE.players).forEach(p => {
            if (p.solStaked && p.solStaked > 0) {
                p.solStaked += (p.solStaked * 0.01);
                stateChanged = true;
            }
        });
        if (stateChanged) broadcastState();
    }, 10000);
}

function processMessageAsHost(data) {
    const { type, payload, senderId, time } = data;
    
    if (type === 'PING') { mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'PONG', target: senderId, time })); return; }
    
    if (type === 'JOIN_REQ') {
        if (STATE.players[payload.id]) {
            // PREVENIR BUG DE BALANCE: Si ya existe en la DB de sesión, solo actualizar estado
            STATE.players[payload.id].x = payload.x;
            STATE.players[payload.id].y = payload.y;
            STATE.players[payload.id].name = payload.name;
            STATE.players[payload.id].avatar = payload.avatar;
        } else {
            // Jugador nuevo
            if (Object.keys(STATE.players).length >= STATE.roomConfig.maxPlayers) {
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'JOIN_REJECT', target: payload.id, reason: 'Sala llena' }));
                return;
            }
            STATE.players[payload.id] = { ...payload, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, solStaked: 0 };
        }
        // Avisarle que se meta enviándole la config de la sala
        mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'ROOM_CONFIG', payload: STATE.roomConfig, target: payload.id }));
        broadcastState();
    }
    
    if (type === 'ACTION_MOVE') {
        if(STATE.players[senderId]) {
            STATE.players[senderId].x = payload.x;
            STATE.players[senderId].y = payload.y;
            STATE.players[senderId].mountedId = payload.mountedId;
            
            if (payload.mountedId && STATE.worldMap && STATE.worldMap.objects) {
                const car = STATE.worldMap.objects.find(o => o.id === payload.mountedId);
                if (car && payload.carX !== undefined && payload.carY !== undefined) {
                    car.x = payload.carX;
                    car.y = payload.carY;
                }
            }
            // OPTIMIZACIÓN DE RED: Broadcast ligero de movimiento
            const syncPkt = { type: 'SYNC_MOVE', senderId, payload };
            if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(syncPkt));
            }
            if (window.clientConns) {
                Object.values(window.clientConns).forEach(c => { if(c.open) c.send(syncPkt); });
            }
        }
    }
    
    if (type === 'ACTION_MAP_UPDATE') {
        if (STATE.worldMap && STATE.worldMap.objects) {
            const obj = STATE.worldMap.objects.find(o => o.id === payload.id);
            if (obj) {
                if (payload.x !== undefined) obj.x = payload.x;
                if (payload.y !== undefined) obj.y = payload.y;
                if (payload.color !== undefined) obj.color = payload.color;
                broadcastState(); // Importante: Compartir el cambio a todos
            }
        }
    }
    
    if (type === 'ACTION_PLAYER_SYNC') {
        if (STATE.players[senderId]) {
            if (payload.solBalance !== undefined) STATE.players[senderId].solBalance = payload.solBalance;
            if (payload.reputation !== undefined) STATE.players[senderId].reputation = payload.reputation;
            if (payload.speed !== undefined) STATE.players[senderId].speed = payload.speed;
            broadcastState();
        }
    }

    if (type === 'ACTION_TRADE') handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, senderId);
    if (type === 'ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, senderId);
    if (type === 'ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, senderId);
    if (type === 'ACTION_CHAT') handleChatHost(payload.msg, senderId, false);
    if (type === 'ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, senderId);
    if (type === 'ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, senderId);
    if (type === 'ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot).length + 1); }
    if (type === 'ACTION_CHARITY') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 5); 
            handleChatHost(`💖 ${p.name} quemó ${formatSOL(payload.amount)} por beneficencia!`, senderId, true);
            broadcastState();
        }
    }
    if (type === 'ACTION_AIRDROP') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 8); 
            const humans = Object.values(STATE.players).filter(pl => !pl.isBot && pl.id !== senderId);
            if (humans.length > 0) {
                const split = payload.amount / humans.length;
                humans.forEach(h => { h.solBalance += split; });
                handleChatHost(`🚁 AIRDROP: ${p.name} repartió ${formatSOL(payload.amount)} a ${humans.length} degens!`, senderId, true);
            } else { handleChatHost(`🚁 ${p.name} intentó un Airdrop, pero no hay humanos. Se quemaron.`, senderId, true); }
            broadcastState();
        }
    }
    if (type === 'ACTION_CASINO') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount;
            if(Math.random() > 0.5) {
                p.solBalance += (payload.amount * 2);
                handleChatHost(`🎰 ¡${p.name} ganó ${formatSOL(payload.amount)} en el Casino! x2`, senderId, true);
            } else { handleChatHost(`🎰 ${p.name} fue liquidado y perdió ${formatSOL(payload.amount)} en el Casino. F`, senderId, true); }
            broadcastState();
        }
    }
    if (type === 'ACTION_STAKE') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount && payload.amount > 0) {
            p.solBalance -= payload.amount; p.solStaked = (p.solStaked || 0) + payload.amount;
            broadcastState();
        }
    }
    if (type === 'ACTION_UNSTAKE') {
        const p = STATE.players[senderId];
        if(p && p.solStaked >= payload.amount && payload.amount > 0) {
            p.solStaked -= payload.amount; p.solBalance += payload.amount;
            broadcastState();
        }
    }
}

function processMessageAsClient(data) {
    const { type, payload, senderId, time, target } = data;
    
    // OPTIMIZACIÓN DE RED: Manejar movimiento ligero sin re-render UI
    if (type === 'SYNC_MOVE') {
        if(STATE.players[senderId]) {
            STATE.players[senderId].x = payload.x;
            STATE.players[senderId].y = payload.y;
            STATE.players[senderId].mountedId = payload.mountedId;
            if (payload.mountedId && STATE.worldMap && STATE.worldMap.objects) {
                const car = STATE.worldMap.objects.find(o => o.id === payload.mountedId);
                if (car && payload.carX !== undefined && payload.carY !== undefined) {
                    car.x = payload.carX; car.y = payload.carY;
                }
            }
        }
        return; // No requerimos render de UI completo para esto
    }
    
    if (type === 'ROOM_CONFIG' && target === STATE.myProfile.id) {
        STATE.roomConfig.name = payload.name;
        STATE.roomConfig.hasMap = payload.hasMap;
        STATE.roomConfig.hostPeerId = payload.hostPeerId; // Guardar PeerID P2P
        if (!payload.hasMap && STATE.activeTab === 'world') STATE.activeTab = 'market';
        requestUIRender(true);

        // ESTABLECER CONEXIÓN P2P DIRECTA (~10ms - 50ms)
        if (payload.hostPeerId && (!window.dataConn || !window.dataConn.open)) {
            try {
                window.dataConn = peer.connect(payload.hostPeerId);
                window.dataConn.on('open', () => { 
                    tLog("⚡ Conexión P2P Directa Establecida", "text-cyan-400"); 
                    // Obligar a WebRTC a mandar un saludo para registrarnos y recibir el mapa
                    window.dataConn.send({ type: 'P2P_HELLO', senderId: STATE.myProfile.id });
                });
                window.dataConn.on('data', (data) => processMessageAsClient(data));
            } catch(e) {}
        }
    }
    
    if (type === 'STATE_SYNC') {
        const myLocalX = STATE.players[STATE.myProfile.id]?.x;
        const myLocalY = STATE.players[STATE.myProfile.id]?.y;
        const myMounted = STATE.players[STATE.myProfile.id]?.mountedId;
        
        STATE.players = payload.players; 
        STATE.tokens = payload.tokens; 
        STATE.gameState = payload.gameState; 
        STATE.chat = payload.chat;
        if (payload.worldMap) STATE.worldMap = payload.worldMap; // Solo actualizar mapa si el paquete lo incluye
        
        if (STATE.players[STATE.myProfile.id] && myLocalX !== undefined) {
            STATE.players[STATE.myProfile.id].x = myLocalX;
            STATE.players[STATE.myProfile.id].y = myLocalY;
            STATE.players[STATE.myProfile.id].mountedId = myMounted;
        }

        let force = false;
        if(STATE.route === 'lobby' && STATE.gameState === 'playing') { STATE.route = 'game'; force = true; }
        requestUIRender(force);
    }
    if (type === 'PONG' && target === STATE.myProfile.id) { STATE.ping = Date.now() - time; const pingEl = document.getElementById('ping-display'); if(pingEl) pingEl.innerText = STATE.ping + 'ms'; }
    if (type === 'JOIN_REJECT' && target === STATE.myProfile.id) {
        addToast("Error: " + payload.reason, "❌"); if(mqttClient) { mqttClient.end(); mqttClient = null; }
        setTimeout(() => window.location.href = 'index.html', 2000);
    }
    if (type === 'EVENT_ALERT') { if (STATE.trackedIds.has(senderId)) addToast(payload.msg, payload.icon); }
}

function broadcastState() {
    if (STATE.roomConfig.isHost) {
        const syncPayload = { players: STATE.players, tokens: STATE.tokens, chat: STATE.chat, gameState: STATE.gameState };

        // MQTT (Paquete Ligero: Omitimos el mapa para evitar que el servidor global lo bloquee)
        if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
            const msg = { type: 'STATE_SYNC', payload: syncPayload };
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(msg));
        }
        
        // P2P Ultra Rápido (Paquete Completo: Enviamos el mapa sin límites de tamaño)
        if (window.clientConns) {
            const msgObjFull = { type: 'STATE_SYNC', payload: { ...syncPayload, worldMap: STATE.worldMap } };
            Object.values(window.clientConns).forEach(c => {
                if(c.open) c.send(msgObjFull);
            });
        }
        requestUIRender(); 
    }
}

function hostEmitAlert(senderId, msg, icon) {
    if(STATE.roomConfig.isHost) {
        if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
            const packet = { type: 'EVENT_ALERT', senderId, payload: { msg, icon } };
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify(packet));
        }
        if (STATE.trackedIds.has(senderId)) addToast(msg, icon);
    }
}

function handleTradeHost(tokenId, isBuy, amount, playerId, silent = false) {
    const player = STATE.players[playerId];
    const token = STATE.tokens[tokenId];
    if (!player || !token || amount <= 0) return;

    if (!player.tradesInfo) player.tradesInfo = {};
    let logMsg = '';
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    
    let currentCandle = token.currentCandle;
    if (!currentCandle || Date.now() - currentCandle.time > 5000) { 
        if (currentCandle) token.history.push(currentCandle);
        currentCandle = { time: Date.now(), open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, vol: 0 };
    }

    if (isBuy) {
        if (player.solBalance < amount) return;
        const tokensOut = calcTokensOut(amount, token.solPool, token.tokenPool);
        token.solPool += amount; token.tokenPool -= tokensOut;
        player.solBalance -= amount; player.portfolio[tokenId] = (player.portfolio[tokenId] || 0) + tokensOut;
        player.tradesInfo[tokenId] = { entryPrice: getPrice(token.solPool, token.tokenPool) };
    } else {
        const currentBal = player.portfolio[tokenId] || 0;
        
        // Anti-dust (100% Sell logic): Si el usuario intenta vender más del 99.9% de su balance, vaciar la cartera por completo.
        let sellAmount = amount;
        if (amount >= currentBal * 0.999) sellAmount = currentBal;

        if (currentBal < sellAmount) return;

        if (sellAmount > (token.tokenPool * 0.5) && !player.isBot) player.reputation = Math.max(1, (player.reputation || 1) - 30);

        const solOut = calcSolOut(sellAmount, token.solPool, token.tokenPool);
        token.solPool -= solOut; token.tokenPool += sellAmount;
        player.solBalance += solOut; player.portfolio[tokenId] -= sellAmount;
        if(player.portfolio[tokenId] <= 0) delete player.tradesInfo[tokenId];
    }

    const newPrice = getPrice(token.solPool, token.tokenPool);
    currentCandle.close = newPrice; currentCandle.high = Math.max(currentCandle.high, newPrice);
    currentCandle.low = Math.min(currentCandle.low, newPrice); currentCandle.vol += amount;
    token.currentCandle = currentCandle;

    let milestoneMsg = null;
    const mcapUsd = newPrice * token.initialSupply; 
    const realLiq = token.solPool - VIRTUAL_USD_RESERVE;
    if (!token.milestones) token.milestones = {};
    const creator = STATE.players[token.creatorId];

    if (realLiq >= BONDING_CURVE_LIMIT && !token.milestones.mRaydium) {
        token.milestones.mRaydium = true; milestoneMsg = `👑 $${token.ticker} COMPLETÓ LA CURVA Y SE FUE A RAYDIUM!`;
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 20);
    } else if (mcapUsd >= 1000000 && !token.milestones.m1m) { 
        token.milestones.m1m = true; milestoneMsg = `🚀 $${token.ticker} ALCANZÓ $1M MCap!`; 
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 10); 
    }

    if (!silent && milestoneMsg) {
        STATE.chat.unshift({ id: Date.now() + Math.random(), sender: 'System', text: milestoneMsg, sys: true });
        STATE.chat = STATE.chat.slice(0, 80);
    }
}

function handleLaunchHost(name, ticker, image, devBuy, playerId) {
    const player = STATE.players[playerId];
    const fee = 1; 
    if (!player || player.solBalance < (fee + devBuy)) return;

    player.solBalance -= fee;
    const tokenId = ticker.toUpperCase() + '_' + Date.now();
    const initialPrice = VIRTUAL_USD_RESERVE / 1000000000; 
    
    STATE.tokens[tokenId] = {
        id: tokenId, name, ticker: ticker.toUpperCase(), image: image, creatorId: playerId, creatorName: player.name,
        solPool: VIRTUAL_USD_RESERVE, tokenPool: 1000000000, initialSupply: 1000000000, createdAt: Date.now(),
        milestones: {}, history: [],
        currentCandle: { time: Date.now(), open: initialPrice, high: initialPrice, low: initialPrice, close: initialPrice, vol: 0 }
    };
    
    player.reputation = Math.min(100, (player.reputation || 1) + 0.5);
    const logMsg = `🚀 ${player.name} lanzó $${STATE.tokens[tokenId].ticker}`;
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: logMsg, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    hostEmitAlert(playerId, logMsg, '🚀');
    if (devBuy > 0) handleTradeHost(tokenId, true, devBuy, playerId, false);
    broadcastState();
}

function handleBurnHost(tokenId, amount, playerId) {
    const player = STATE.players[playerId]; const token = STATE.tokens[tokenId];
    if (!player || !token || !player.portfolio[tokenId] || player.portfolio[tokenId] < amount) return;
    player.portfolio[tokenId] -= amount; token.initialSupply -= amount; 
    player.reputation = Math.min(100, (player.reputation || 1) + 1);
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🔥 ${player.name} quemó ${formatToken(amount)} $${token.ticker}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80); broadcastState();
}

function handleGiftHost(targetId, asset, amount, senderId) {
    const sender = STATE.players[senderId]; const target = STATE.players[targetId];
    if (!sender || !target || amount <= 0) return;
    if (asset === 'USD') {
        if (sender.solBalance < amount) return;
        sender.solBalance -= amount; target.solBalance += amount;
    } else {
        if (!sender.portfolio[asset] || sender.portfolio[asset] < amount) return;
        sender.portfolio[asset] -= amount; target.portfolio[asset] = (target.portfolio[asset] || 0) + amount;
    }
    sender.reputation = Math.min(100, (sender.reputation || 1) + 0.5);
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🎁 ${sender.name} le regaló a ${target.name} ${formatToken(amount)} ${asset==='USD'?'USD':'Tokens'}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80); broadcastState();
}

function handleBuyLuxuryHost(itemId, playerId) {
    const player = STATE.players[playerId]; let item = null;
    for(const cat in SHOP_CATEGORIES) { const found = SHOP_CATEGORIES[cat].find(i => i.id === itemId); if(found) item = found; }
    if (!player || !item || player.solBalance < item.price) return;
    player.solBalance -= item.price; player.luxuries = [...(player.luxuries || []), item.icon];
    player.reputation = Math.min(100, (player.reputation || 1) + item.rep);
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🛒 ${player.name} presumió su nuevo ${item.name} ${item.icon}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80); broadcastState();
}

function handleChatHost(msg, playerId, isSys = false) {
    const senderName = STATE.players[playerId]?.name || 'System';
    STATE.chat.unshift({ id: Date.now(), sender: senderName, text: msg, sys: isSys });
    STATE.chat = STATE.chat.slice(0, 80); broadcastState();
}

function startBotBrain() {
    if(botInterval) clearInterval(botInterval);
    botInterval = setInterval(() => {
        if (!STATE.roomConfig.isHost || !STATE.roomConfig.botsEnabled || STATE.gameState !== 'playing') return;
        
        const botList = Object.values(STATE.players).filter(p => p.isBot && p.id !== 'SYSTEM_MM');
        if (botList.length === 0) return;

        const tokenKeys = Object.keys(STATE.tokens);
        const activeCount = Math.min(150, Math.max(5, Math.floor(botList.length * 0.05)));
        const activeBots = botList.sort(() => 0.5 - Math.random()).slice(0, activeCount);
        let didTrade = false;

        activeBots.forEach(bot => {
            // MOVIMIENTO EN EL MUNDO 2D (Solo si el mapa está activo)
            if (STATE.roomConfig.hasMap && bot.x !== undefined && bot.y !== undefined) {
                if(Math.random() < 0.4) {
                    let nextX = bot.x + (Math.random() * 80 - 40);
                    let nextY = bot.y + (Math.random() * 80 - 40);
                    const mapW = STATE.worldMap ? STATE.worldMap.width : 10000;
                    const mapH = STATE.worldMap ? STATE.worldMap.height : 10000;
                    bot.x = Math.max(20, Math.min(mapW - 20, nextX));
                    bot.y = Math.max(20, Math.min(mapH - 20, nextY));
                }
            }

            Object.keys(bot.portfolio).forEach(tokenId => {
                const amount = bot.portfolio[tokenId]; if (amount <= 0) return;
                const token = STATE.tokens[tokenId]; if (!token) return;

                const currentPrice = getPrice(token.solPool, token.tokenPool);
                const entryPrice = bot.tradesInfo?.[tokenId]?.entryPrice || currentPrice;
                const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
                let sellRatio = 0;
                
                if (bot.strategy === 'RugPuller') { if (pnlPercent > 100) sellRatio = 1.0; }
                else if (pnlPercent <= -20 && bot.strategy !== 'Hodler') sellRatio = 1.0;
                else if (pnlPercent >= 50) sellRatio = bot.strategy === 'Scalper' ? 1.0 : 0.5;
                else {
                    if (bot.strategy === 'Scalper' && Math.random() < 0.1) sellRatio = 0.5;
                    if (bot.strategy === 'Degen' && Math.random() < 0.15) sellRatio = 1.0;
                    if (bot.strategy === 'Whale' && Math.random() < 0.05) sellRatio = 0.8;
                    if (bot.strategy === 'PaperHands' && pnlPercent <= -5) sellRatio = 1.0; 
                }

                if (sellRatio > 0) { handleTradeHost(tokenId, false, amount * sellRatio, bot.id, true); didTrade = true; }
            });

            if (bot.solBalance > 0.5 && tokenKeys.length > 0 && Math.random() < 0.3) {
                const attractiveTokens = tokenKeys.map(tid => STATE.tokens[tid]).filter(t => {
                    const ageMs = Date.now() - t.createdAt; const creatorRep = STATE.players[t.creatorId]?.reputation || 1;
                    if (bot.strategy === 'Sniper') return ageMs < 120000;
                    if (bot.strategy === 'Degen' || bot.strategy === 'PaperHands') return true; 
                    if (creatorRep < 10 && bot.strategy !== 'RugPuller') return false; 
                    if (Math.random() > 0.4) return false; 
                    if (bot.strategy === 'Scalper') return (t.solPool - VIRTUAL_USD_RESERVE) > 2; 
                    if (bot.strategy === 'Hodler') return ageMs > 60000 && (t.solPool - VIRTUAL_USD_RESERVE) > 5;
                    if (bot.strategy === 'Whale') return (t.solPool - VIRTUAL_USD_RESERVE) > 10; 
                    return true;
                });

                if (attractiveTokens.length > 0) {
                    const targetToken = attractiveTokens[Math.floor(Math.random() * attractiveTokens.length)];
                    let investRatio = 0.1;
                    if (bot.strategy === 'Degen' || bot.strategy === 'Sniper' || bot.strategy === 'RugPuller') investRatio = 0.5; 
                    if (bot.strategy === 'Whale') investRatio = 0.2; 
                    const investAmount = bot.solBalance * investRatio * (0.8 + Math.random() * 0.4); 
                    if (investAmount > 0.1) { handleTradeHost(targetToken.id, true, investAmount, bot.id, true); didTrade = true; }
                }
            }

            const canLaunch = bot.solBalance > 5 && tokenKeys.length < 50;
            const wantsToLaunch = (bot.strategy === 'Degen' && Math.random() < 0.02) || (bot.strategy === 'RugPuller' && Math.random() < 0.05) || Math.random() < 0.005;
            if (canLaunch && wantsToLaunch) {
                const names = ["PepeBot", "Inu AI", "Safe", "Moon", "Cat", "Doge", "Gold", "Sigma", "Turbo"];
                const tName = names[Math.floor(Math.random()*names.length)] + " " + Math.floor(Math.random()*99);
                handleLaunchHost(tName, tName.substring(0,4).toUpperCase().replace(/\s/g, ''), '', bot.solBalance * 0.1, bot.id);
                didTrade = true;
            }
        });
        
        if(didTrade) broadcastState();
    }, 1500); 
}

function startWorldEngine() {
    if(!STATE.roomConfig.hasMap) return;
    if (worldAnimFrame) cancelAnimationFrame(worldAnimFrame);
    if (worldMoveInterval) clearInterval(worldMoveInterval);
    
    worldMoveInterval = setInterval(() => {
        if (STATE.activeTab !== 'world' || STATE.gameState !== 'playing') return;
        const me = STATE.players[STATE.myProfile.id];
        if(!me) return;
        
        let moved = false;
        
        // INTERACCIÓN (Tecla E)
        if (INPUT_KEYS.e && !keyEToggled) {
            keyEToggled = true;
            if (me.mountedId) {
                const car = (STATE.worldMap?.objects || []).find(o => o.id === me.mountedId);
                if (car) {
                    me.x = car.x - 30; 
                    me.y = car.y + car.h / 2;
                }
                me.mountedId = null;
                moved = true;
            } else {
                let closestCar = null;
                let closestScriptObj = null;
                let minDistCar = 150; 
                let minDistScript = 150; 
                
                (STATE.worldMap?.objects || []).forEach(obj => {
                    let cx = obj.x + obj.w/2;
                    let cy = obj.y + obj.h/2;
                    let dist = Math.hypot(me.x - cx, me.y - cy);
                    
                    if (obj.type === 'car' && dist < minDistCar) { minDistCar = dist; closestCar = obj; }
                    else if (obj.type !== 'trigger' && obj.type !== 'car' && obj.script && obj.script.trim() !== '' && dist < minDistScript) { 
                        minDistScript = dist; closestScriptObj = obj; 
                    }
                });
                
                if (closestCar) {
                    me.mountedId = closestCar.id;
                    moved = true;
                } else if (closestScriptObj) {
                    executeScript(closestScriptObj.script, closestScriptObj);
                }
            }
        } else if (!INPUT_KEYS.e) {
            keyEToggled = false;
        }

        // LÓGICA DE MOVIMIENTO
        if (me.mountedId) {
            const car = (STATE.worldMap?.objects || []).find(o => o.id === me.mountedId);
            if (car) {
                let nextX = car.x; let nextY = car.y;
                let spd = car.speed && car.speed > 0 ? car.speed : 25; 

                if(INPUT_KEYS.arrowup || INPUT_KEYS.w) { nextY -= spd; moved = true; }
                if(INPUT_KEYS.arrowdown || INPUT_KEYS.s) { nextY += spd; moved = true; }
                if(INPUT_KEYS.arrowleft || INPUT_KEYS.a) { nextX -= spd; moved = true; }
                if(INPUT_KEYS.arrowright || INPUT_KEYS.d) { nextX += spd; moved = true; }

                const mapW = STATE.worldMap ? STATE.worldMap.width : 10000;
                const mapH = STATE.worldMap ? STATE.worldMap.height : 10000;
                nextX = Math.max(0, Math.min(mapW - car.w, nextX));
                nextY = Math.max(0, Math.min(mapH - car.h, nextY));

                let canMoveX = true, canMoveY = true;
                (STATE.worldMap?.objects || []).forEach(obj => {
                    if ((obj.type === 'wall' || obj.type === 'door') && obj.id !== car.id) {
                        if (nextX + car.w > obj.x && nextX < obj.x + obj.w && car.y + car.h > obj.y && car.y < obj.y + obj.h) canMoveX = false;
                        if (car.x + car.w > obj.x && car.x < obj.x + obj.w && nextY + car.h > obj.y && nextY < obj.y + obj.h) canMoveY = false;
                    }
                });

                if(canMoveX) car.x = nextX;
                if(canMoveY) car.y = nextY;

                me.x = car.x + car.w/2;
                me.y = car.y + car.h/2;
            } else {
                me.mountedId = null; 
            }
        } else {
            let nextX = me.x; let nextY = me.y;
            let spd = me.speed || 2;

            if(INPUT_KEYS.arrowup || INPUT_KEYS.w) { nextY -= spd; moved = true; }
            if(INPUT_KEYS.arrowdown || INPUT_KEYS.s) { nextY += spd; moved = true; }
            if(INPUT_KEYS.arrowleft || INPUT_KEYS.a) { nextX -= spd; moved = true; }
            if(INPUT_KEYS.arrowright || INPUT_KEYS.d) { nextX += spd; moved = true; }

            const mapW = STATE.worldMap ? STATE.worldMap.width : 10000;
            const mapH = STATE.worldMap ? STATE.worldMap.height : 10000;
            nextX = Math.max(15, Math.min(mapW - 15, nextX));
            nextY = Math.max(15, Math.min(mapH - 15, nextY));

            let canMoveX = true, canMoveY = true;
            (STATE.worldMap?.objects || []).forEach(obj => {
                if (obj.type === 'wall' || obj.type === 'car' || obj.type === 'door') { 
                    if (nextX + 15 > obj.x && nextX - 15 < obj.x + obj.w && me.y + 15 > obj.y && me.y - 15 < obj.y + obj.h) canMoveX = false;
                    if (me.x + 15 > obj.x && me.x - 15 < obj.x + obj.w && nextY + 15 > obj.y && nextY - 15 < obj.y + obj.h) canMoveY = false;
                }
                
                if (obj.type === 'trigger') {
                    if (me.x > obj.x && me.x < obj.x + obj.w && me.y > obj.y && me.y < obj.y + obj.h) {
                        if (window.inTriggerZone !== obj.id) {
                            window.inTriggerZone = obj.id;
                            executeScript(obj.script, obj);
                        }
                    } else if (window.inTriggerZone === obj.id) {
                        window.inTriggerZone = null;
                    }
                }
            });

            if(canMoveX) me.x = nextX;
            if(canMoveY) me.y = nextY;
        }

        // Tasa de refresco optimizada a 20 FPS para reducir lag 
        if(moved && Date.now() - lastMoveBroadcast > 50) { 
            let carParams = {};
            if(me.mountedId) {
                const car = (STATE.worldMap?.objects || []).find(o => o.id === me.mountedId);
                if(car) { carParams = { carX: car.x, carY: car.y }; }
            }
            dispatchAction('ACTION_MOVE', {x: me.x, y: me.y, mountedId: me.mountedId, ...carParams});
            lastMoveBroadcast = Date.now();
        }
    }, 1000/60);

    renderWorldLoop();
}

function executeScript(scriptContent, targetObj) {
    if (!scriptContent || scriptContent.trim() === '') return;
    try {
        const scriptFunc = new Function('obj', 'me', 'addToast', 'mapData', 'STATE', 'dispatchAction', scriptContent);
        const me = STATE.players[STATE.myProfile.id];
        
        scriptFunc(targetObj, me, window.addToast, STATE.worldMap, window.STATE, window.dispatchAction);
        
        if (targetObj && targetObj.id) {
            dispatchAction('ACTION_MAP_UPDATE', { id: targetObj.id, x: targetObj.x, y: targetObj.y, color: targetObj.color });
        }
        
        if (!STATE.roomConfig.isHost) {
            dispatchAction('ACTION_PLAYER_SYNC', { solBalance: me.solBalance, reputation: me.reputation, speed: me.speed });
        }
    } catch(e) {
        console.error("Script Error:", e);
        addToast("Error Script: " + e.message, "❌");
    }
}

function getTexture(url) {
    if (!url) return null;
    if (textureCache[url]) return textureCache[url];
    const img = new Image(); img.src = url; textureCache[url] = img;
    img.onload = () => {}; return img;
}

function renderWorldLoop() {
    if(!STATE.roomConfig.hasMap) return;
    worldAnimFrame = requestAnimationFrame(renderWorldLoop);
    if (STATE.activeTab !== 'world') return;
    
    const canvas = document.getElementById('world-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const me = STATE.players[STATE.myProfile.id];
    if(!me) return;
    
    const cam = { zoom: 1 };
    const cx = canvas.width / 2 - (me.x || 5000);
    const cy = canvas.height / 2 - (me.y || 5000);
    const mapW = STATE.worldMap ? STATE.worldMap.width : 10000;
    const mapH = STATE.worldMap ? STATE.worldMap.height : 10000;

    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(cx, cy);

    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, mapW, mapH);
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 5; ctx.strokeRect(0, 0, mapW, mapH);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    for(let i=0; i<mapW; i+=100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, mapH); ctx.stroke(); }
    for(let i=0; i<mapH; i+=100) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(mapW, i); ctx.stroke(); }

    let interactableCar = null;
    let interactableScriptObj = null;

    if (STATE.worldMap && STATE.worldMap.objects) {
        STATE.worldMap.objects.forEach(obj => {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            
            if(obj.x + cx < -obj.w || obj.x + cx > canvas.width || obj.y + cy < -obj.h || obj.y + cy > canvas.height) {
                ctx.restore(); return;
            }

            ctx.save(); 
            if (obj.type === 'circle') {
                ctx.beginPath(); ctx.arc(obj.w/2, obj.h/2, obj.w/2, 0, Math.PI*2); ctx.clip();
            } else if (obj.type === 'triangle') {
                ctx.beginPath(); ctx.moveTo(obj.w/2, 0); ctx.lineTo(obj.w, obj.h); ctx.lineTo(0, obj.h); ctx.closePath(); ctx.clip();
            }

            const img = getTexture(obj.texture);
            if (img && img.complete && obj.type !== 'light' && obj.type !== 'car' && obj.type !== 'spawn') {
                const repeats = obj.textureRepeat || 1;
                if (repeats > 1) {
                    const pattern = ctx.createPattern(img, 'repeat');
                    if (pattern) {
                        const scaleX = (obj.w / repeats) / img.width;
                        const scaleY = (obj.h / repeats) / img.height;
                        pattern.setTransform(new DOMMatrix().scale(scaleX, scaleY));
                        ctx.fillStyle = pattern;
                        ctx.fillRect(0, 0, obj.w, obj.h);
                    }
                } else {
                    ctx.drawImage(img, 0, 0, obj.w, obj.h);
                }
            } else {
                ctx.fillStyle = obj.color;
                if (obj.type === 'light') {
                    let r = obj.w/2;
                    let grad = ctx.createRadialGradient(r, r, 0, r, r, r);
                    let baseColor = obj.color;
                    if(baseColor.startsWith('#')) {
                        const hex = baseColor.replace('#','');
                        const rC = parseInt(hex.substring(0,2), 16); const gC = parseInt(hex.substring(2,4), 16); const bC = parseInt(hex.substring(4,6), 16);
                        baseColor = `rgba(${rC},${gC},${bC},0.8)`;
                    }
                    grad.addColorStop(0, baseColor); grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI*2); ctx.fill();
                } else if (obj.type === 'car') {
                    const res = obj.resolution || 8;
                    if (obj.pixelData && obj.pixelData.length === res * res) {
                        let pW = obj.w / res; let pH = obj.h / res;
                        for(let i=0; i<res*res; i++) {
                            if(obj.pixelData[i]) {
                                ctx.fillStyle = obj.pixelData[i];
                                ctx.fillRect((i%res)*pW, Math.floor(i/res)*pH, pW+0.5, pH+0.5); 
                            }
                        }
                    } else {
                        ctx.fillRect(0, 0, obj.w, obj.h);
                        ctx.fillStyle = '#000'; ctx.fillRect(obj.w*0.1, obj.h*0.6, obj.w*0.8, obj.h*0.3);
                    }
                } else {
                    ctx.fillRect(0, 0, obj.w, obj.h); 
                }
            }
            ctx.restore();

            if (obj.type === 'wall' || obj.type === 'door' || obj.type === 'car') {
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, obj.w, obj.h);
            }

            if (!me.mountedId) {
                let center_x = obj.x + obj.w/2; let center_y = obj.y + obj.h/2;
                if (Math.hypot(me.x - center_x, me.y - center_y) < 150) {
                    if (obj.type === 'car') interactableCar = obj;
                    else if (obj.type !== 'trigger' && obj.type !== 'car' && obj.script && obj.script.trim() !== '') interactableScriptObj = obj;
                }
            }

            ctx.restore();
        });
    }

    Object.values(STATE.players).forEach(p => {
        if(p.isBot || p.id === 'SYSTEM_MM') return; 
        
        if (p.mountedId) {
            const car = (STATE.worldMap?.objects || []).find(o => o.id === p.mountedId);
            if (car) {
                ctx.font = `${car.w/3}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.avatar, car.x + car.w/2, car.y + car.h/2);
            }
            return; 
        }

        const px = (p.x || 1500);
        const py = (p.y || 1500);
        
        if(px + cx < -100 || px + cx > canvas.width + 100 || py + cy < -100 || py + cy > canvas.height + 100) return;

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(px, py + 10, 15, 5, 0, 0, Math.PI*2); ctx.fill();

        ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.avatar, px, py);

        if (p.luxuries && p.luxuries.length > 0) {
            ctx.font = '24px Arial';
            p.luxuries.slice(0, 3).forEach((lux, idx) => {
                ctx.fillText(lux, px + 35 + (idx * 20), py);
            });
        }

        const r = getRank(p.solBalance + (p.solStaked||0));
        ctx.font = '12px "JetBrains Mono"';
        ctx.fillStyle = p.id === STATE.myProfile.id ? '#10b981' : '#e2e8f0';
        ctx.fillText(`${r.emoji} ${p.name}`, px, py + 25);
    });

    ctx.restore();

    if (!me.mountedId) {
        if (interactableCar) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(canvas.width/2 - 40, canvas.height/2 - 45, 80, 20);
            ctx.fillStyle = '#10b981'; ctx.font = '12px "JetBrains Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText("[E] Subir", canvas.width/2, canvas.height/2 - 35);
        } else if (interactableScriptObj) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(canvas.width/2 - 50, canvas.height/2 - 45, 100, 20);
            ctx.fillStyle = '#a855f7'; ctx.font = '12px "JetBrains Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText("[E] Interactuar", canvas.width/2, canvas.height/2 - 35);
        }
    }
}

// CLIENT ACTIONS DISPATCHER
function dispatchAction(type, payload) {
    if (STATE.roomConfig.isHost) {
        if(type==='ACTION_MOVE' && STATE.players[STATE.myProfile.id]) { 
            STATE.players[STATE.myProfile.id].x = payload.x; 
            STATE.players[STATE.myProfile.id].y = payload.y; 
            STATE.players[STATE.myProfile.id].mountedId = payload.mountedId;
            if (payload.mountedId && STATE.worldMap && STATE.worldMap.objects) {
                const car = STATE.worldMap.objects.find(o => o.id === payload.mountedId);
                if (car && payload.carX !== undefined && payload.carY !== undefined) {
                    car.x = payload.carX; car.y = payload.carY;
                }
            }
            // Emite su propio movimiento sin enviar todo el STATE_SYNC
            if (!STATE.roomConfig.isOffline && mqttClient && mqttClient.connected) {
                mqttClient.publish(`dgn/${STATE.roomConfig.code}/out`, JSON.stringify({ type: 'SYNC_MOVE', senderId: STATE.myProfile.id, payload }));
            }
        }
        if(type==='ACTION_MAP_UPDATE') {
            if (STATE.worldMap && STATE.worldMap.objects) {
                const obj = STATE.worldMap.objects.find(o => o.id === payload.id);
                if (obj) { 
                    if(payload.x!==undefined) obj.x=payload.x; 
                    if(payload.y!==undefined) obj.y=payload.y; 
                    if(payload.color!==undefined) obj.color=payload.color; 
                    broadcastState();
                }
            }
        }
        if (type === 'ACTION_PLAYER_SYNC') {
            const senderId = STATE.myProfile.id;
            if (STATE.players[senderId]) {
                if (payload.solBalance !== undefined) STATE.players[senderId].solBalance = payload.solBalance;
                if (payload.reputation !== undefined) STATE.players[senderId].reputation = payload.reputation;
                if (payload.speed !== undefined) STATE.players[senderId].speed = payload.speed;
                broadcastState();
            }
        }
        if(type==='ACTION_TRADE') handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, STATE.myProfile.id);
        if(type==='ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_CHAT') handleChatHost(payload.msg, STATE.myProfile.id, false);
        if(type==='ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, STATE.myProfile.id);
        if(type==='ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot && k!=='SYSTEM_MM').length + 1); }
        if(type==='ACTION_CHARITY') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 5);
                handleChatHost(`💖 ${p.name} quemó ${formatSOL(payload.amount)} por beneficencia!`, STATE.myProfile.id, true); broadcastState();
            }
        }
        if(type==='ACTION_AIRDROP') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount; p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 8);
                const humans = Object.values(STATE.players).filter(pl => !pl.isBot && pl.id !== STATE.myProfile.id);
                if (humans.length > 0) {
                    const split = payload.amount / humans.length; humans.forEach(h => { h.solBalance += split; });
                    handleChatHost(`🚁 AIRDROP MASIVO: ${p.name} repartió ${formatSOL(payload.amount)} a ${humans.length} degens!`, STATE.myProfile.id, true);
                } else { handleChatHost(`🚁 ${p.name} intentó un Airdrop, pero no hay humanos. Se quemaron.`, STATE.myProfile.id, true); }
                broadcastState();
            }
        }
        if(type==='ACTION_CASINO') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) {
                p.solBalance -= payload.amount;
                if(Math.random() > 0.5) { p.solBalance += (payload.amount * 2); handleChatHost(`🎰 ¡${p.name} ganó ${formatSOL(payload.amount)} en el Casino! x2`, STATE.myProfile.id, true); } 
                else { handleChatHost(`🎰 ${p.name} fue liquidado y perdió ${formatSOL(payload.amount)} en el Casino. F`, STATE.myProfile.id, true); }
                broadcastState();
            }
        }
        if(type==='ACTION_STAKE') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solBalance >= payload.amount && payload.amount > 0) { p.solBalance -= payload.amount; p.solStaked = (p.solStaked || 0) + payload.amount; broadcastState(); }
        }
        if(type==='ACTION_UNSTAKE') {
            const p = STATE.players[STATE.myProfile.id];
            if(p && p.solStaked >= payload.amount && payload.amount > 0) { p.solStaked -= payload.amount; p.solBalance += payload.amount; broadcastState(); }
        }
        if(type==='ACTION_VOICE') {
            if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = payload.isSpeaking;
            broadcastState();
        }
    } else {
        const packet = { type, payload, senderId: STATE.myProfile.id };
        if (window.dataConn && window.dataConn.open) {
            window.dataConn.send(packet); // Vía rápida P2P (~10ms)
        } else if(mqttClient && mqttClient.connected) {
            mqttClient.publish(`dgn/${STATE.roomConfig.code}/in`, JSON.stringify(packet)); // Fallback MQTT (~300ms)
        }
    }
}

// RENDERING UI ENGINE
function switchTab(tabId) { STATE.activeTab = tabId; STATE.selectedTokenId = null; STATE._renderedTabId = null; updateUI(); }
function selectToken(id) { STATE.selectedTokenId = id; STATE.tradeAmount = ''; STATE._renderedTabId = null; updateUI(); }
function setTradeType(type) { STATE.tradeType = type; STATE.tradeAmount = ''; STATE._renderedTabId = null; updateUI(); }

function addToast(msg, icon) {
    const id = Date.now() + Math.random(); STATE.toasts.push({ id, msg, icon }); updateToasts();
    setTimeout(() => { STATE.toasts = STATE.toasts.filter(t => t.id !== id); updateToasts(); }, 4000);
}

function updateToasts() {
    const c = document.getElementById('toasts-container');
    if (c) c.innerHTML = STATE.toasts.map(t => `<div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto"><span>${t.icon}</span> ${t.msg}</div>`).join('');
}

function requestUIRender(forceFull = false) {
    if (forceFull || STATE.route !== 'game') {
        const app = document.getElementById('app');
        if (STATE.route === 'lobby') app.innerHTML = ViewLobby();
        else if (STATE.route === 'game') { app.innerHTML = ViewGame(); STATE._renderedTabId = null; updateDynamicDOM(); }
        return;
    }
    if(uiRenderScheduled) return; uiRenderScheduled = true;
    requestAnimationFrame(() => { updateDynamicDOM(); uiRenderScheduled = false; });
}

function updateUI() { requestUIRender(true); }

function updateDynamicDOM() {
    const me = STATE.players[STATE.myProfile.id] || { solBalance: 0 };
    const balEl = document.getElementById('my-balance'); if(balEl) balEl.innerText = formatUSD(me.solBalance);
    
    const tickerEl = document.getElementById('trending-marquee');
    if (tickerEl) {
        const trends = Object.values(STATE.tokens).sort((a,b) => b.solPool - a.solPool).slice(0, 8);
        if(trends.length > 0) tickerEl.innerHTML = trends.map(t => `<span class="mx-4">🔥 <span class="font-black text-white">$${t.ticker}</span> (${formatUSD(t.solPool - VIRTUAL_USD_RESERVE)})</span>`).join(' • ');
        else tickerEl.innerHTML = "EL MERCADO ESTÁ VACÍO. SÉ EL PRIMERO EN CREAR UN TOKEN.";
    }
    
    // Chat Engine
    const renderChatMessages = (containerId, limit, hideSys) => {
        const cEl = document.getElementById(containerId);
        if (cEl) {
            let messages = STATE.chat;
            if(hideSys) messages = messages.filter(m => !m.sys);
            else messages = messages.filter(m => STATE.chatTab === 'global' ? !m.sys : m.sys);
            
            cEl.innerHTML = messages.slice(0, limit).map(msg => {
                const isImg = msg.text.match(/^https?:\/\/.*\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i) || msg.text.startsWith('data:image');
                let senderTag = msg.sender;
                if(!msg.sys && msg.sender !== 'System') {
                    const sp = Object.values(STATE.players).find(p => p.name === msg.sender);
                    if(sp) { const rank = getRank(sp.solBalance + (sp.solStaked||0)); senderTag = `<span class="opacity-70">${rank.emoji}</span> ${msg.sender}`; }
                }
                
                if (containerId === 'world-chat-messages') {
                    return `<div class="text-white drop-shadow-md"><span class="font-bold text-emerald-400">${senderTag}:</span> <span class="break-words">${msg.text}</span></div>`;
                } else {
                    return `
                    <div class="p-3 rounded-xl ${msg.sys ? 'text-slate-400 font-mono text-[10px] md:text-xs border border-slate-800/50 bg-slate-950/80 shadow-inner' : 'bg-slate-800/80 text-slate-200 border border-slate-700/50'}">
                        ${!msg.sys ? `<div class="font-bold text-emerald-400 text-xs mb-1 flex items-center">${senderTag}</div>` : ''}
                        ${isImg ? `<img src="${msg.text}" class="max-w-full rounded-lg mt-2 cursor-pointer border border-slate-700 hover:border-emerald-500 transition-colors" onclick="window.open('${msg.text}', '_blank')"/>` : `<div class="leading-relaxed break-words">${msg.text}</div>`}
                    </div>`;
                }
            }).join('') || `<div class="text-center text-slate-500 py-10 italic">Aún no hay mensajes.</div>`;
        }
    };

    renderChatMessages('chat-list', 80, false);
    if(STATE.activeTab === 'world') renderChatMessages('world-chat-messages', 20, true);

    const el = document.getElementById('tab-content'); if (!el) return;
    let currentTabId = STATE.selectedTokenId ? 'detail-' + STATE.selectedTokenId + '-' + STATE.tradeType : STATE.activeTab;
    
    if (STATE._renderedTabId !== currentTabId) {
        if (STATE.selectedTokenId) el.innerHTML = RenderTokenDetailSkeleton();
        else if (STATE.activeTab === 'market') el.innerHTML = RenderMarketSkeleton();
        else if (STATE.activeTab === 'portfolio') el.innerHTML = RenderLeaderboardSkeleton();
        else if (STATE.activeTab === 'shop') el.innerHTML = RenderShop();
        else if (STATE.activeTab === 'launch') el.innerHTML = RenderLaunch();
        else if (STATE.activeTab === 'streams') el.innerHTML = RenderStreamsSkeleton();
        else if (STATE.activeTab === 'casino') el.innerHTML = RenderCasino();
        else if (STATE.activeTab === 'bank') el.innerHTML = RenderBank();
        else if (STATE.activeTab === 'charity') el.innerHTML = RenderCharity();
        else if (STATE.activeTab === 'world' && STATE.roomConfig.hasMap) el.innerHTML = RenderWorld();
        STATE._renderedTabId = currentTabId;
    }

    if (STATE.selectedTokenId) UpdateTokenDetailDynamic();
    else if (STATE.activeTab === 'market') UpdateMarketDynamic();
    else if (STATE.activeTab === 'portfolio') UpdateLeaderboardDynamic();
    else if (STATE.activeTab === 'streams') UpdateStreamsDynamic();
}

function UpdateMarketDynamic() {
    const grid = document.getElementById('market-grid');
    if(!grid) return;
    
    const filtered = Object.values(STATE.tokens)
        .sort((a,b) => b.solPool - a.solPool)
        .filter(t => t.name.toLowerCase().includes(STATE.searchQuery.toLowerCase()) || t.ticker.toLowerCase().includes(STATE.searchQuery.toLowerCase()))
        .filter(t => {
            if(STATE.marketFilter === 'human') return !STATE.players[t.creatorId]?.isBot;
            if(STATE.marketFilter === 'bot') return STATE.players[t.creatorId]?.isBot;
            return true;
        });

    if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-500 border border-slate-800 rounded-3xl border-dashed bg-slate-900/30"><div class="text-4xl md:text-5xl mb-4 opacity-30">${Icons.Chart}</div><div class="font-bold text-sm md:text-lg text-white">No hay tokens aquí.</div></div>`;
        return;
    }

    grid.innerHTML = filtered.map(token => {
        const progress = Math.min(100, ((token.solPool - VIRTUAL_USD_RESERVE) / BONDING_CURVE_LIMIT) * 100);
        const isComplete = progress >= 100;
        const imgHTML = token.image && token.image.startsWith('data:image') || (token.image && token.image.startsWith('http')) 
          ? `<img src="${token.image}" class="w-10 h-10 md:w-12 md:h-12 rounded-lg object-cover border border-slate-700 shrink-0" onerror="this.outerHTML='<div class=\\'w-10 h-10 md:w-12 md:h-12 bg-slate-800 rounded-lg flex items-center justify-center border border-slate-700\\'>🪙</div>'"/>` 
          : `<div class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 rounded-lg flex items-center justify-center border border-slate-700 text-xl md:text-2xl shrink-0">🪙</div>`;

        return `
        <div onclick="selectToken('${token.id}');" class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-4 md:p-5 cursor-pointer transition-all hover:-translate-y-1 relative overflow-hidden group shadow-lg flex flex-col justify-between min-h-[140px] md:min-h-[170px]">
            <div class="absolute bottom-0 left-0 h-1.5 bg-slate-950 w-full"><div class="h-full ${isComplete ? 'bg-purple-500' : 'bg-gradient-to-r from-emerald-600 to-emerald-400'} transition-all" style="width: ${progress}%"></div></div>
            
            <div class="flex justify-between items-start mb-3 md:mb-4 z-10 gap-2 md:gap-3">
                ${imgHTML}
                <div class="flex-1 min-w-0 pr-1 md:pr-2">
                    <h3 class="font-black text-white text-sm md:text-base truncate leading-tight mb-1">${token.name}</h3>
                    <span class="text-[9px] md:text-[10px] font-mono bg-slate-950 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800 font-bold truncate block w-fit max-w-full">$${token.ticker}</span>
                </div>
                <div class="text-right shrink-0">
                    <div class="text-[10px] md:text-sm font-mono font-bold ${isComplete ? 'text-purple-400 animate-pulse' : 'text-emerald-400'}">$${getPrice(token.solPool, token.tokenPool).toFixed(8)}</div>
                    <div class="text-[8px] md:text-[10px] text-slate-500 font-bold uppercase mt-1">Vol: ${formatUSD(token.solPool - VIRTUAL_USD_RESERVE)}</div>
                </div>
            </div>
            <div class="h-12 md:h-16 w-full opacity-70 mt-auto">${generateChartSVG(token, 300, 64, true)}</div>
        </div>`;
    }).join('');
}
