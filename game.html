function UpdateTokenDetailDynamic() {
    const token = STATE.tokens[STATE.selectedTokenId];
    if (!token) return;
    const me = STATE.players[STATE.myProfile.id];
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    const mcap = currentPrice * token.initialSupply; 
    const balTokens = me.portfolio[token.id] || 0;
    
    const numAmt = parseFloat(document.getElementById('t-amount')?.value || STATE.tradeAmount) || 0;
    let estimated = 0;
    if(STATE.tradeType === 'buy' && numAmt > 0) estimated = calcTokensOut(numAmt, token.solPool, token.tokenPool);
    if(STATE.tradeType === 'sell' && numAmt > 0) estimated = calcSolOut(numAmt, token.solPool, token.tokenPool);

    const progress = Math.min(100, ((token.solPool - VIRTUAL_USD_RESERVE) / BONDING_CURVE_LIMIT) * 100);
    const isComplete = progress >= 100;

    const dRep = document.getElementById('tok-dev-rep'); if(dRep) { dRep.innerText = STATE.players[token.creatorId]?.reputation || 1; dRep.className = (STATE.players[token.creatorId]?.reputation || 1) > 70 ? 'text-emerald-400' : 'text-slate-300'; }
    const prEl = document.getElementById('tok-price'); if(prEl) { prEl.innerHTML = '$' + currentPrice.toFixed(8); prEl.className = `text-base sm:text-xl md:text-3xl font-mono font-black ${isComplete ? 'text-purple-400' : 'text-emerald-400'}`; }
    const mcEl = document.getElementById('tok-mcap'); if(mcEl) mcEl.innerText = formatUSD(mcap);
    
    const pnlDiv = document.getElementById('tok-pnl-container');
    if(pnlDiv) {
        if(balTokens > 0 && me.tradesInfo && me.tradesInfo[token.id]) {
            const entryPrice = me.tradesInfo[token.id].entryPrice;
            const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;
            const pnlUsd = (currentPrice - entryPrice) * balTokens;
            pnlDiv.innerHTML = `<span class="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest">Tu PnL</span>
                                <span class="font-mono text-sm md:text-base font-black ml-0 sm:ml-2 ${pnlPercent >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                                    ${pnlPercent >= 0 ? '+' : ''}${formatUSD(pnlUsd)} (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(2)}%)
                                </span>`;
            pnlDiv.classList.remove('hidden');
        } else {
            pnlDiv.classList.add('hidden');
        }
    }

    const pLbl = document.getElementById('tok-prog-lbl'); if(pLbl) pLbl.className = isComplete ? 'text-purple-400 animate-pulse' : '';
    const pTxt = document.getElementById('tok-prog-text'); if(pTxt) pTxt.innerText = progress.toFixed(1) + '%';
    const pBar = document.getElementById('tok-prog-bar'); if(pBar) { pBar.style.width = progress + '%'; pBar.className = `h-full transition-all duration-500 ${isComplete ? 'bg-gradient-to-r from-purple-600 to-purple-400' : 'bg-gradient-to-r from-emerald-600 to-emerald-400'}`; }
    
    const chEl = document.getElementById('tok-chart'); if(chEl) chEl.innerHTML = generateChartSVG(token, 800, 400, false);
    
    const tBal = document.getElementById('tok-bal-base'); if(tBal) tBal.innerText = STATE.tradeType==='buy'?formatUSD(me.solBalance):formatToken(balTokens);
    const eRec = document.getElementById('tok-est-rec'); if(eRec) eRec.innerText = STATE.tradeType==='buy'?formatToken(estimated):formatUSD(estimated);
    const rLiq = document.getElementById('tok-real-liq'); if(rLiq) rLiq.innerText = formatUSD(token.solPool - VIRTUAL_USD_RESERVE);

    const pctBtns = document.getElementById('tok-pct-btns');
    if(pctBtns) {
        pctBtns.innerHTML = [1, 10, 50, 100].map(pct => `
            <button onclick="const am = STATE.tradeType === 'buy' ? (Math.max(0, ${me.solBalance} - 0.01) * ${pct/100}).toFixed(2) : (${balTokens} * ${pct/100}); STATE.tradeAmount = am; document.getElementById('t-amount').value = am; UpdateTokenDetailDynamic();" class="flex-1 bg-slate-950 border border-slate-800 hover:border-emerald-500/50 hover:bg-emerald-500/10 text-slate-400 hover:text-emerald-400 text-[9px] md:text-xs py-2 rounded-lg font-bold font-mono transition-all shadow-inner">
                ${pct}%
            </button>
        `).join('');
    }

    const tools = document.getElementById('tok-tools');
    if(tools) {
        tools.innerHTML = `
            <button onclick="const b = prompt('¿Quemar tokens? Se restarán de tu inventario y del Supply Total para subir el precio base.'); if(b && Number(b)>0){ dispatchAction('ACTION_BURN', { tokenId: '${token.id}', amount: Number(b) }); }" ${balTokens <= 0 ? 'disabled' : ''} class="flex-1 bg-orange-500/10 text-orange-500 border border-orange-500/30 hover:bg-orange-500/20 rounded-xl py-2 md:py-3 text-[9px] md:text-[10px] font-black flex justify-center items-center gap-1.5 transition-all disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-widest">
                ${Icons.Flame} Quemar
            </button>
            ${token.creatorId === me.id ? `
            <button onclick="if(window.confirm('RUG PULL: ¿Vender 100% de tu inventario de golpe? Perderás reputación drásticamente.')){ dispatchAction('ACTION_TRADE', { tokenId: '${token.id}', isBuy: false, amount: ${balTokens} }); }" class="flex-1 bg-red-950/40 text-red-500 border border-red-900/50 hover:bg-red-900/60 rounded-xl py-2 md:py-3 text-[9px] md:text-[10px] font-black flex justify-center items-center gap-1.5 transition-all uppercase tracking-widest">
                ${Icons.Alert} Rug Pull
            </button>` : ''}
        `;
    }

    const holders = Object.values(STATE.players).filter(p => p.portfolio[token.id] > 0)
        .map(p => ({ ...p, tokenAmount: p.portfolio[token.id], pct: (p.portfolio[token.id]/token.initialSupply)*100 }))
        .sort((a,b) => b.tokenAmount - a.tokenAmount).slice(0, 50);
        
    const hList = document.getElementById('tok-holders');
    if(hList) {
        if(holders.length === 0) hList.innerHTML = `<div class="text-center text-slate-500 py-6 text-[10px] font-bold">Nadie tiene este token.</div>`;
        else hList.innerHTML = holders.map((h, i) => `
            <div class="cursor-pointer flex justify-between items-center p-2 md:p-3 rounded-xl transition-colors ${h.id===me.id ? 'bg-emerald-900/20 border border-emerald-900/30' : 'hover:bg-slate-800/50 border border-transparent'}" onclick="STATE.viewingProfileId='${h.id}'; STATE.giftTargetId=null; renderModal();">
                <div class="flex items-center gap-2">
                    <span class="text-slate-600 text-[9px] font-mono font-black w-3 text-right">${i+1}.</span>
                    <div class="relative"><span class="text-xl md:text-2xl">${h.avatar}</span></div>
                    <div class="flex flex-col min-w-0">
                        <span class="text-[10px] md:text-xs font-bold text-slate-200 truncate max-w-[80px] md:max-w-[100px]">${h.name}</span>
                        ${h.isBot ? `<span class="text-[8px] text-purple-400 font-mono font-bold uppercase mt-0.5 tracking-wider truncate">${h.id==='SYSTEM_MM'?'MarketMaker':'BOT'}</span>` : ''}
                    </div>
                </div>
                <div class="text-right shrink-0">
                    <div class="text-[10px] font-mono font-bold text-emerald-400">${h.pct.toFixed(2)}%</div>
                </div>
            </div>`).join('');
    }
}

function renderModal() {
    const mc = document.getElementById('modal-container');
    if(!STATE.viewingProfileId) { mc.classList.add('hidden'); return; }
    
    const p = STATE.players[STATE.viewingProfileId];
    if(!p) { mc.classList.add('hidden'); return; }

    const isMe = p.id === STATE.myProfile.id;
    const isTracked = STATE.trackedIds.has(p.id);
    const r = getRank(p.solBalance + (p.solStaked||0));
    
    let estVal = p.solBalance + (p.solStaked||0);
    const tokensHTML = Object.entries(p.portfolio).map(([tid, amt]) => {
        if(amt <= 0) return '';
        const tk = STATE.tokens[tid];
        if(!tk) return '';
        const v = calcSolOut(amt, tk.solPool, tk.tokenPool);
        estVal += v;
        const entryP = p.tradesInfo?.[tid]?.entryPrice || getPrice(tk.solPool, tk.tokenPool);
        const curP = getPrice(tk.solPool, tk.tokenPool);
        const pnl = ((curP - entryP) / entryP) * 100;
        
        return `<div class="flex justify-between items-center text-xs md:text-sm bg-slate-950 p-2.5 md:p-3 rounded-xl border border-slate-800">
            <div class="font-bold text-white flex flex-col min-w-0 pr-2">
                <span class="truncate"><span class="text-slate-500 text-[10px] md:text-xs mr-1 font-mono">$</span>${tk.ticker}</span>
                <span class="text-[8px] md:text-[9px] ${pnl>=0?'text-emerald-400':'text-red-400'} font-mono uppercase font-black tracking-wider">${pnl>=0?'+':''}${pnl.toFixed(2)}% PnL</span>
            </div>
            <div class="text-right shrink-0"><div class="text-emerald-400 font-mono font-bold">${formatUSD(v)}</div><div class="text-[8px] md:text-[10px] text-slate-500">${formatToken(amt)} tokens</div></div>
        </div>`;
    }).join('');

    mc.innerHTML = `
    <div class="bg-slate-900 border border-slate-800 p-5 md:p-8 rounded-3xl max-w-sm w-full relative shadow-2xl animate-fade-in my-auto mx-4 max-h-[90dvh] overflow-y-auto">

        <div class="text-center mb-5 md:mb-6">
            <div class="text-5xl md:text-6xl mb-2 md:mb-3 relative inline-block">
                ${p.avatar}

            <h2 class="text-xl md:text-2xl font-black text-white flex items-center justify-center gap-2 truncate px-4">
                ${p.name} ${isMe ? '<span class="text-[10px] md:text-xs bg-emerald-500/10 text-emerald-400 px-1.5 md:px-2 py-0.5 rounded uppercase tracking-wider">Tú</span>' : ''}
            </h2>
            <div class="text-[10px] md:text-xs text-slate-500 font-mono font-bold uppercase tracking-widest mt-1.5 md:mt-2 flex flex-col gap-1 items-center">
                <span>${p.isBot ? (p.id === 'SYSTEM_MM' ? 'Market Maker de la Red' : `Bot IA: ${p.strategy}`) : 'Jugador Humano'}</span>
                <span class="${r.color} bg-slate-950 px-2 md:px-3 py-1 rounded-full border border-slate-800 shadow-inner text-[9px] md:text-xs">${r.emoji} Rango: ${r.name}</span>
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-2 md:gap-3 mb-5 md:mb-6">

                <div class="font-black text-base md:text-lg flex items-center justify-center gap-1 ${p.reputation > 70 ? 'text-emerald-400' : p.reputation < 30 ? 'text-red-400' : 'text-yellow-400'}"><span class="text-slate-600">${Icons.Shield}</span> ${p.reputation}</div>

                <div class="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Net Worth Total</div>
                <div class="font-black text-base md:text-lg text-emerald-400 font-mono">${formatUSD(estVal)}</div>
                ${p.solStaked > 0 ? `<div class="text-[8px] md:text-[9px] text-slate-500 font-mono uppercase tracking-wider mt-1">Staking: ${formatUSD(p.solStaked)}</div>` : ''}

            <button onclick="const a=parseFloat(STATE.giftAmount); if(a>0){ dispatchAction('ACTION_GIFT', {to:'${STATE.giftTargetId}', asset:'USD', amount:a}); STATE.giftTargetId=null; STATE.giftAmount=''; document.getElementById('modal-container').classList.add('hidden'); }" class="flex-1 bg-emerald-500 text-slate-950 font-black py-3 md:py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-emerald-400 transition-all uppercase tracking-wider text-xs md:text-sm order-1 sm:order-2">Enviar</button>
            <button onclick="STATE.viewingProfileId=null; STATE.giftTargetId=null; document.getElementById('modal-container').classList.add('hidden');" class="w-full sm:w-auto px-5 md:px-6 bg-slate-800 text-white font-bold py-3 md:py-3.5 rounded-xl hover:bg-slate-700 transition-colors uppercase tracking-wider text-xs md:text-sm order-2 sm:order-1">Cancelar</button>
        </div>
    </div>`;
    mc.classList.remove('hidden');
}

function generateChartSVG(token, w, h, simplified) {
    const data = [...token.history];
    if (token.currentCandle) data.push(token.currentCandle);
    const viewData = data.slice(-100); 
    if(viewData.length === 0) return '';

    const pad = simplified ? 0 : 20;
    const iW = w - pad * 2, iH = h - pad * 2;
    const minP = Math.min(...viewData.map(d=>d.low)), maxP = Math.max(...viewData.map(d=>d.high));
    const range = maxP - minP || 1;
    const yPad = range * 0.1;
    const dMin = minP - yPad, dMax = maxP + yPad, dRange = dMax - dMin;
    const getY = (val) => pad + iH - ((val - dMin) / dRange) * iH;
    const space = iW / Math.max(viewData.length, 25);
    const cW = Math.max(2, space * 0.7);

    let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
    if (!simplified) {
        for(let i=1; i<4; i++) {
            const y = pad + iH * (i/4);
            svg += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1" />`;
        }
    }

    viewData.forEach((c, i) => {
        const isUp = c.close >= c.open;
        const color = isUp ? '#10b981' : '#ef4444';
        const x = pad + (i * space) + (space / 2);
        const bY = Math.min(getY(c.open), getY(c.close));
        const bH = Math.max(Math.abs(getY(c.open) - getY(c.close)), 1.5);
        svg += `<line x1="${x}" y1="${getY(c.high)}" x2="${x}" y2="${getY(c.low)}" stroke="${color}" stroke-width="${simplified?1:2}" opacity="0.6"/>`;
        svg += `<rect x="${x - cW/2}" y="${bY}" width="${cW}" height="${bH}" fill="${color}" rx="1" />`;
    });
    svg += `</svg>`;
    return svg;
}

// INIT (Analizar parámetros y empezar)
window.onload = () => {
    // Detectar si la página fue recargada (F5 / Refresh / Pull-to-refresh)
    const navEntries = performance.getEntriesByType("navigation");
    if (navEntries.length > 0 && navEntries[0].type === "reload") {
        window.location.href = 'index.html';
        return; // Detener ejecución para evitar bugs de reconexión
    }

    const profileStr = localStorage.getItem('degen_profile');
    if(!profileStr) { window.location.href = 'index.html'; return; }
    
    STATE.myProfile = JSON.parse(profileStr);
    const urlParams = new URLSearchParams(window.location.search);
    
    // CASO DE CARGAR PARTIDA
    if(urlParams.get('load') === 'true') {
        loadGameFromStorage();
        if(botInterval) clearInterval(botInterval); startBotBrain();
        return;
    }

    const code = urlParams.get('code');
    const isHost = urlParams.get('host') === 'true';
    const isOffline = urlParams.get('offline') === 'true';
    
    // NUEVOS PARÁMETROS: Nombre y Mapa
    const roomName = urlParams.get('name') || 'Sala Degen';
    const hasMap = urlParams.get('map') !== 'false';

    if(!code && !isOffline) { window.location.href = 'index.html'; return; }

    if(isOffline) {
        STATE.roomConfig = {...STATE.roomConfig, code: 'LOCAL', isHost: true, isOffline: true, name: roomName, hasMap: hasMap};
        if(!hasMap) STATE.activeTab = 'market';
        initNetwork('LOCAL', 'offline', STATE.roomConfig.botCount);
    } else if(isHost) {
        STATE.roomConfig = {...STATE.roomConfig, code: code, isHost: true, isOffline: false, name: roomName, hasMap: hasMap};
        if(!hasMap) STATE.activeTab = 'market';
        initNetwork(code, 'host', STATE.roomConfig.botCount);
    } else {
        STATE.roomConfig = {...STATE.roomConfig, code: code, isHost: false, isOffline: false};
        initNetwork(code, 'client');
    }

    if(botInterval) clearInterval(botInterval); startBotBrain();
    requestUIRender(true);
};
</script>
