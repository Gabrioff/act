<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DegenTerminal - Inicio & Salas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="selection:bg-emerald-500/30 text-sm md:text-base flex flex-col w-full h-full">

    <div id="app" class="flex-1 w-full h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 to-slate-900 overflow-y-auto"></div>
    <div id="toasts-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-11/12 max-w-md"></div>
    <input type="file" id="file-loader" accept=".json" class="hidden" onchange="handleFileLoad(event)" />

<script>
const AVATARS = ['👽', '🦍', '🐸', '🐶', '🤖', '💀', '🤡', '🐱', '🦄', '🗿', '🧙‍♂️', '🧛‍♂️', '🤴', '🚀', '💎'];
const Icons = {
    Settings: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0-2.73-.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
    Gamepad: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>`,
    Upload: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
    Globe: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    Users: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    Map: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`
};

const generateId = () => Math.random().toString(36).substr(2, 9);
const generateRoomCode = () => Math.floor(10000 + Math.random() * 90000).toString();

let STATE = {
    route: 'profile',
    myProfile: JSON.parse(localStorage.getItem('degen_profile')) || { id: generateId(), name: '', avatar: '👽' },
    activeRooms: {},
    toasts: []
};

// --- EXPLORADOR DE SALAS (SERVERLESS MQTT) ---
let discoveryClient = null;
function initRoomDiscovery() {
    if(discoveryClient) return;
    const clientId = 'dgn_expl_' + Math.random().toString(16).substr(2, 8);
    discoveryClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId });
    
    discoveryClient.on('connect', () => {
        discoveryClient.subscribe('dgn_global_discovery_v2');
    });

    discoveryClient.on('message', (topic, message) => {
        try {
            const data = JSON.parse(message.toString());
            STATE.activeRooms[data.code] = { ...data, lastSeen: Date.now() };
            if(STATE.route === 'menu') renderRoomsList();
        } catch(e) {}
    });

    setInterval(() => {
        const now = Date.now();
        let changed = false;
        for(let code in STATE.activeRooms) {
            if(now - STATE.activeRooms[code].lastSeen > 8000) { 
                delete STATE.activeRooms[code];
                changed = true;
            }
        }
        if(changed && STATE.route === 'menu') renderRoomsList();
    }, 2000);
}

// --- UTILIDADES ---
function addToast(msg, icon) {
    const id = Date.now() + Math.random(); STATE.toasts.push({ id, msg, icon });
    const c = document.getElementById('toasts-container');
    c.innerHTML = STATE.toasts.map(t => `<div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto"><span>${t.icon}</span> ${t.msg}</div>`).join('');
    setTimeout(() => { STATE.toasts = STATE.toasts.filter(t => t.id !== id); c.innerHTML = STATE.toasts.map(t => `<div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto"><span>${t.icon}</span> ${t.msg}</div>`).join(''); }, 4000);
}

function saveProfile() {
    if(!STATE.myProfile.name.trim()) return addToast("Escribe un nombre", "❌");
    localStorage.setItem('degen_profile', JSON.stringify(STATE.myProfile));
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if(roomParam && roomParam.length === 5) {
        joinGame(roomParam.toUpperCase(), false, false);
    } else {
        STATE.route = 'menu';
        updateUI();
        initRoomDiscovery();
    }
}

function joinGame(code, isHost, isOffline, roomName = '', hasMap = true) {
    localStorage.setItem('degen_profile', JSON.stringify(STATE.myProfile));
    let url = `game.html?code=${code}`;
    if(isHost) url += '&host=true';
    if(isOffline) url += '&offline=true';
    if(roomName) url += `&name=${encodeURIComponent(roomName)}`;
    url += `&map=${hasMap}`;
    window.location.href = url;
}

function handleFileLoad(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const loaded = JSON.parse(e.target.result);
            if(loaded.players && loaded.roomConfig) {
                sessionStorage.setItem('degen_savegame', e.target.result);
                window.location.href = `game.html?load=true`;
            } else { addToast("Archivo inválido.", "❌"); }
        } catch(err) { addToast("Error leyendo archivo.", "❌"); }
    };
    reader.readAsText(file);
}

// --- VISTAS ---
function updateUI() {
    const app = document.getElementById('app');
    if (STATE.route === 'profile') app.innerHTML = ViewProfile();
    else if (STATE.route === 'menu') { app.innerHTML = ViewMenu(); renderRoomsList(); }
}

function ViewProfile() {
    return `
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-sm w-full shadow-2xl animate-fade-in relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-teal-400"></div>
        <h1 class="text-2xl font-black text-center mb-6 text-emerald-400">Crear Identidad</h1>
        <div class="flex justify-center gap-2 flex-wrap mb-6">
            ${AVATARS.map(a => `<button onclick="STATE.myProfile.avatar='${a}'; updateUI();" class="text-3xl p-2 rounded-xl transition-all ${STATE.myProfile.avatar === a ? 'bg-emerald-500/20 scale-110 border border-emerald-500/50' : 'hover:bg-slate-800'}">${a}</button>`).join('')}
        </div>
        <input id="input-name" type="text" placeholder="Tu Alias (Ej. DegenApe)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-6 text-white focus:border-emerald-500 outline-none font-bold transition-colors text-center" value="${STATE.myProfile.name}" oninput="STATE.myProfile.name = this.value" onkeydown="if(event.key==='Enter') saveProfile()">
        <button onclick="saveProfile()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)]">Entrar al Ecosistema</button>
    </div>`;
}

function ViewMenu() {
    return `
    <div class="w-full max-w-4xl flex flex-col md:flex-row gap-6 animate-fade-in my-auto">
        <!-- Columna Izquierda: Controles -->
        <div class="flex flex-col gap-4 w-full md:w-80 shrink-0">
            <div class="text-center mb-2">
                <div class="text-6xl mb-2 animate-bounce cursor-pointer hover:scale-110 transition-transform inline-block" onclick="STATE.route='profile'; updateUI();" title="Cambiar Perfil">${STATE.myProfile.avatar}</div>
                <h1 class="text-2xl font-black text-white tracking-tighter">Degen<span class="text-emerald-400">Terminal</span></h1>
                <div class="text-slate-400 font-bold text-sm mt-1">${STATE.myProfile.name}</div>
            </div>

            <!-- UNIRSE POR CÓDIGO -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl mb-1">
                <label class="text-[10px] text-slate-500 uppercase tracking-widest font-black block mb-3 text-center">Unirse con Código</label>
                <div class="flex gap-2">
                    <input id="input-room-code" type="text" maxlength="5" placeholder="CÓDIGO" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-lg font-mono text-emerald-400 font-black tracking-widest focus:border-emerald-500 outline-none transition-colors shadow-inner uppercase" onkeydown="if(event.key==='Enter') document.getElementById('btn-join-code').click()" />
                    <button id="btn-join-code" onclick="const c=document.getElementById('input-room-code').value.toUpperCase(); if(c.length!==5)return addToast('El código debe tener 5 caracteres', '❌'); joinGame(c, false, false);" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 rounded-xl transition-colors shadow-[0_0_15px_rgba(16,185,129,0.3)] tracking-wider">→</button>
                </div>
            </div>

            <!-- CONFIGURAR Y CREAR SALA -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                <label class="text-[10px] text-slate-500 uppercase tracking-widest font-black block text-center">Configurar Nueva Sala</label>
                <input id="input-room-name" type="text" placeholder="Nombre de la sala..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-emerald-500 outline-none font-bold" />
                
                <label class="flex items-center justify-between bg-slate-950 px-4 py-3 rounded-xl border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition-colors">
                    <div class="flex items-center gap-2 text-sm text-white font-bold">
                        <span class="text-emerald-400">${Icons.Map}</span> Mundo 2D
                    </div>
                    <input type="checkbox" id="input-room-map" checked class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                </label>

                <button onclick="const n=document.getElementById('input-room-name').value || 'Sala de '+STATE.myProfile.name; const m=document.getElementById('input-room-map').checked; joinGame(generateRoomCode(), true, false, n, m);" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl transition-all flex justify-center items-center gap-2 text-sm shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                    ${Icons.Settings} Crear Sala Pública
                </button>
                <button onclick="const n=document.getElementById('input-room-name').value || 'Simulación Local'; const m=document.getElementById('input-room-map').checked; joinGame('LOCAL', true, true, n, m);" class="w-full bg-purple-600/20 text-purple-400 border border-purple-500/30 hover:bg-purple-600/30 font-bold py-3.5 rounded-xl transition-all flex justify-center items-center gap-2 text-sm">
                    ${Icons.Gamepad} Jugar Solo (Offline)
                </button>
            </div>

            <button onclick="document.getElementById('file-loader').click()" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-400 font-bold py-3 rounded-xl transition-colors flex justify-center items-center gap-2 text-xs border border-slate-800">
                ${Icons.Upload} Cargar Partida Guardada
            </button>
        </div>

        <!-- Columna Derecha: Explorador de Salas (Serverless) -->
        <div class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col min-h-[400px]">
            <h2 class="text-lg md:text-xl font-black text-white flex items-center gap-2 border-b border-slate-800 pb-4">${Icons.Globe} Servidores Globales <span class="text-[9px] md:text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded ml-auto uppercase animate-pulse shrink-0">En Vivo</span></h2>
            <p class="text-xs text-slate-500 mt-3 mb-2">Las salas creadas por otros jugadores aparecerán aquí automáticamente (Serverless P2P).</p>
            
            <div id="public-rooms-list" class="flex-1 overflow-y-auto space-y-3 mt-2 pr-1">
                <div class="text-center py-10 text-slate-600 animate-pulse">Buscando servidores en la red...</div>
            </div>
        </div>
    </div>`;
}

function renderRoomsList() {
    const container = document.getElementById('public-rooms-list');
    if(!container) return;
    const rooms = Object.values(STATE.activeRooms);
    
    if(rooms.length === 0) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-slate-500 py-10 opacity-60"><div class="text-4xl mb-3">${Icons.Globe}</div><div class="text-sm font-bold text-center">No hay salas públicas ahora mismo.</div><div class="text-xs mt-1 text-center">¡Sé el primero en crear una!</div></div>`;
        return;
    }

    container.innerHTML = rooms.map(r => `
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-emerald-500/50 transition-all shadow-inner group">
            <div class="flex gap-3 items-center min-w-0">
                <div class="bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-inner shrink-0">${Icons.Users}</div>
                <div class="min-w-0">
                    <div class="text-white font-black text-sm flex items-center gap-2 truncate">
                        <span class="truncate">${r.roomName || 'Sala Degen'}</span>
                        ${r.hasMap ? `<span class="text-[9px] bg-blue-500/20 text-blue-400 px-1.5 py-0.5 rounded uppercase tracking-widest shrink-0 border border-blue-500/30">Mundo 2D</span>` : `<span class="text-[9px] bg-orange-500/20 text-orange-400 px-1.5 py-0.5 rounded uppercase tracking-widest shrink-0 border border-orange-500/30">Solo Trade</span>`}
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono mt-1 font-bold flex flex-wrap gap-3">
                        <span>Host: <span class="text-slate-300">${r.host}</span></span>
                        <span>Jugadores: ${r.players}/${r.max}</span>
                    </div>
                </div>
            </div>
            <button onclick="joinGame('${r.code}', false, false)" class="w-full sm:w-auto bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500 hover:text-slate-900 px-5 py-2.5 rounded-lg text-xs font-black transition-all tracking-wider group-hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0">UNIRSE</button>
        </div>
    `).join('');
}

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if(roomParam && STATE.myProfile.name) {
        joinGame(roomParam.toUpperCase(), false, false);
    } else if(STATE.myProfile.name) {
        STATE.route = 'menu';
        initRoomDiscovery();
    }
    updateUI();
};
</script>
</body>
</html>
