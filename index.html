window.handleImageUpload = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 150;
            let width = img.width;
            let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const dataUrl = canvas.toDataURL('image/webp', 0.8);
            STATE.launchData.image = dataUrl;
            
            const urlInput = document.getElementById('l-image');
            if(urlInput) urlInput.value = '';
            
            const preview = document.getElementById('img-preview');
            if(preview) {
                preview.src = dataUrl;
                preview.classList.remove('hidden');
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
};

function saveGame() {
    if(!STATE.roomConfig.isHost) return alert("Solo el Host puede guardar la partida.");
    const saveData = { players: STATE.players, tokens: STATE.tokens, roomConfig: STATE.roomConfig, chat: STATE.chat, gameState: STATE.gameState };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saveData));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `DegenTerminal_Save_${STATE.roomConfig.code}.json`);
    dlAnchorElem.click();
    addToast("Partida guardada exitosamente", "💾");
}

function handleFileLoad(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const loaded = JSON.parse(e.target.result);
            if(loaded.players && loaded.roomConfig) {
                STATE.players = loaded.players;
                STATE.tokens = loaded.tokens || {};
                STATE.roomConfig = loaded.roomConfig;
                STATE.chat = loaded.chat || [];
                STATE.gameState = loaded.gameState || 'waiting';
                
                const hostProfile = Object.values(STATE.players).find(p => !p.isBot) || STATE.players[Object.keys(STATE.players)[0]];
                STATE.myProfile = { ...hostProfile, isSpeaking: false, peerId: null };
                
                const mode = STATE.roomConfig.isOffline ? 'offline' : (STATE.roomConfig.isHost ? 'host' : 'client');
                initNetwork(STATE.roomConfig.code, mode, STATE.roomConfig.botCount);
                
                STATE.route = STATE.gameState === 'playing' ? 'game' : 'lobby';
                
                addToast("Partida cargada exitosamente", "✅");
                requestUIRender(true);
            } else { alert("Archivo de guardado inválido."); }
        } catch(err) { alert("Error leyendo el archivo."); }
    };
    reader.readAsText(file);
}

function playAudioStream(stream, peerId) {
    let audio = document.getElementById('audio-' + peerId);
    if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'audio-' + peerId;
        audio.autoplay = true;
        document.body.appendChild(audio);
    }
    audio.srcObject = stream;
}

async function toggleVoice() {
    if (STATE.voiceActive) {
        if(voiceInterval) clearInterval(voiceInterval);
        if(audioContext) audioContext.close();
        if(window.localAudioStream) {
            window.localAudioStream.getTracks().forEach(t => t.stop());
            window.localAudioStream = null;
        }
        STATE.voiceActive = false;
        STATE.localSpeaking = false;
        dispatchAction('ACTION_VOICE', { isSpeaking: false });
        tLog("Chat de Voz Desactivado", "text-yellow-400");
        updateUI();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        window.localAudioStream = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        STATE.voiceActive = true;
        tLog("Chat de Voz Activado y Compartiendo", "text-emerald-400");
        updateUI();

        // En modo P2P, emitir streams.
        if (peer && !STATE.roomConfig.isOffline) {
            Object.values(STATE.players).forEach(p => {
                if (!p.isBot && p.peerId && p.id !== STATE.myProfile.id) {
                    const call = peer.call(p.peerId, stream);
                    if(call) { call.on('stream', remoteStream => { playAudioStream(remoteStream, p.id); }); }
                }
            });
        }

        voiceInterval = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<bufferLength; i++) sum += dataArray[i];
            let avg = sum / bufferLength;
            
            let isSpeaking = avg > 15; 
            if(isSpeaking !== STATE.localSpeaking) {
                STATE.localSpeaking = isSpeaking;
                dispatchAction('ACTION_VOICE', { isSpeaking: isSpeaking });
                if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = isSpeaking;
                updateUI();
            }
        }, 150); 
    } catch(e) { 
        console.error(e); 
        tLog("Error WebRTC Audio: Permiso Denegado", "text-red-400");
        alert("Permiso de micrófono denegado o no disponible."); 
    }
}

window.adjustBots = function(targetCount) {
    if (!STATE.roomConfig.isHost) return;
    if (!STATE.roomConfig.botsEnabled) targetCount = 0;
    
    const currentBotKeys = Object.keys(STATE.players).filter(k => STATE.players[k].isBot);
    
    if (currentBotKeys.length < targetCount) {
        const toAdd = targetCount - currentBotKeys.length;
        const startIndex = currentBotKeys.length;
        for (let i = 0; i < toAdd; i++) {
            const strategy = BOT_STRATEGIES[Math.floor(Math.random() * BOT_STRATEGIES.length)];
            const startBal = strategy === 'Whale' ? 200 : (strategy === 'Degen' ? 25 : 10);
            const id = `bot_${Date.now()}_${Math.random().toString(36).substr(2,5)}`;
            STATE.players[id] = { 
                id: id, name: `${strategy}_Bot${startIndex + i}`, avatar: '🤖', 
                solBalance: startBal, portfolio: {}, isBot: true, strategy: strategy,
                reputation: 1, luxuries: [], tradesInfo: {}, isSpeaking: false
            };
        }
    } else if (currentBotKeys.length > targetCount) {
        const toRemove = currentBotKeys.length - targetCount;
        for (let i = 0; i < toRemove; i++) delete STATE.players[currentBotKeys[i]];
    }
    broadcastState();
};

function initNetwork(roomId, mode, customBotCount = 20) {
    if (peer) { peer.destroy(); peer = null; }
    hostConnections = [];
    clientConn = null;
    STATE.netLogs = []; // Reiniciar terminal

    if (mode === 'offline') {
        tLog("Inicializando Entorno Local...", "text-purple-400");
        STATE.roomConfig.isOffline = true;
        STATE.roomConfig.isHost = true;
        STATE.roomConfig.code = 'LOCAL';
        STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, isSpeaking: false };
        window.adjustBots(customBotCount);
        addToast("Modo Offline Activado", "🔌");
        tLog("Simulador Local Activo. 0 Dependencia de red.", "text-emerald-400");
        requestUIRender(true);
        return;
    }

    // Modo Online
    STATE.roomConfig.isOffline = false;
    
    if (mode === 'host') {
        tLog("Solicitando servidor P2P en el navegador Host...", "text-blue-400");
        try {
            peer = new Peer(`degen-p2p-sim-${roomId}`, WEBRTC_CONFIG);
            
            peer.on('open', (id) => {
                STATE.myProfile.peerId = id;
                if (STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].peerId = id;
                tLog(`✓ Servidor STUN/TURN Listo. Código WebRTC: ${id}`, "text-emerald-400");
                addToast(`Sala P2P Servidor Online: ${roomId}`, '🌐');
            });

            peer.on('error', (err) => {
                tLog(`✗ Error PeerJS Host: ${err.type}`, "text-red-500");
                addToast(`Error al crear la sala. Verifica tu conexión.`, '⚠️');
            });
            
            peer.on('connection', (conn) => {
                tLog(`[+] Intento de conexión entrante de un peer...`, "text-yellow-400");
                
                // Monitor de estado ICE
                conn.peerConnection.oniceconnectionstatechange = function() {
                    const state = conn.peerConnection.iceConnectionState;
                    tLog(`> ICE (Red) Status: ${state}`, state === 'connected' ? 'text-emerald-400' : 'text-yellow-400');
                };

                hostConnections.push(conn);
                conn.on('data', (data) => processMessageAsHost(data, conn));
                conn.on('close', () => { 
                    tLog(`[-] Un jugador se ha desconectado.`, "text-red-400");
                    hostConnections = hostConnections.filter(c => c !== conn); 
                });
            });

            peer.on('call', call => {
                if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
            });
        } catch(e) { tLog(`✗ Fallo de red fatal: ${e}`, "text-red-500"); addToast("Error de red.", "🔌"); }

        STATE.players[STATE.myProfile.id] = { ...STATE.myProfile, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, isSpeaking: false };
        window.adjustBots(customBotCount);
        requestUIRender(true);

    } else if (mode === 'client') {
        tLog("Inicializando P2P Client. Evaluando red...", "text-blue-400");
        try {
            peer = new Peer(WEBRTC_CONFIG);
            
            peer.on('open', (id) => {
                STATE.myProfile.peerId = id;
                tLog(`✓ Red lista. Local ID: ${id.substring(0,6)}... Buscando Host: ${roomId}`, "text-emerald-400");
                addToast("Perforando red hacia el Host...", '⏳');
                
                // Conectando al Host (Usando modo reliable para mejor estabilidad a distancia)
                clientConn = peer.connect(`degen-p2p-sim-${roomId}`, { reliable: true });
                
                clientConn.peerConnection.oniceconnectionstatechange = function() {
                    const state = clientConn.peerConnection.iceConnectionState;
                    tLog(`> ICE (Perforación NAT): ${state}`, state === 'connected' ? 'text-emerald-400' : 'text-yellow-400');
                };
                
                clientConn.on('open', () => {
                    tLog(`[+] ¡WebRTC Establecido! Handshake con DB del Host...`, "text-emerald-500 font-bold");
                    clientConn.send({ type: 'JOIN_REQ', payload: STATE.myProfile });
                    addToast("¡Conectado al Host Exitosamente!", '✅');
                });
                
                clientConn.on('data', (data) => processMessageAsClient(data));
                
                clientConn.on('close', () => {
                    tLog(`[-] El Host ha cerrado la conexión P2P.`, "text-red-500");
                    alert("Desconectado del Host.");
                    STATE.route = 'menu';
                    requestUIRender(true);
                });
            });

            peer.on('call', call => {
                if (window.localAudioStream) call.answer(window.localAudioStream); else call.answer(); 
                call.on('stream', remoteStream => playAudioStream(remoteStream, call.peer));
            });

            peer.on('error', (err) => {
                tLog(`✗ Error P2P Fatal: ${err.type}`, "text-red-500");
                if (err.type === 'peer-unavailable') {
                    alert(`No se encontró el Host en el enlace/código: ${roomId}. Pídele a tu amigo que cree la sala primero.`);
                } else if (err.type === 'network' || err.type === 'webrtc') {
                    alert(`La red está bloqueando la conexión P2P (Symmetric NAT no franqueable). Se intentó usar STUN/TURN pero falló. Cambia de Red Wi-Fi a Datos o viceversa.`);
                } else {
                    alert("Error P2P: " + err.type);
                }
                STATE.route = 'menu';
                requestUIRender(true);
            });
        } catch(e) { tLog(`✗ Excepción local: ${e}`, "text-red-500"); alert("Error del navegador al intentar P2P."); }
    }

    if (pingerInterval) clearInterval(pingerInterval);
    pingerInterval = setInterval(() => {
        if (STATE.gameState === 'playing' && !STATE.roomConfig.isHost && clientConn) {
            clientConn.send({ type: 'PING', senderId: STATE.myProfile.id, time: Date.now() });
        }
    }, 2000);
}

function processMessageAsHost(data, conn) {
    const { type, payload, senderId, time } = data;
    if (type === 'PING') { conn.send({ type: 'PONG', target: senderId, time }); return; }
    
    if (type === 'JOIN_REQ') {
        if (Object.keys(STATE.players).length >= STATE.roomConfig.maxPlayers && !STATE.players[payload.id]) {
            conn.send({ type: 'JOIN_REJECT', target: payload.id, reason: 'Sala llena' });
            tLog(`✗ Rechazado: ${payload.name} (Sala Llena)`, "text-red-400");
            return;
        }
        STATE.players[payload.id] = { ...payload, solBalance: 10, portfolio: {}, reputation: 1, luxuries: [], tradesInfo: {}, isSpeaking: false };
        tLog(`✓ Aceptado jugador: ${payload.name} (${payload.id.substring(0,4)}...)`, "text-emerald-400");
        broadcastState();
    }

    if (type === 'ACTION_TRADE') handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, senderId);
    if (type === 'ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, senderId);
    if (type === 'ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, senderId);
    if (type === 'ACTION_CHAT') handleChatHost(payload.msg, senderId, false);
    if (type === 'ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, senderId);
    if (type === 'ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, senderId);
    if (type === 'ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot).length + 1); }
    if (type === 'ACTION_VOICE') {
        if(STATE.players[senderId]) STATE.players[senderId].isSpeaking = payload.isSpeaking;
        broadcastState();
    }
    if (type === 'ACTION_CHARITY') {
        const p = STATE.players[senderId];
        if(p && p.solBalance >= payload.amount) {
            p.solBalance -= payload.amount;
            p.reputation = Math.min(100, (p.reputation || 1) + payload.amount * 5); 
            handleChatHost(`💖 ${p.name} donó ${formatSOL(payload.amount)} a beneficencia!`, senderId, true);
            broadcastState();
        }
    }
}

function processMessageAsClient(data) {
    const { type, payload, senderId, time } = data;
    
    if (type === 'STATE_SYNC') {
        STATE.players = payload.players;
        STATE.tokens = payload.tokens;
        STATE.gameState = payload.gameState;
        STATE.chat = payload.chat;
        
        let force = false;
        if(STATE.route === 'lobby' && STATE.gameState === 'playing') { STATE.route = 'game'; force = true; }
        if(STATE.route === 'menu' && STATE.gameState === 'waiting') { STATE.route = 'lobby'; force = true; }
        requestUIRender(force);
    }
    if (type === 'PONG' && payload.target === STATE.myProfile.id) {
        STATE.ping = Date.now() - time;
        const pingEl = document.getElementById('ping-display');
        if(pingEl) pingEl.innerText = STATE.ping + 'ms';
    }
    if (type === 'JOIN_REJECT' && payload.target === STATE.myProfile.id) {
        tLog(`✗ Servidor rechazó conexión: ${payload.reason}`, "text-red-500");
        alert("Error: " + payload.reason);
        if(peer) { peer.destroy(); peer = null; }
        STATE.route = 'menu';
        requestUIRender(true);
    }
    if (type === 'EVENT_ALERT') {
        if (STATE.trackedIds.has(senderId)) addToast(payload.msg, payload.icon);
    }
}

function broadcastState() {
    if (STATE.roomConfig.isHost) {
        if (!STATE.roomConfig.isOffline) {
            const msg = { type: 'STATE_SYNC', payload: { players: STATE.players, tokens: STATE.tokens, chat: STATE.chat, gameState: STATE.gameState } };
            hostConnections.forEach(conn => conn.send(msg));
        }
        requestUIRender(); 
    }
}

function hostEmitAlert(senderId, msg, icon) {
    if(STATE.roomConfig.isHost) {
        if (!STATE.roomConfig.isOffline) {
            const packet = { type: 'EVENT_ALERT', senderId, payload: { msg, icon } };
            hostConnections.forEach(conn => conn.send(packet));
        }
        // En Host/Offline, mostramos si lo tenemos trackeado
        if (STATE.trackedIds.has(senderId)) addToast(msg, icon);
    }
}

// HOST LOGIC (Cerebro del Mercado)
// ==========================================
function handleTradeHost(tokenId, isBuy, amount, playerId, silent = false) {
    const player = STATE.players[playerId];
    const token = STATE.tokens[tokenId];
    if (!player || !token || amount <= 0) return;

    if (!player.tradesInfo) player.tradesInfo = {};
    let logMsg = '';
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    
    let currentCandle = token.currentCandle;
    if (!currentCandle || Date.now() - currentCandle.time > 5000) { 
        if (currentCandle) token.history.push(currentCandle);
        currentCandle = { time: Date.now(), open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice, vol: 0 };
    }

    if (isBuy) {
        if (player.solBalance < amount) return;
        const tokensOut = calcTokensOut(amount, token.solPool, token.tokenPool);
        token.solPool += amount; token.tokenPool -= tokensOut;
        player.solBalance -= amount; player.portfolio[tokenId] = (player.portfolio[tokenId] || 0) + tokensOut;
        player.tradesInfo[tokenId] = { entryPrice: getPrice(token.solPool, token.tokenPool) };
        
        logMsg = `🟢 ${player.name} compró $${token.ticker}`;
    } else {
        const currentBal = player.portfolio[tokenId] || 0;
        if (currentBal < amount) return;

        if (amount > (token.tokenPool * 0.5)) player.reputation = Math.max(1, (player.reputation || 1) - 30);

        const solOut = calcSolOut(amount, token.solPool, token.tokenPool);
        token.solPool -= solOut; token.tokenPool += amount;
        player.solBalance += solOut; player.portfolio[tokenId] -= amount;
        
        logMsg = `🔴 ${player.name} vendió $${token.ticker}`;
        
        if(player.portfolio[tokenId] <= 0) delete player.tradesInfo[tokenId];
    }

    const newPrice = getPrice(token.solPool, token.tokenPool);
    currentCandle.close = newPrice;
    currentCandle.high = Math.max(currentCandle.high, newPrice);
    currentCandle.low = Math.min(currentCandle.low, newPrice);
    currentCandle.vol += amount;
    token.currentCandle = currentCandle;

    let milestoneMsg = null;
    const mcapUsd = newPrice * token.initialSupply * 150; 
    const realLiq = token.solPool - VIRTUAL_SOL_RESERVE;

    if (!token.milestones) token.milestones = {};
    const creator = STATE.players[token.creatorId];

    if (realLiq >= BONDING_CURVE_LIMIT && !token.milestones.mRaydium) {
        token.milestones.mRaydium = true; milestoneMsg = `👑 $${token.ticker} COMPLETÓ LA CURVA Y SE FUE A RAYDIUM!`;
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 20);
    } else if (mcapUsd >= 1000000 && !token.milestones.m1m) { 
        token.milestones.m1m = true; milestoneMsg = `🚀 $${token.ticker} ALCANZÓ $1M MCap!`; 
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 10); 
    } else if (mcapUsd >= 500000 && !token.milestones.m500k) { 
        token.milestones.m500k = true; milestoneMsg = `🔥 $${token.ticker} superó $500K MCap!`; 
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 5); 
    } else if (mcapUsd >= 100000 && !token.milestones.m100k) { 
        token.milestones.m100k = true; milestoneMsg = `🎉 $${token.ticker} superó $100K MCap!`; 
        if(creator) creator.reputation = Math.min(100, (creator.reputation || 1) + 2); 
    }

    if (!silent || milestoneMsg) {
        if (!silent) STATE.chat.unshift({ id: Date.now() + Math.random(), sender: 'System', text: logMsg, sys: true });
        if (milestoneMsg) STATE.chat.unshift({ id: Date.now() + Math.random(), sender: 'System', text: milestoneMsg, sys: true });
        STATE.chat = STATE.chat.slice(0, 80);
    }
}

function handleLaunchHost(name, ticker, image, devBuy, playerId) {
    const player = STATE.players[playerId];
    const fee = 1; 
    if (!player || player.solBalance < (fee + devBuy)) return;

    player.solBalance -= fee;
    const tokenId = ticker.toUpperCase() + '_' + Date.now();
    const initialPrice = VIRTUAL_SOL_RESERVE / 1000000000; 
    
    STATE.tokens[tokenId] = {
        id: tokenId, name, ticker: ticker.toUpperCase(), image: image, creatorId: playerId, creatorName: player.name,
        solPool: VIRTUAL_SOL_RESERVE, tokenPool: 1000000000, initialSupply: 1000000000, createdAt: Date.now(),
        milestones: {}, history: [],
        currentCandle: { time: Date.now(), open: initialPrice, high: initialPrice, low: initialPrice, close: initialPrice, vol: 0 }
    };
    
    player.reputation = Math.min(100, (player.reputation || 1) + 0.5);

    const logMsg = `🚀 ${player.name} lanzó $${STATE.tokens[tokenId].ticker}`;
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: logMsg, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    
    // Solo mostramos alerta visual P2P/Offline cuando crean tokens
    hostEmitAlert(playerId, logMsg, '🚀');
    
    if (devBuy > 0) handleTradeHost(tokenId, true, devBuy, playerId, false);
    broadcastState();
}

function handleBurnHost(tokenId, amount, playerId) {
    const player = STATE.players[playerId];
    const token = STATE.tokens[tokenId];
    if (!player || !token || !player.portfolio[tokenId] || player.portfolio[tokenId] < amount) return;

    player.portfolio[tokenId] -= amount;
    token.initialSupply -= amount; 
    player.reputation = Math.min(100, (player.reputation || 1) + 1);

    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🔥 ${player.name} quemó ${formatToken(amount)} $${token.ticker}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    broadcastState();
}

function handleGiftHost(targetId, asset, amount, senderId) {
    const sender = STATE.players[senderId];
    const target = STATE.players[targetId];
    if (!sender || !target || amount <= 0) return;

    if (asset === 'SOL') {
        if (sender.solBalance < amount) return;
        sender.solBalance -= amount;
        target.solBalance += amount;
    } else {
        if (!sender.portfolio[asset] || sender.portfolio[asset] < amount) return;
        sender.portfolio[asset] -= amount;
        target.portfolio[asset] = (target.portfolio[asset] || 0) + amount;
    }
    
    sender.reputation = Math.min(100, (sender.reputation || 1) + 0.5);
    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🎁 ${sender.name} le regaló a ${target.name} ${formatToken(amount)} ${asset==='SOL'?'SOL':'Tokens'}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    broadcastState();
}

function handleBuyLuxuryHost(itemId, playerId) {
    const player = STATE.players[playerId];
    let item = null;
    for(const cat in SHOP_CATEGORIES) {
        const found = SHOP_CATEGORIES[cat].find(i => i.id === itemId);
        if(found) item = found;
    }
    if (!player || !item || player.solBalance < item.price) return;

    player.solBalance -= item.price;
    player.luxuries = [...(player.luxuries || []), item.icon];
    player.reputation = Math.min(100, (player.reputation || 1) + item.rep);

    STATE.chat.unshift({ id: Date.now(), sender: 'System', text: `🛒 ${player.name} presumió su nuevo ${item.name} ${item.icon}`, sys: true });
    STATE.chat = STATE.chat.slice(0, 80);
    broadcastState();
}

function handleChatHost(msg, playerId, isSys = false) {
    const senderName = STATE.players[playerId]?.name || 'System';
    STATE.chat.unshift({ id: Date.now(), sender: senderName, text: msg, sys: isSys });
    STATE.chat = STATE.chat.slice(0, 80);
    broadcastState();
}

// ---------------- IA DE LOS BOTS ----------------
function startBotBrain() {
    if(botInterval) clearInterval(botInterval);
    botInterval = setInterval(() => {
        if (!STATE.roomConfig.isHost || !STATE.roomConfig.botsEnabled || STATE.gameState !== 'playing') return;
        
        const botList = Object.values(STATE.players).filter(p => p.isBot);
        if (botList.length === 0) return;

        const tokenKeys = Object.keys(STATE.tokens);
        const activeCount = Math.min(30, Math.max(5, Math.floor(botList.length * 0.08)));
        const activeBots = botList.sort(() => 0.5 - Math.random()).slice(0, activeCount);
        let didTrade = false;

        activeBots.forEach(bot => {
            Object.keys(bot.portfolio).forEach(tokenId => {
                const amount = bot.portfolio[tokenId];
                if (amount <= 0) return;
                const token = STATE.tokens[tokenId];
                if (!token) return;

                const currentPrice = getPrice(token.solPool, token.tokenPool);
                const entryPrice = bot.tradesInfo?.[tokenId]?.entryPrice || currentPrice;
                const pnlPercent = ((currentPrice - entryPrice) / entryPrice) * 100;

                let sellRatio = 0;
                if (pnlPercent <= -20 && bot.strategy !== 'Hodler') sellRatio = 1.0;
                else if (pnlPercent >= 50) sellRatio = bot.strategy === 'Scalper' ? 1.0 : 0.5;
                else {
                    if (bot.strategy === 'Scalper' && Math.random() < 0.1) sellRatio = 0.5;
                    if (bot.strategy === 'Degen' && Math.random() < 0.15) sellRatio = 1.0;
                    if (bot.strategy === 'Whale' && Math.random() < 0.05) sellRatio = 0.8;
                }

                if (sellRatio > 0) { handleTradeHost(tokenId, false, amount * sellRatio, bot.id, true); didTrade = true; }
            });

            if (bot.solBalance > 0.5 && tokenKeys.length > 0 && Math.random() < 0.3) {
                const attractiveTokens = tokenKeys.map(tid => STATE.tokens[tid]).filter(t => {
                    const ageMs = Date.now() - t.createdAt;
                    const creatorRep = STATE.players[t.creatorId]?.reputation || 1;

                    if (bot.strategy === 'Degen') return true; 
                    if (creatorRep < 10) return false; 
                    if (Math.random() > 0.4) return false; 
                    if (bot.strategy === 'Scalper') return (t.solPool - VIRTUAL_SOL_RESERVE) > 2; 
                    if (bot.strategy === 'Hodler') return ageMs > 60000 && (t.solPool - VIRTUAL_SOL_RESERVE) > 5;
                    if (bot.strategy === 'Whale') return (t.solPool - VIRTUAL_SOL_RESERVE) > 10; 
                    return true;
                });

                if (attractiveTokens.length > 0) {
                    const targetToken = attractiveTokens[Math.floor(Math.random() * attractiveTokens.length)];
                    let investRatio = 0.1;
                    if (bot.strategy === 'Degen') investRatio = 0.5; 
                    if (bot.strategy === 'Whale') investRatio = 0.2; 
                    const investAmount = bot.solBalance * investRatio * (0.8 + Math.random() * 0.4); 
                    if (investAmount > 0.1) { handleTradeHost(targetToken.id, true, investAmount, bot.id, true); didTrade = true; }
                }
            }

            const canLaunch = bot.solBalance > 5 && tokenKeys.length < 30;
            const wantsToLaunch = (bot.strategy === 'Degen' && Math.random() < 0.05) || Math.random() < 0.01;
            if (canLaunch && wantsToLaunch) {
                const names = ["PepeBot", "Inu AI", "Safe", "Moon", "Cat", "Doge", "Gold", "Sigma"];
                const tName = names[Math.floor(Math.random()*names.length)] + " " + Math.floor(Math.random()*99);
                handleLaunchHost(tName, tName.substring(0,4).toUpperCase().replace(/\s/g, ''), '', bot.solBalance * 0.1, bot.id);
                didTrade = true;
            }

            if(Math.random() < 0.01) {
                const chatter = ["LFG!! 🚀", "Rug pull incoming 💀", "Dev is cooking 👨‍🍳", "HODL 💎🙌", "Scam?", "WEN RAYDIUM?", "Ape in!"];
                handleChatHost(chatter[Math.floor(Math.random()*chatter.length)], bot.id, false);
                didTrade = true;
            }
        });
        
        if(didTrade) broadcastState();
    }, 1500); 
}

// ==========================================
function dispatchAction(type, payload) {
    if (STATE.roomConfig.isHost) {
        if(type==='ACTION_TRADE') handleTradeHost(payload.tokenId, payload.isBuy, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_LAUNCH') handleLaunchHost(payload.name, payload.ticker, payload.image, payload.devBuy, STATE.myProfile.id);
        if(type==='ACTION_BURN') handleBurnHost(payload.tokenId, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_CHAT') handleChatHost(payload.msg, STATE.myProfile.id, false);
        if(type==='ACTION_GIFT') handleGiftHost(payload.to, payload.asset, payload.amount, STATE.myProfile.id);
        if(type==='ACTION_BUY_LUXURY') handleBuyLuxuryHost(payload.itemId, STATE.myProfile.id);
        if(type==='ACTION_ADD_BOT') { window.adjustBots(Object.keys(STATE.players).filter(k=>STATE.players[k].isBot).length + 1); }
        if(type==='ACTION_VOICE') { if(STATE.players[STATE.myProfile.id]) STATE.players[STATE.myProfile.id].isSpeaking = payload.isSpeaking; broadcastState(); }
        if(type==='ACTION_CHARITY') {
            const player = STATE.players[STATE.myProfile.id];
            if(player.solBalance >= payload.amount) {
                player.solBalance -= payload.amount;
                player.reputation = Math.min(100, (player.reputation || 1) + payload.amount * 5);
                handleChatHost(`💖 ${player.name} donó ${formatSOL(payload.amount)} a beneficencia!`, STATE.myProfile.id, true);
                broadcastState();
            }
        }
    } else {
        if(clientConn) clientConn.send({ type, payload, senderId: STATE.myProfile.id });
    }
}

    updateUI();
}

function setTradeType(type) {
    STATE.tradeType = type;
    STATE.tradeAmount = '';

    updateUI();
}

function addToast(msg, icon) {
    const id = Date.now() + Math.random();
    STATE.toasts.push({ id, msg, icon });
    updateToasts();
    setTimeout(() => {
        STATE.toasts = STATE.toasts.filter(t => t.id !== id);
        updateToasts();
    }, 4000);
}

function updateToasts() {
    const c = document.getElementById('toasts-container');
    if (c) {
        c.innerHTML = STATE.toasts.map(t => `
            <div class="bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-sm animate-fade-in pointer-events-auto">
                <span>${t.icon}</span> ${t.msg}
            </div>
        `).join('');
    }
}

// Smart Render helper for DOM Diffing
function smartRender(containerId, newHTML) {
    const el = document.getElementById(containerId);
    if (!el) return;

    const active = document.activeElement;
    const focusedId = active && active.id ? active.id : null;
    let selStart = 0, selEnd = 0;

    if (focusedId && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
        selStart = active.selectionStart || 0;
        selEnd = active.selectionEnd || 0;
    }

    if (el.innerHTML !== newHTML) { el.innerHTML = newHTML; }

    if (focusedId) {
        const newFocus = document.getElementById(focusedId);
        if (newFocus && typeof newFocus.setSelectionRange === 'function') {
            newFocus.focus();
            try { newFocus.setSelectionRange(selStart, selEnd); } catch(e){}
        } else if (newFocus) { newFocus.focus(); }
    }
}

function requestUIRender(forceFull = false) {
    if (forceFull || STATE.route !== 'game') {
        const app = document.getElementById('app');
        if (STATE.route === 'profile') app.innerHTML = ViewProfile();
        else if (STATE.route === 'menu') app.innerHTML = ViewMenu();
        else if (STATE.route === 'lobby') app.innerHTML = ViewLobby();
        else if (STATE.route === 'game') {
            app.innerHTML = ViewGame();
            STATE._renderedTabId = null; 
            updateDynamicDOM(); 
        }
        return;
    }

    if(uiRenderScheduled) return;
    uiRenderScheduled = true;
    requestAnimationFrame(() => {
        updateDynamicDOM();
        uiRenderScheduled = false;
    });
}

function updateUI() { requestUIRender(true); }

function updateDynamicDOM() {
    const me = STATE.players[STATE.myProfile.id] || { solBalance: 0 };
    const balEl = document.getElementById('my-balance');
    if(balEl) balEl.innerText = formatSOL(me.solBalance);
    
    const chatEl = document.getElementById('chat-list');
    if (chatEl) {
        const chatHTML = STATE.chat.filter(m => STATE.chatTab === 'global' ? !m.sys : m.sys).map(msg => {
            const isImg = msg.text.match(/^https?:\/\/.*\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i) || msg.text.startsWith('data:image');
            return `
            <div class="p-3 rounded-xl ${msg.sys ? 'text-slate-400 font-mono text-[10px] md:text-xs border border-slate-800/50 bg-slate-950/80 shadow-inner' : 'bg-slate-800/80 text-slate-200 border border-slate-700/50'}">
                ${!msg.sys ? `<div class="font-bold text-emerald-400 text-xs mb-1">${msg.sender}</div>` : ''}
                ${isImg ? `<img src="${msg.text}" class="max-w-full rounded-lg mt-2 cursor-pointer border border-slate-700 hover:border-emerald-500 transition-colors" onclick="window.open('${msg.text}', '_blank')"/>` : `<div class="leading-relaxed break-words">${msg.text}</div>`}
            </div>
            `;
        }).join('') || `<div class="text-center text-slate-500 py-10 italic">Aún no hay mensajes.</div>`;
        smartRender('chat-list', chatHTML);
    }

    const el = document.getElementById('tab-content');
    if (!el) return;

    let currentTabId = STATE.selectedTokenId ? 'detail-' + STATE.selectedTokenId + '-' + STATE.tradeType : STATE.activeTab;
    
    if (STATE._renderedTabId !== currentTabId) {
        if (STATE.selectedTokenId) el.innerHTML = RenderTokenDetailSkeleton();
        else if (STATE.activeTab === 'market') el.innerHTML = RenderMarketSkeleton();
        else if (STATE.activeTab === 'portfolio') el.innerHTML = RenderLeaderboardSkeleton();
        else if (STATE.activeTab === 'shop') el.innerHTML = RenderShop();
        else if (STATE.activeTab === 'launch') el.innerHTML = RenderLaunch();
        else if (STATE.activeTab === 'streams') el.innerHTML = RenderStreamsSkeleton();
        else if (STATE.activeTab === 'charity') el.innerHTML = RenderCharity();
        
        STATE._renderedTabId = currentTabId;
    }

    if (STATE.selectedTokenId) UpdateTokenDetailDynamic();
    else if (STATE.activeTab === 'market') UpdateMarketDynamic();
    else if (STATE.activeTab === 'portfolio') UpdateLeaderboardDynamic();
    else if (STATE.activeTab === 'streams') UpdateStreamsDynamic();
}

function UpdateMarketDynamic() {
    const grid = document.getElementById('market-grid');
    if(!grid) return;
    
    const filtered = Object.values(STATE.tokens)
        .sort((a,b) => b.solPool - a.solPool)
        .filter(t => t.name.toLowerCase().includes(STATE.searchQuery.toLowerCase()) || t.ticker.toLowerCase().includes(STATE.searchQuery.toLowerCase()))
        .filter(t => {
            if(STATE.marketFilter === 'human') return !STATE.players[t.creatorId]?.isBot;
            if(STATE.marketFilter === 'bot') return STATE.players[t.creatorId]?.isBot;
            return true;
        });

    if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-500 border border-slate-800 rounded-3xl border-dashed bg-slate-900/30"><div class="text-5xl mb-4 opacity-30">${Icons.Chart}</div><div class="font-bold text-lg text-white">No hay tokens aquí.</div></div>`;
        return;
    }

    grid.innerHTML = filtered.map(token => {
        const progress = Math.min(100, ((token.solPool - VIRTUAL_SOL_RESERVE) / BONDING_CURVE_LIMIT) * 100);
        const isComplete = progress >= 100;
        const imgHTML = token.image && token.image.startsWith('data:image') || (token.image && token.image.startsWith('http')) 
          ? `<img src="${token.image}" class="w-12 h-12 rounded-lg object-cover border border-slate-700" onerror="this.outerHTML='<div class=\\'w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center border border-slate-700\\'>🪙</div>'"/>` 
          : `<div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center border border-slate-700 text-2xl">🪙</div>`;

        return `
        <div onclick="selectToken('${token.id}');" class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-5 cursor-pointer transition-all hover:-translate-y-1 relative overflow-hidden group shadow-lg flex flex-col justify-between min-h-[170px]">
            <div class="absolute bottom-0 left-0 h-1.5 bg-slate-950 w-full"><div class="h-full ${isComplete ? 'bg-purple-500' : 'bg-gradient-to-r from-emerald-600 to-emerald-400'} transition-all" style="width: ${progress}%"></div></div>
            
            <div class="flex justify-between items-start mb-4 z-10 gap-3">
                <div class="shrink-0">${imgHTML}</div>
                <div class="flex-1 min-w-0 pr-2">
                    <h3 class="font-black text-white text-base truncate leading-tight mb-1.5">${token.name}</h3>
                    <span class="text-[10px] font-mono bg-slate-950 text-slate-400 px-2 py-0.5 rounded border border-slate-800 font-bold">$${token.ticker}</span>
                </div>
                <div class="text-right shrink-0">
                    <div class="text-sm font-mono font-bold ${isComplete ? 'text-purple-400 animate-pulse' : 'text-emerald-400'}">${getPrice(token.solPool, token.tokenPool).toFixed(8)}</div>
                    <div class="text-[10px] text-slate-500 font-bold uppercase mt-1">Vol: ${formatSOL(token.solPool - VIRTUAL_SOL_RESERVE)}</div>
                </div>
            </div>
            <div class="h-16 w-full opacity-70 mt-auto">${generateChartSVG(token, 300, 64, true)}</div>
        </div>`;
    }).join('');
}

function UpdateTokenDetailDynamic() {
    const token = STATE.tokens[STATE.selectedTokenId];
    if (!token) return;
    const me = STATE.players[STATE.myProfile.id];
    const currentPrice = getPrice(token.solPool, token.tokenPool);
    const mcap = currentPrice * token.initialSupply * 150; 
    const balTokens = me.portfolio[token.id] || 0;
    
    const numAmt = parseFloat(document.getElementById('t-amount')?.value || STATE.tradeAmount) || 0;
    let estimated = 0;
    if(STATE.tradeType === 'buy' && numAmt > 0) estimated = calcTokensOut(numAmt, token.solPool, token.tokenPool);
    if(STATE.tradeType === 'sell' && numAmt > 0) estimated = calcSolOut(numAmt, token.solPool, token.tokenPool);

    const progress = Math.min(100, ((token.solPool - VIRTUAL_SOL_RESERVE) / BONDING_CURVE_LIMIT) * 100);
    const isComplete = progress >= 100;

    const dRep = document.getElementById('tok-dev-rep'); if(dRep) { dRep.innerText = STATE.players[token.creatorId]?.reputation || 1; dRep.className = (STATE.players[token.creatorId]?.reputation || 1) > 70 ? 'text-emerald-400' : 'text-slate-300'; }
    const prEl = document.getElementById('tok-price'); if(prEl) { prEl.innerHTML = currentPrice.toFixed(8) + ' <span class="text-sm text-slate-500">SOL</span>'; prEl.className = `text-xl md:text-3xl font-mono font-black ${isComplete ? 'text-purple-400' : 'text-emerald-400'}`; }
    const mcEl = document.getElementById('tok-mcap'); if(mcEl) mcEl.innerText = formatSOL(mcap / 150);
    
    const pLbl = document.getElementById('tok-prog-lbl'); if(pLbl) pLbl.className = isComplete ? 'text-purple-400 animate-pulse' : '';
    const pTxt = document.getElementById('tok-prog-text'); if(pTxt) pTxt.innerText = progress.toFixed(1) + '%';
    const pBar = document.getElementById('tok-prog-bar'); if(pBar) { pBar.style.width = progress + '%'; pBar.className = `h-full transition-all duration-500 ${isComplete ? 'bg-gradient-to-r from-purple-600 to-purple-400' : 'bg-gradient-to-r from-emerald-600 to-emerald-400'}`; }
    
    const chEl = document.getElementById('tok-chart'); if(chEl) chEl.innerHTML = generateChartSVG(token, 800, 400, false);
    
    const tBal = document.getElementById('tok-bal-base'); if(tBal) tBal.innerText = STATE.tradeType==='buy'?formatSOL(me.solBalance):formatToken(balTokens);
    const eRec = document.getElementById('tok-est-rec'); if(eRec) eRec.innerText = STATE.tradeType==='buy'?formatToken(estimated):formatSOL(estimated);
    const rLiq = document.getElementById('tok-real-liq'); if(rLiq) rLiq.innerText = formatSOL(token.solPool - VIRTUAL_SOL_RESERVE);

    const pctBtns = document.getElementById('tok-pct-btns');
    if(pctBtns) {
        pctBtns.innerHTML = [1, 10, 50, 100].map(pct => `
            <button onclick="const am = STATE.tradeType === 'buy' ? (Math.max(0, ${me.solBalance} - 0.01) * ${pct/100}).toFixed(4) : (${balTokens} * ${pct/100}).toFixed(0); STATE.tradeAmount = am; document.getElementById('t-amount').value = am; UpdateTokenDetailDynamic();" class="flex-1 bg-slate-950 border border-slate-800 hover:border-emerald-500/50 hover:bg-emerald-500/10 text-slate-400 hover:text-emerald-400 text-[10px] md:text-xs py-2.5 rounded-lg font-bold font-mono transition-all shadow-inner">
                ${pct}%
            </button>
        `).join('');
    }

    const tools = document.getElementById('tok-tools');
    if(tools) {
        tools.innerHTML = `
            <button onclick="const b = prompt('¿Quemar tokens? Se restarán de tu inventario y del Supply Total para subir el precio base.'); if(b && Number(b)>0){ dispatchAction('ACTION_BURN', { tokenId: '${token.id}', amount: Number(b) }); }" ${balTokens <= 0 ? 'disabled' : ''} class="flex-1 bg-orange-500/10 text-orange-500 border border-orange-500/30 hover:bg-orange-500/20 rounded-xl py-3 text-[10px] font-black flex justify-center items-center gap-2 transition-all disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-widest">
                ${Icons.Flame} Quemar
            </button>
            ${token.creatorId === me.id ? `
            <button onclick="if(window.confirm('RUG PULL: ¿Vender 100% de tu inventario de golpe? Perderás reputación drásticamente.')){ dispatchAction('ACTION_TRADE', { tokenId: '${token.id}', isBuy: false, amount: ${balTokens} }); }" class="flex-1 bg-red-950/40 text-red-500 border border-red-900/50 hover:bg-red-900/60 rounded-xl py-3 text-[10px] font-black flex justify-center items-center gap-2 transition-all uppercase tracking-widest">
                ${Icons.Alert} Rug Pull
            </button>` : ''}
        `;
    }

    const holders = Object.values(STATE.players).filter(p => p.portfolio[token.id] > 0)
        .map(p => ({ ...p, tokenAmount: p.portfolio[token.id], pct: (p.portfolio[token.id]/token.initialSupply)*100 }))
        .sort((a,b) => b.tokenAmount - a.tokenAmount).slice(0, 50);
        
    const hList = document.getElementById('tok-holders');
    if(hList) {

// ---------------- SVG CHART GENERATOR ----------------
function generateChartSVG(token, w, h, simplified) {
    const data = [...token.history];
    if (token.currentCandle) data.push(token.currentCandle);
    const viewData = data.slice(-100); 
    if(viewData.length === 0) return '';

    const pad = simplified ? 0 : 20;
    const iW = w - pad * 2, iH = h - pad * 2;
    const minP = Math.min(...viewData.map(d=>d.low)), maxP = Math.max(...viewData.map(d=>d.high));
    const range = maxP - minP || 1;
    const yPad = range * 0.1;
    const dMin = minP - yPad, dMax = maxP + yPad, dRange = dMax - dMin;
    const getY = (val) => pad + iH - ((val - dMin) / dRange) * iH;
    const space = iW / Math.max(viewData.length, 25);
    const cW = Math.max(2, space * 0.7);

    let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
    
    if (!simplified) {
        for(let i=1; i<4; i++) {
            const y = pad + iH * (i/4);
            svg += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1" />`;
        }
    }

    viewData.forEach((c, i) => {
        const isUp = c.close >= c.open;
        const color = isUp ? '#10b981' : '#ef4444';
        const x = pad + (i * space) + (space / 2);
        const bY = Math.min(getY(c.open), getY(c.close));
        const bH = Math.max(Math.abs(getY(c.open) - getY(c.close)), 1.5);
        svg += `<line x1="${x}" y1="${getY(c.high)}" x2="${x}" y2="${getY(c.low)}" stroke="${color}" stroke-width="${simplified?1:2}" opacity="0.6"/>`;
        svg += `<rect x="${x - cW/2}" y="${bY}" width="${cW}" height="${bH}" fill="${color}" rx="1" />`;
    });
    svg += `</svg>`;
    return svg;
}

    }).join('');

    mc.innerHTML = `
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-sm w-full relative shadow-2xl animate-fade-in my-auto">
        <button onclick="STATE.viewingProfileId=null; STATE.giftTargetId=null; document.getElementById('modal-container').classList.add('hidden');" class="absolute top-5 right-5 text-slate-500 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition-colors">✕</button>
        <div class="text-center mb-6">
            <div class="text-6xl mb-3 relative inline-block">
                ${p.avatar}
                ${p.isSpeaking ? `<div class="absolute inset-0 speaking-ring border-emerald-500"></div>` : ''}
            </div>
            <h2 class="text-2xl font-black text-white flex items-center justify-center gap-2">
                ${p.name} ${isMe ? '<span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded uppercase tracking-wider">Tú</span>' : ''}
            </h2>
            <div class="text-xs text-slate-500 font-mono font-bold uppercase tracking-widest mt-2">${p.isBot ? `Bot IA: ${p.strategy}` : 'Jugador Humano'}</div>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-950 p-4 rounded-2xl text-center border border-slate-800 shadow-inner">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Reputación</div>
                <div class="font-black text-lg flex items-center justify-center gap-1 ${p.reputation > 70 ? 'text-emerald-400' : p.reputation < 30 ? 'text-red-400' : 'text-yellow-400'}"><span class="text-slate-600">${Icons.Shield}</span> ${p.reputation}</div>
            </div>
            <div class="bg-slate-950 p-4 rounded-2xl text-center border border-slate-800 shadow-inner">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Valor Neto</div>
                <div class="font-black text-lg text-emerald-400 font-mono">${formatSOL(estVal)}</div>
            </div>
        </div>

        ${p.luxuries && p.luxuries.length > 0 ? `
        <div class="mb-6 text-center text-2xl bg-slate-950 py-3 rounded-2xl border border-slate-800 shadow-inner tracking-widest flex flex-wrap justify-center gap-1">
            ${p.luxuries.join(' ')}
        </div>` : ''}

        <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Portafolio Activo</div>
        <div class="space-y-2 max-h-40 overflow-y-auto mb-6 pr-1">
            ${tokensHTML || '<div class="text-sm text-slate-600 text-center py-4 font-bold bg-slate-950 rounded-xl border border-slate-800 border-dashed">Sin inversiones</div>'}
        </div>

        ${!isMe ? `
        <button onclick="if(STATE.trackedIds.has('${p.id}')) STATE.trackedIds.delete('${p.id}'); else STATE.trackedIds.add('${p.id}'); renderModal();" class="w-full py-4 rounded-xl font-black text-sm uppercase tracking-widest transition-all flex justify-center items-center gap-2 ${isTracked ? 'bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 shadow-[0_0_15px_rgba(16,185,129,0.1)]'}">
            ${isTracked ? Icons.Eye + ' Dejar de Seguir' : Icons.Check + ' Trackear Carteras'}
        </button>
        ` : ''}
    </div>`;
    mc.classList.remove('hidden');
}

function renderGiftModal() {
    const mc = document.getElementById('modal-container');
    if(!STATE.giftTargetId) { mc.classList.add('hidden'); return; }
    const p = STATE.players[STATE.giftTargetId];
    
    mc.innerHTML = `
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-sm w-full shadow-2xl animate-fade-in my-auto">
        <h3 class="text-2xl font-black text-white mb-2 flex items-center gap-3">${Icons.Gift} Donación</h3>
        <div class="text-sm text-slate-500 mb-6">Enviando SOL a <span class="font-bold text-white">${p.name}</span>. Esto mejorará tu reputación.</div>
        
        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 block">Monto en SOL</label>
        <input id="g-amount" type="number" placeholder="0.00" value="${STATE.giftAmount}" oninput="STATE.giftAmount = this.value" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-emerald-400 font-mono text-xl focus:outline-none focus:border-emerald-500 mb-6 transition-colors" />
        
        <div class="flex flex-col sm:flex-row gap-3">
            <button onclick="const a=parseFloat(STATE.giftAmount); if(a>0){ dispatchAction('ACTION_GIFT', {to:'${STATE.giftTargetId}', asset:'SOL', amount:a}); STATE.giftTargetId=null; STATE.giftAmount=''; document.getElementById('modal-container').classList.add('hidden'); }" class="flex-1 bg-emerald-500 text-slate-950 font-black py-4 sm:py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-emerald-400 transition-all uppercase tracking-wider text-sm order-1 sm:order-2">Enviar</button>
            <button onclick="STATE.viewingProfileId=null; STATE.giftTargetId=null; document.getElementById('modal-container').classList.add('hidden');" class="w-full sm:w-auto px-6 bg-slate-800 text-white font-bold py-4 sm:py-3.5 rounded-xl hover:bg-slate-700 transition-colors uppercase tracking-wider text-sm order-2 sm:order-1">Cancelar</button>
        </div>
    </div>`;
    mc.classList.remove('hidden');
}

// INIT
window.onload = () => {
    // Al cargar, verificamos si hay un parámetro ?room=XXXXX en la URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if(roomParam && roomParam.length === 5) {
        STATE.pendingRoomCode = roomParam.toUpperCase();
    }

    if(botInterval) clearInterval(botInterval);
    startBotBrain();
    requestUIRender(true);
};
</script>
</body>
</html>
